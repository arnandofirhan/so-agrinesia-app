<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Stock Opname — Agrinesia</title>

  <!-- ===================== GANTI INI ===================== -->
  <!-- Ganti URL di bawah dengan URL /exec Web App Stock Opname kamu.
       Contoh: https://script.google.com/macros/s/AKfycb.../exec -->
  <script>
    var SO_APP_URL = "https://script.google.com/a/macros/agrinesia.co.id/s/AKfycbyHxJXf9BME1mIEyo9ZxjH0y-MxvK2EMkM1CQRabMhGbn02eOCwOyyy2GglnhV4spJSeQ/exec";
  </script>
  <!-- ======================================================== -->

  <!-- PERCEPAT LOADING: buka koneksi (DNS + TLS handshake) ke domain
       script.google.com dan googleusercontent.com (tempat isi app SO
       akhirnya di-serve setelah redirect /exec) SEDINI mungkin, sebelum
       iframe sempat diminta. Browser jadi sudah "siap sambung" duluan,
       memotong sebagian waktu yang biasanya baru mulai begitu iframe.src
       diisi lewat JS di bawah — mempercepat splash "Memuat aplikasi..."
       tanpa mengubah proses loading app SO itu sendiri sama sekali. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f4d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock Opname">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0f4d2e;
    }
    /* ===== Pengukur safe-area (notch/Dynamic Island/home-indicator) =====
       Dokumen INI (top-level, bukan di dalam iframe) yang bisa membaca
       env(safe-area-inset-*) dengan benar di Safari iOS — app SO di
       dalam iframe TIDAK BISA membacanya sendiri (batasan keamanan
       iframe cross-origin script.google.com/googleusercontent.com).
       #safeAreaProbe murni elemen bantu 0x0 supaya JS bisa "mengintip"
       nilai env() lewat getComputedStyle (env() tidak bisa dibaca
       langsung dari JS), lalu nilainya dikirim ke iframe lewat
       postMessage (lihat script di bawah). Tidak terlihat & tidak
       memengaruhi layout apa pun. */
    #safeAreaProbe {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      width: 0;
      height: 0;
      pointer-events: none;
      visibility: hidden;
    }
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* ===================== SPLASH SCREEN ===================== */
    /* Splash modern selagi iframe app SO memuat: gradient bergerak halus,
       logo dengan efek glow + pulse, ring loading, dan teks fade/shimmer.
       Semua CSS-only (tidak ada library tambahan) supaya tetap ringan
       dan tidak nambah request network sebelum app SO sendiri kebuka. */
    #splash {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 2;
      background: radial-gradient(120% 120% at 50% 15%, #16653c 0%, #0f4d2e 45%, #0a3a22 100%);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    /* Beberapa blob cahaya lembut yang mengambang pelan di background,
       biar tidak terasa flat/statis. Murni dekoratif. */
    #splash::before,
    #splash::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
    }
    #splash::before {
      background: #d99a4e;
      top: -60px;
      left: -60px;
      animation: floatBlob1 7s ease-in-out infinite;
    }
    #splash::after {
      background: #2e8f5c;
      bottom: -80px;
      right: -60px;
      animation: floatBlob2 8s ease-in-out infinite;
    }
    @keyframes floatBlob1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(30px, 25px) scale(1.15); }
    }
    @keyframes floatBlob2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-25px, -20px) scale(1.1); }
    }

    #splash .logo-wrap {
      position: relative;
      width: 148px;
      height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* Ring loading yang berputar mengelilingi logo, dengan gradient
       trail (bukan solid arc) supaya terasa lebih premium & bukan
       spinner generik. */
    #splash .spin-ring {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(224, 168, 92, 0) 30deg,
        rgba(224, 168, 92, 0.9) 300deg,
        rgba(224, 168, 92, 1) 360deg
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      animation: spinRing 1.3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    /* Glow lembut berdenyut di belakang logo — kini beririsan dengan
       glow bawaan icon PNG sendiri (icon-any-*.png sudah punya soft
       glow terpahat di filenya), sehingga transisi dari native splash
       Android ke splash custom ini nyaris tak terlihat sebagai "loncatan
       gaya" karena keduanya sama-sama menampilkan logo yang "menyala". */
    #splash .logo-glow {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
      filter: blur(14px);
      opacity: 0.4;
      animation: glowPulse 2.2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50%      { opacity: 0.55; transform: scale(1.08); }
    }

    #splash img {
      position: relative;
      width: 112px;
      height: 112px;
      border-radius: 26px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.32);
      opacity: 0;
      animation: logoEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 logoPulse 2.2s ease-in-out 0.5s infinite;
    }
    @keyframes logoEnter {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    #splash .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.35s forwards;
    }

    #splash .txt {
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Titik-titik "..." yang berkedip bergantian, dipisah dari teks
       supaya lebih hidup daripada teks statis "Memuat...". */
    #splash .txt .dot {
      animation: dotBlink 1.4s ease-in-out infinite;
      opacity: 0.2;
    }
    #splash .txt .dot:nth-child(2) { animation-delay: 0.2s; }
    #splash .txt .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: 0.2; }
      40%           { opacity: 1; }
    }

    #splash.hide {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="safeAreaProbe"></div>
  <div id="splash">
    <div class="logo-wrap">
      <div class="spin-ring"></div>
      <div class="logo-glow"></div>
      <img src="icon-192.png" alt="Stock Opname">
    </div>
    <div class="brand">Stock Opname</div>
    <div class="txt">
      <span>Memuat aplikasi</span>
      <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
  </div>
  <!--
    PENTING soal kamera: JANGAN ganti ini jadi navigasi top-level
    (window.location = SO_APP_URL). App SO (JavaScript.html, fungsi
    isRunningAsPwa()) SENGAJA mengecek window.matchMedia('(display-mode:
    standalone)') pada TOP-LEVEL window untuk memutuskan apakah fitur Scan
    Barcode boleh dipakai. Kalau top-level window dinavigasi keluar dari
    origin/scope PWA ini (ke script.google.com), Android/Chrome keluar dari
    mode standalone WebAPK, display-mode berubah, dan app SO otomatis
    mengunci fitur scan (nampilin modal "Install Aplikasi Dulu") — walau
    sebenarnya app sudah ter-install. Makanya HARUS tetap iframe, supaya
    top-level document (index.html di GitHub Pages ini) yang tetap
    standalone, sementara isi app SO dimuat di iframe di dalamnya.

    Yang sebelumnya kurang: atribut "allow" pada iframe ini TIDAK
    menyertakan "camera" (cuma clipboard-write), sehingga browser
    memblokir permission delegation ke iframe SEBELUM sempat sampai ke
    getUserMedia()/Html5Qrcode di dalamnya. Ditambahkan camera & microphone
    di bawah.
  -->
  <iframe id="appFrame" title="Stock Opname" allow="camera; microphone; clipboard-write; clipboard-read" fetchpriority="high" loading="eager"></iframe>

  <script>
    (function () {
      var frame = document.getElementById('appFrame');
      var splash = document.getElementById('splash');

      if (!SO_APP_URL || SO_APP_URL.indexOf('GANTI_DENGAN_URL_EXEC_KAMU') !== -1) {
        splash.innerHTML = '<div class="txt" style="max-width:80%;text-align:center;line-height:1.5;">'
          + 'URL app belum diisi.<br>Edit index.html, ganti nilai <b>SO_APP_URL</b> '
          + 'dengan URL /exec Web App Stock Opname kamu.</div>';
        return;
      }

      frame.addEventListener('load', function () {
        splash.classList.add('hide');
        // Delay penghapusan splash dari layout dipangkas (300ms -> 180ms,
        // mengikuti durasi transisi #splash.hide yang juga sudah 0.4s->
        // dipercepat) supaya transisi ke app terasa lebih sigap, bukan
        // menunggu lama padahal app sebenarnya sudah selesai dimuat.
        setTimeout(function () { splash.style.display = 'none'; }, 180);
      });

      // Set src SESEGERA MUNGKIN (baris ini, bukan ditunda lewat
      // requestAnimationFrame/setTimeout/DOMContentLoaded) — begitu skrip
      // ini jalan, permintaan jaringan ke SO_APP_URL langsung ditembakkan.
      // Dikombinasikan dengan <link rel="preconnect"> di <head>, koneksi
      // TLS ke script.google.com biasanya sudah "siap" duluan sebelum
      // baris ini sempat berjalan, sehingga permintaan pertama tidak lagi
      // menunggu DNS+handshake dari nol.
      frame.src = SO_APP_URL;

      // ===== Kirim safe-area ke app SO di dalam iframe =====
      // App SO (JavaScript.html) sudah punya listener 'message' yang
      // menunggu { type: 'so_safe_area', top, bottom, left, right } untuk
      // mengisi padding notch/Dynamic Island/home-indicator di iPhone —
      // TAPI sebelumnya shell ini (index.html) tidak pernah benar-benar
      // mengirim pesan itu, jadi nilainya selalu 0 dan topbar/bottom-nav
      // app SO mepet ke notch/status-bar (dilaporkan user, tampilan
      // "berantakan" khusus di iPhone). Fungsi di bawah membaca
      // #safeAreaProbe (lihat CSS di atas) lalu mem-postMessage-kan
      // nilainya ke iframe SETIAP kali ukurannya mungkin berubah (load
      // awal, resize, ganti orientasi, splash hilang) supaya app SO
      // selalu punya nilai terbaru & akurat.
      function sendSafeArea() {
        try {
          var cs = getComputedStyle(document.getElementById('safeAreaProbe'));
          var payload = {
            type: 'so_safe_area',
            top: parseFloat(cs.top) || 0,
            right: parseFloat(cs.right) || 0,
            bottom: parseFloat(cs.bottom) || 0,
            left: parseFloat(cs.left) || 0
          };
          if (frame.contentWindow) {
            frame.contentWindow.postMessage(payload, '*');
          }
        } catch (e) { /* aman diabaikan — tidak boleh sampai memutus app */ }
      }

      // Kirim segera setelah iframe selesai load (kondisi paling penting —
      // saat itulah app SO baru siap menerima & memasang listener-nya),
      // lalu ulangi beberapa kali di detik-detik awal untuk jaga-jaga app
      // SO belum sempat pasang listener persis saat pesan pertama tiba
      // (race condition kecil antar dua dokumen berbeda).
      frame.addEventListener('load', function () {
        sendSafeArea();
        setTimeout(sendSafeArea, 300);
        setTimeout(sendSafeArea, 1000);
        setTimeout(sendSafeArea, 2000);
      });

      // Ganti orientasi (potrait <-> landscape) mengubah nilai
      // safe-area-inset-left/right vs top/bottom di iPhone (notch pindah
      // sisi) — kirim ulang supaya app SO ikut menyesuaikan.
      window.addEventListener('resize', sendSafeArea);
      window.addEventListener('orientationchange', function () {
        setTimeout(sendSafeArea, 300);
      });
    })();
  </script>
</body>
</html>
