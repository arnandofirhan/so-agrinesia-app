<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Stock Opname — Agrinesia</title>

  <script>
    var SO_APP_URL = "https://script.google.com/a/macros/agrinesia.co.id/s/AKfycbyHxJXf9BME1mIEyo9ZxjH0y-MxvK2EMkM1CQRabMhGbn02eOCwOyyy2GglnhV4spJSeQ/exec";
  </script>

  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f4d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock Opname">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0f4d2e;
    }
    /* iframe TETAP fullscreen edge-to-edge (tidak dimundurkan dari sisi
       manapun) supaya tampilan tetap mulus, bukan "mengambang" dengan
       bingkai. Info notch dikirim ke DALAM iframe lewat postMessage
       (lihat script di bawah) supaya app di dalamnya bisa menyesuaikan
       topbar/bottom-nav sendiri — bukan lewat CSS env() di shell ini,
       yang kalau dipakai untuk memundurkan iframe malah bikin app
       kelihatan berbingkai/kepotong dari tampilan (feedback user). */
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #splash {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 2;
      background: radial-gradient(120% 120% at 50% 15%, #16653c 0%, #0f4d2e 45%, #0a3a22 100%);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    #splash::before,
    #splash::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
    }
    #splash::before {
      background: #d99a4e;
      top: -60px;
      left: -60px;
      animation: floatBlob1 7s ease-in-out infinite;
    }
    #splash::after {
      background: #2e8f5c;
      bottom: -80px;
      right: -60px;
      animation: floatBlob2 8s ease-in-out infinite;
    }
    @keyframes floatBlob1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(30px, 25px) scale(1.15); }
    }
    @keyframes floatBlob2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-25px, -20px) scale(1.1); }
    }

    #splash .logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    #splash .spin-ring {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(224, 168, 92, 0) 30deg,
        rgba(224, 168, 92, 0.9) 300deg,
        rgba(224, 168, 92, 1) 360deg
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      animation: spinRing 1.3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    #splash .logo-glow {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
      filter: blur(14px);
      opacity: 0.4;
      animation: glowPulse 2.2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50%      { opacity: 0.55; transform: scale(1.08); }
    }

    #splash img {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
      opacity: 0;
      animation: logoEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 logoPulse 2.2s ease-in-out 0.5s infinite;
    }
    @keyframes logoEnter {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    #splash .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.35s forwards;
    }

    #splash .txt {
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #splash .txt .dot {
      animation: dotBlink 1.4s ease-in-out infinite;
      opacity: 0.2;
    }
    #splash .txt .dot:nth-child(2) { animation-delay: 0.2s; }
    #splash .txt .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: 0.2; }
      40%           { opacity: 1; }
    }

    #splash.hide {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-wrap">
      <div class="spin-ring"></div>
      <div class="logo-glow"></div>
      <img src="icon-192.png" alt="Stock Opname">
    </div>
    <div class="brand">Stock Opname</div>
    <div class="txt">
      <span>Memuat aplikasi</span>
      <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
  </div>
  <iframe id="appFrame" title="Stock Opname" allow="camera; microphone; clipboard-write; clipboard-read" fetchpriority="high" loading="eager"></iframe>

  <script>
    (function () {
      var frame = document.getElementById('appFrame');
      var splash = document.getElementById('splash');

      if (!SO_APP_URL || SO_APP_URL.indexOf('GANTI_DENGAN_URL_EXEC_KAMU') !== -1) {
        splash.innerHTML = '<div class="txt" style="max-width:80%;text-align:center;line-height:1.5;">'
          + 'URL app belum diisi.<br>Edit index.html, ganti nilai <b>SO_APP_URL</b> '
          + 'dengan URL /exec Web App Stock Opname kamu.</div>';
        return;
      }

      frame.addEventListener('load', function () {
        splash.classList.add('hide');
        setTimeout(function () { splash.style.display = 'none'; }, 180);
        sendSafeAreaToFrame();
      });

      // Kirim ukuran notch/Dynamic Island/home-indicator device ke DALAM
      // iframe lewat postMessage — cara ini dipakai karena browser tidak
      // pernah menyalurkan env(safe-area-inset-*) ke iframe cross-origin
      // secara otomatis (pembatasan keamanan browser). Shell ini (sebagai
      // dokumen top-level yang benar-benar terhubung ke device) BISA
      // membaca nilai aslinya lewat elemen bantu tak-terlihat yang
      // ukurannya diatur via env(), lalu diteruskan sebagai angka biasa.
      // App di dalam iframe (JavaScript.html) perlu menangkap pesan ini
      // dan mengeset CSS variable, misalnya document.documentElement.
      // style.setProperty('--safe-top', px + 'px'), lalu Stylesheet.html
      // memakai var(--safe-top, 0px) di topbar/bottom-nav alih-alih
      // env(safe-area-inset-top) yang tidak akan pernah terbaca di sana.
      var safeAreaProbe = document.createElement('div');
      safeAreaProbe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
        'padding-top:env(safe-area-inset-top,0px);' +
        'padding-bottom:env(safe-area-inset-bottom,0px);' +
        'padding-left:env(safe-area-inset-left,0px);' +
        'padding-right:env(safe-area-inset-right,0px);' +
        'pointer-events:none;visibility:hidden;';
      document.body.appendChild(safeAreaProbe);

      function sendSafeAreaToFrame() {
        var cs = getComputedStyle(safeAreaProbe);
        var payload = {
          type: 'so_safe_area',
          top: parseFloat(cs.paddingTop) || 0,
          bottom: parseFloat(cs.paddingBottom) || 0,
          left: parseFloat(cs.paddingLeft) || 0,
          right: parseFloat(cs.paddingRight) || 0
        };
        try {
          frame.contentWindow.postMessage(payload, '*');
        } catch (e) { /* no-op, cross-origin belum siap / iframe belum load */ }
      }
      // Kirim ulang saat orientasi berubah (nilai notch bisa berbeda
      // landscape vs portrait di beberapa device) & sesaat setelah load
      // (jaga-jaga app di dalam iframe baru pasang listener belakangan).
      window.addEventListener('orientationchange', function () {
        setTimeout(sendSafeAreaToFrame, 300);
      });
      setTimeout(sendSafeAreaToFrame, 800);

      frame.src = SO_APP_URL;
    })();
  </script>
</body>
</html>
