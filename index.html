<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Stock Opname — Agrinesia</title>

  <!-- ===================== GANTI INI ===================== -->
  <!-- Ganti URL di bawah dengan URL /exec Web App Stock Opname kamu.
       Contoh: https://script.google.com/macros/s/AKfycb.../exec -->
  <script>
    var SO_APP_URL = "https://script.google.com/a/macros/agrinesia.co.id/s/AKfycbyHxJXf9BME1mIEyo9ZxjH0y-MxvK2EMkM1CQRabMhGbn02eOCwOyyy2GglnhV4spJSeQ/exec";
  </script>
  <!-- ======================================================== -->

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f4d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock Opname">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0f4d2e;
    }
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* ===================== SPLASH SCREEN ===================== */
    /* Splash modern selagi iframe app SO memuat: gradient bergerak halus,
       logo dengan efek glow + pulse, ring loading, dan teks fade/shimmer.
       Semua CSS-only (tidak ada library tambahan) supaya tetap ringan
       dan tidak nambah request network sebelum app SO sendiri kebuka. */
    #splash {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 2;
      background: radial-gradient(120% 120% at 50% 15%, #16653c 0%, #0f4d2e 45%, #0a3a22 100%);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Beberapa blob cahaya lembut yang mengambang pelan di background,
       biar tidak terasa flat/statis. Murni dekoratif. */
    #splash::before,
    #splash::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
    }
    #splash::before {
      background: #d99a4e;
      top: -60px;
      left: -60px;
      animation: floatBlob1 7s ease-in-out infinite;
    }
    #splash::after {
      background: #2e8f5c;
      bottom: -80px;
      right: -60px;
      animation: floatBlob2 8s ease-in-out infinite;
    }
    @keyframes floatBlob1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(30px, 25px) scale(1.15); }
    }
    @keyframes floatBlob2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-25px, -20px) scale(1.1); }
    }

    #splash .logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* Ring loading yang berputar mengelilingi logo */
    #splash .spin-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: #e0a85c;
      border-right-color: #e0a85c;
      animation: spinRing 1.1s linear infinite;
    }
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    /* Glow lembut berdenyut di belakang logo */
    #splash .logo-glow {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: #fff;
      filter: blur(18px);
      opacity: 0.35;
      animation: glowPulse 2.2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.92); }
      50%      { opacity: 0.5;  transform: scale(1.06); }
    }

    #splash img {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      animation: logoPulse 2.2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    #splash .brand {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.2px;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.15s forwards;
    }

    #splash .txt {
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.3s forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Titik-titik "..." yang berkedip bergantian, dipisah dari teks
       supaya lebih hidup daripada teks statis "Memuat...". */
    #splash .txt .dot {
      animation: dotBlink 1.4s ease-in-out infinite;
      opacity: 0.2;
    }
    #splash .txt .dot:nth-child(2) { animation-delay: 0.2s; }
    #splash .txt .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: 0.2; }
      40%           { opacity: 1; }
    }

    #splash.hide {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-wrap">
      <div class="spin-ring"></div>
      <div class="logo-glow"></div>
      <img src="icon-192.png" alt="Stock Opname">
    </div>
    <div class="brand">Stock Opname</div>
    <div class="txt">
      <span>Memuat aplikasi</span>
      <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
  </div>
  <!--
    PENTING soal kamera: JANGAN ganti ini jadi navigasi top-level
    (window.location = SO_APP_URL). App SO (JavaScript.html, fungsi
    isRunningAsPwa()) SENGAJA mengecek window.matchMedia('(display-mode:
    standalone)') pada TOP-LEVEL window untuk memutuskan apakah fitur Scan
    Barcode boleh dipakai. Kalau top-level window dinavigasi keluar dari
    origin/scope PWA ini (ke script.google.com), Android/Chrome keluar dari
    mode standalone WebAPK, display-mode berubah, dan app SO otomatis
    mengunci fitur scan (nampilin modal "Install Aplikasi Dulu") — walau
    sebenarnya app sudah ter-install. Makanya HARUS tetap iframe, supaya
    top-level document (index.html di GitHub Pages ini) yang tetap
    standalone, sementara isi app SO dimuat di iframe di dalamnya.

    Yang sebelumnya kurang: atribut "allow" pada iframe ini TIDAK
    menyertakan "camera" (cuma clipboard-write), sehingga browser
    memblokir permission delegation ke iframe SEBELUM sempat sampai ke
    getUserMedia()/Html5Qrcode di dalamnya. Ditambahkan camera & microphone
    di bawah.
  -->
  <iframe id="appFrame" title="Stock Opname" allow="camera; microphone; clipboard-write; clipboard-read"></iframe>

  <script>
    (function () {
      var frame = document.getElementById('appFrame');
      var splash = document.getElementById('splash');

      if (!SO_APP_URL || SO_APP_URL.indexOf('GANTI_DENGAN_URL_EXEC_KAMU') !== -1) {
        splash.innerHTML = '<div class="txt" style="max-width:80%;text-align:center;line-height:1.5;">'
          + 'URL app belum diisi.<br>Edit index.html, ganti nilai <b>SO_APP_URL</b> '
          + 'dengan URL /exec Web App Stock Opname kamu.</div>';
        return;
      }

      frame.addEventListener('load', function () {
        splash.classList.add('hide');
        setTimeout(function () { splash.style.display = 'none'; }, 300);
      });

      frame.src = SO_APP_URL;
    })();
  </script>
</body>
</html>
