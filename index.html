<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Stock Opname — Agrinesia</title>

  <!-- ===================== GANTI INI ===================== -->
  <!-- Ganti URL di bawah dengan URL /exec Web App Stock Opname kamu.
       Contoh: https://script.google.com/macros/s/AKfycb.../exec -->
  <script>
    var SO_APP_URL = "https://script.google.com/a/macros/agrinesia.co.id/s/AKfycbyHxJXf9BME1mIEyo9ZxjH0y-MxvK2EMkM1CQRabMhGbn02eOCwOyyy2GglnhV4spJSeQ/exec";
  </script>
  <!-- ======================================================== -->

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f4d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock Opname">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0f4d2e;
    }
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    /* Splash sederhana selagi iframe app SO memuat, supaya tidak
       terlihat layar kosong hijau polos tanpa keterangan. */
    #splash {
      position: fixed;
      inset: 0;
      background: #0f4d2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 2;
      transition: opacity 0.25s ease;
    }
    #splash img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
    }
    #splash .txt {
      font-size: 15px;
      opacity: 0.85;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== Overlay kamera Scan Barcode (bridge untuk app SO) =====
       Apps Script HtmlService selalu merender app SO di iframe sandbox
       ber-origin opaque, dan browser memblokir getUserMedia() dari origin
       semacam itu (dikonfirmasi resmi oleh dokumentasi Google Apps Script,
       bagian "Permissions policy violation" — ini "by design", bukan bug).
       Karena itu kamera dijalankan DI SINI (wrapper, origin HTTPS asli
       GitHub Pages, jadi getUserMedia diizinkan normal), lalu hasil scan
       dikirim balik ke app SO lewat postMessage. Lihat listener di bawah. */
    #scanOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
      display: none;
      flex-direction: column;
    }
    #scanOverlay.show { display: flex; }
    #scanOverlayHeader {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      padding-top: max(14px, env(safe-area-inset-top));
      background: #0f4d2e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #scanOverlayHeader .ttl { font-size: 15px; font-weight: 600; }
    #scanOverlayCloseBtn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    #scanOverlayReader {
      flex: 1 1 auto;
      width: 100%;
      background: #000;
    }
    #scanOverlayReader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    #scanOverlayMsg {
      flex: 0 0 auto;
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      font-size: 13px;
      color: #fff;
      background: #0f4d2e;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 16px;
    }
  </style>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div id="splash">
    <img src="icon-192.png" alt="Stock Opname">
    <div class="txt">Memuat Stock Opname…</div>
  </div>
  <!--
    PENTING soal kamera: JANGAN ganti ini jadi navigasi top-level
    (window.location = SO_APP_URL). App SO (JavaScript.html, fungsi
    isRunningAsPwa()) SENGAJA mengecek window.matchMedia('(display-mode:
    standalone)') pada TOP-LEVEL window untuk memutuskan apakah fitur Scan
    Barcode boleh dipakai. Kalau top-level window dinavigasi keluar dari
    origin/scope PWA ini (ke script.google.com), Android/Chrome keluar dari
    mode standalone WebAPK, display-mode berubah, dan app SO otomatis
    mengunci fitur scan (nampilin modal "Install Aplikasi Dulu") — walau
    sebenarnya app sudah ter-install. Makanya HARUS tetap iframe, supaya
    top-level document (index.html di GitHub Pages ini) yang tetap
    standalone, sementara isi app SO dimuat di iframe di dalamnya.

    Yang sebelumnya kurang: atribut "allow" pada iframe ini TIDAK
    menyertakan "camera" (cuma clipboard-write), sehingga browser
    memblokir permission delegation ke iframe SEBELUM sempat sampai ke
    getUserMedia()/Html5Qrcode di dalamnya. Ditambahkan camera & microphone
    di bawah.
  -->
  <iframe id="appFrame" title="Stock Opname" allow="camera; microphone; clipboard-write; clipboard-read"></iframe>

  <div id="scanOverlay">
    <div id="scanOverlayHeader">
      <span class="ttl">Scan Barcode</span>
      <button id="scanOverlayCloseBtn" type="button" aria-label="Tutup">✕</button>
    </div>
    <div id="scanOverlayReader"></div>
    <div id="scanOverlayMsg">Arahkan kamera ke barcode…</div>
  </div>

  <script>
    (function () {
      var frame = document.getElementById('appFrame');
      var splash = document.getElementById('splash');

      if (!SO_APP_URL || SO_APP_URL.indexOf('GANTI_DENGAN_URL_EXEC_KAMU') !== -1) {
        splash.innerHTML = '<div class="txt" style="max-width:80%;text-align:center;line-height:1.5;">'
          + 'URL app belum diisi.<br>Edit index.html, ganti nilai <b>SO_APP_URL</b> '
          + 'dengan URL /exec Web App Stock Opname kamu.</div>';
        return;
      }

      frame.addEventListener('load', function () {
        splash.classList.add('hide');
        setTimeout(function () { splash.style.display = 'none'; }, 300);
      });

      frame.src = SO_APP_URL;
    })();
  </script>

  <script>
    // ===== Bridge kamera untuk fitur Scan Barcode app SO =====
    (function () {
      var frame = document.getElementById('appFrame');
      var overlay = document.getElementById('scanOverlay');
      var msgEl = document.getElementById('scanOverlayMsg');
      var closeBtn = document.getElementById('scanOverlayCloseBtn');
      var qrReader = null;
      var busy = false; // cegah 1 barcode ke-trigger berkali-kali sebelum overlay sempat ditutup

      function postToApp(payload) {
        try {
          if (frame && frame.contentWindow) frame.contentWindow.postMessage(payload, '*');
        } catch (e) { /* no-op */ }
      }

      function setMsg(text) {
        if (msgEl) msgEl.textContent = text;
      }

      function stopReader() {
        if (qrReader) {
          try {
            qrReader.stop().then(function () {
              try { qrReader.clear(); } catch (e) {}
            }).catch(function () { /* kamera mungkin sudah berhenti sendiri */ });
          } catch (e) { /* no-op */ }
          qrReader = null;
        }
      }

      function closeOverlay(sendCancel) {
        stopReader();
        overlay.classList.remove('show');
        busy = false;
        if (sendCancel) postToApp({ type: 'so_scan_cancel' });
      }

      function openOverlay() {
        if (typeof Html5Qrcode === 'undefined') {
          postToApp({ type: 'so_scan_error', message: 'Library kamera (html5-qrcode) gagal dimuat. Cek koneksi internet lalu coba lagi.' });
          return;
        }
        busy = false;
        setMsg('Arahkan kamera ke barcode…');
        overlay.classList.add('show');

        qrReader = new Html5Qrcode('scanOverlayReader', /* verbose= */ false);
        var config = {
          fps: 10,
          qrbox: { width: 260, height: 160 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        };

        qrReader.start(
          { facingMode: 'environment' },
          config,
          function onScanSuccess(decodedText) {
            if (busy) return;
            busy = true;
            setMsg('Barcode terbaca: ' + decodedText);
            postToApp({ type: 'so_scan_result', barcode: decodedText });
            // Tutup overlay sebentar setelah berhasil supaya user lihat
            // konfirmasi dulu, lalu siap discan lagi kalau modal dibuka lagi.
            setTimeout(function () {
              closeOverlay(false);
            }, 350);
          },
          function onScanFailure() { /* frame tanpa barcode terbaca — normal */ }
        ).catch(function (err) {
          var name = err && err.name;
          var msg;
          if (name === 'NotAllowedError') {
            msg = 'Akses kamera ditolak. Buka Pengaturan HP → Aplikasi → Chrome → Izin → Kamera → pastikan Diizinkan, lalu buka lagi aplikasi ini dari ikon di layar utama.';
          } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
            msg = 'Kamera belakang tidak ditemukan di perangkat ini.';
          } else if (name === 'NotReadableError') {
            msg = 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera/video call lain, lalu coba lagi.';
          } else {
            msg = 'Tidak bisa mengakses kamera: ' + (err && err.message ? err.message : err) + '.';
          }
          overlay.classList.remove('show');
          postToApp({ type: 'so_scan_error', message: msg });
        });
      }

      closeBtn.addEventListener('click', function () {
        closeOverlay(true);
      });

      window.addEventListener('message', function (event) {
        var data = event && event.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'so_scan_request') {
          openOverlay();
        } else if (data.type === 'so_scan_stop') {
          closeOverlay(false);
        }
      });
    })();
  </script>
</body>
</html>
