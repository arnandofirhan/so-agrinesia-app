    flex-shrink: 0;

  }
  .theme-toggle-btn:hover { background: var(--gray-100); color: var(--gray-900); border-color: var(--gray-300); transform: translateY(-1px); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background: var(--gray-100);
    color: var(--gray-900);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background .2s var(--ease), color .2s var(--ease);
    overflow-x: hidden;
  }
  /* Fallback warna body saat login page tampil: kalau ada celah viewport
     (mis. gesture nav bar Android yang tidak konsisten dihitung 100vh),
     yang mengintip di baliknya hijau tua senada, bukan abu-abu terang. */

    background: #08341a;
  }

  .app-shell, .main-wrapper, .content,
  .stat-grid, .stat-card, .card,
  .grid-2, .form-row, .form-row-3 { min-width: 0; }

  .app-shell,
  .main-wrapper,
  .content {
    background: var(--gray-100);

  ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 20px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); background-clip: content-box; }

  .login-page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(1100px 620px at 12% -10%, rgba(255,255,255,0.10), transparent 60%),
      radial-gradient(900px 700px at 100% 110%, rgba(255,255,255,0.08), transparent 55%),
      linear-gradient(150deg, #0f7a37 0%, #0a5c29 45%, #08341a 100%);
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
  }
  .login-page::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 18% 22%, rgba(255,255,255,0.06) 0, transparent 2px),
      radial-gradient(circle at 78% 68%, rgba(255,255,255,0.05) 0, transparent 2px),
      radial-gradient(circle at 55% 15%, rgba(255,255,255,0.04) 0, transparent 2px);
    background-size: 140px 140px, 180px 180px, 200px 200px;
    pointer-events: none;
  }

  .login-card {
    background: var(--white);
    border-radius: 24px;
    box-shadow: var(--shadow-lg);
    padding: 46px 40px 38px;
    width: 100%;
    max-width: 410px;
    position: relative;
    z-index: 1;
    animation: cardIn .45s var(--ease);
    border: 1px solid rgba(255,255,255,0.6);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .login-logo { text-align: center; margin-bottom: 30px; }
  .login-logo .logo-icon {
    width: 64px; height: 64px;
    background: linear-gradient(145deg, var(--primary), var(--primary-darker));
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
    box-shadow: 0 10px 24px rgba(15,122,55,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .login-logo .logo-icon svg { stroke: #fff !important; width: 28px; height: 28px; }
  .login-logo .logo-icon.logo-icon-img {
    background: var(--white);
    box-shadow: 0 10px 24px rgba(15,122,55,0.18), 0 0 0 1px var(--gray-200);
    padding: 10px;
  }
  .login-logo .logo-icon.logo-icon-img img { width: 100%; height: 100%; object-fit: contain; }
  .login-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 10px;
  }
  .login-logo h1 {
    font-size: 24px;
    font-weight: 800;
    color: var(--gray-900);
    margin-bottom: 7px;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .login-logo p { color: var(--gray-500); font-size: 13.5px; line-height: 1.5; }

  .login-form .form-group { margin-bottom: 18px; }

  .login-input-wrap { position: relative; }
  .login-input-wrap input[type="text"],
  .login-input-wrap input[type="password"] { padding-left: 40px; }
  .login-password-wrap input[type="password"] { padding-right: 42px; }
  .login-input-icon {
    position: absolute;
    top: 50%;
    left: 13px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gray-400);
    pointer-events: none;
  }
  .login-input-icon svg { width: 17px; height: 17px; }
  .login-input-wrap input:focus ~ .login-input-icon,
  .login-input-wrap:focus-within .login-input-icon { color: var(--primary); }

  .login-password-wrap { position: relative; }
  .login-password-toggle {
    position: absolute;
    top: 50%;
    right: 4px;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--gray-400);
    border-radius: var(--radius-sm);
    transition: color .15s var(--ease), background .15s var(--ease);
  }
  .login-password-toggle:hover { color: var(--gray-600); background: var(--gray-100); }
  .login-password-toggle svg { width: 19px; height: 19px; }
  .login-password-toggle .icon-eye-closed { display: none; }
  .login-password-toggle.is-visible .icon-eye-open { display: none; }
  .login-password-toggle.is-visible .icon-eye-closed { display: block; }

  .login-remember-row { display: flex; align-items: center; justify-content: space-between; margin: -6px 0 18px; }
  .login-remember-check {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
    cursor: pointer;
    user-select: none;
  }
  .login-remember-check input { position: absolute; opacity: 0; width: 0; height: 0; }
  .login-remember-box {
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1.6px solid var(--gray-300);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    background: var(--white);
    transition: background .15s var(--ease), border-color .15s var(--ease);
    flex-shrink: 0;
  }
  .login-remember-box svg { width: 12px; height: 12px; opacity: 0; transition: opacity .12s var(--ease); }
  .login-remember-check input:checked ~ .login-remember-box {
    background: var(--primary);
    border-color: var(--primary);
  }
  .login-remember-check input:checked ~ .login-remember-box svg { opacity: 1; }

  .login-submit-btn { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .login-submit-btn svg { width: 16px; height: 16px; transition: transform .15s var(--ease); }
  .login-submit-btn:hover svg { transform: translateX(2px); }

  .login-error {
    background: var(--red-light);
    color: var(--red);
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;

  .acc-stock-backdrop {
