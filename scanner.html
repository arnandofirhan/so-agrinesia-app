<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Scan Barcode — Stock Opname</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    background: #0f4d2e; color: #fff; z-index: 2;
  }
  #header .ttl { font-size: 15px; font-weight: 600; }
  #closeBtn {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 18px; line-height: 1;
  }
  #reader { position: fixed; inset: 0; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  /* Sembunyikan kotak/shade qrbox BAWAAN library (html5-qrcode membuat
     elemen dengan id "qr-shaded-region" + border putih sendiri) — kita
     gantikan dengan overlay custom #scanGuide yang proporsinya lebih pas
     untuk barcode 1D. Selector by id di sini jauh lebih pasti nembak
     dibanding menebak posisi lewat :first-child (yang kemarin ternyata
     meleset sehingga 2 kotak numpuk / "double"). Sebagai jaga-jaga kalau
     versi library berbeda strukturnya, border/shadow SEMUA div turunan
     langsung #reader juga ditiadakan lewat JS setelah start() (lihat
     hideLibraryQrbox() di bawah).) */
  #reader #qr-shaded-region { display: none !important; }
  #reader > div > div { border: none !important; box-shadow: none !important; }
  #scanGuide {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 86vw; max-width: 480px; height: 34vw; max-height: 190px;
    border: 3px solid rgba(255,255,255,0.9);
    border-radius: 14px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
    z-index: 1; pointer-events: none;
    animation: guidePulse 2.2s ease-in-out infinite;
  }
  @keyframes guidePulse {
    0%, 100% { border-color: rgba(255,255,255,0.9); }
    50% { border-color: rgba(255,255,255,0.5); }
  }
  #scanGuide::before, #scanGuide::after {
    content: ''; position: absolute; width: 26px; height: 26px;
    border-color: #4ade80; border-style: solid; border-width: 0;
  }
  #scanGuide .corner { position: absolute; width: 26px; height: 26px; }
  #scanGuide .tl { top: -3px; left: -3px; border-top: 4px solid #4ade80; border-left: 4px solid #4ade80; border-radius: 14px 0 0 0; }
  #scanGuide .tr { top: -3px; right: -3px; border-top: 4px solid #4ade80; border-right: 4px solid #4ade80; border-radius: 0 14px 0 0; }
  #scanGuide .bl { bottom: -3px; left: -3px; border-bottom: 4px solid #4ade80; border-left: 4px solid #4ade80; border-radius: 0 0 0 14px; }
  #scanGuide .br { bottom: -3px; right: -3px; border-bottom: 4px solid #4ade80; border-right: 4px solid #4ade80; border-radius: 0 0 14px 0; }
  #msg {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom));
    background: rgba(15,77,46,0.92); color: #fff; font-size: 13.5px; text-align: center; z-index: 3;
    transition: background 0.25s ease, transform 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  #msg .status-icon { font-size: 15px; line-height: 1; flex-shrink: 0; }
  #msg.is-error {
    background: rgba(185,28,28,0.95);
    font-weight: 600;
    animation: msgPop 0.25s ease;
  }
  #msg.is-success {
    background: rgba(21,128,61,0.95);
    font-weight: 600;
    animation: msgPop 0.25s ease;
  }
  #msg.is-checking {
    background: rgba(15,77,46,0.92);
    font-style: italic;
  }
  @keyframes msgPop {
    0% { transform: translateY(6px); opacity: 0.4; }
    100% { transform: translateY(0); opacity: 1; }
  }
  #tapFocusHint {
    position: fixed; left: 0; right: 0; bottom: 56px;
    text-align: center; color: rgba(255,255,255,0.75); font-size: 11.5px;
    z-index: 2; padding: 0 16px; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #tapFocusHint.is-hidden { opacity: 0; }
</style>
</head>
<body>
  <div id="header"><span class="ttl">Scan Barcode</span><button id="closeBtn">✕</button></div>
  <div id="reader"></div>
  <div id="scanGuide">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div id="tapFocusHint">Tap layar untuk fokus ulang kalau gambar buram</div>
  <div id="msg">Arahkan kamera ke barcode…</div>

  <script>
    (function () {
      var msgEl = document.getElementById('msg');
      var hintEl = document.getElementById('tapFocusHint');
      var closeBtn = document.getElementById('closeBtn');
      var qrReader = null;
      // "busy" menahan scan barcode BARU selagi hasil scan sebelumnya masih
      // diproses (nunggu jawaban dari app: ditemukan / tidak / error) —
      // dilepas lagi otomatis begitu app mengirim balik pesan status lewat
      // so_scan_show_message, jadi user bisa langsung coba barang berikutnya
      // tanpa jendela kamera pernah tertutup di antaranya.
      var busy = false;
      var statusResetTimer = null;

      function send(payload) {
        try {
          if (window.opener) window.opener.postMessage(payload, '*');
        } catch (e) { /* no-op */ }
      }

      // Tampilkan pesan status di banner bawah jendela kamera ITU SENDIRI —
      // dipakai baik untuk pesan lokal (mis. hasil scan barcode terbaca)
      // maupun pesan yang dikirim BALIK dari app (mis. "barcode tidak
      // dikenali"). Ini pusat dari perubahan UX: dulu pesan begini tampil
      // di modal terpisah di app yang baru kelihatan setelah jendela ini
      // tertutup — sekarang semuanya tampil langsung di sini, real-time,
      // tanpa jendela kamera pernah perlu ditutup untuk kasus error.
      function setStatus(text, kind, opts) {
        var icon = kind === 'error' ? '⚠️' : kind === 'success' ? '✅' : kind === 'checking' ? '⏳' : '';
        msgEl.innerHTML = (icon ? '<span class="status-icon">' + icon + '</span>' : '') + '<span>' + text.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>';
        msgEl.className = kind ? 'is-' + kind : '';
        if (statusResetTimer) clearTimeout(statusResetTimer);
        var persist = opts && opts.persist;
        if (!persist && (kind === 'error' || kind === 'success')) {
          statusResetTimer = setTimeout(function () {
            setStatus('Arahkan kamera ke barcode…', null);
          }, 2600);
        }
      }

      // Menerima pesan dari app pemanggil (JavaScript.html): hasil resolve
      // barcode (ditemukan / tidak / error) dikirim ke sini lewat
      // so_scan_show_message, supaya tampil langsung di jendela kamera.
      window.addEventListener('message', function (event) {
        var data = event && event.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'so_scan_show_message') {
          setStatus(data.message || '', data.kind || 'error');
          busy = false; // siap terima scan barcode berikutnya lagi
        } else if (data.type === 'so_scan_close') {
          // App minta jendela ditutup (dipakai saat barcode sukses
          // ditemukan & app sudah selesai mengarahkan ke item-nya).
          stopAndClose(false);
        }
      });

      function exitFullscreenSafe() {
        try {
          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(function () {});
          } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        } catch (e) { /* no-op */ }
      }

      function stopAndClose(sendCancel) {
        exitFullscreenSafe();
        if (qrReader) {
          try {
            qrReader.stop().then(function () {
              try { qrReader.clear(); } catch (e) {}
              if (sendCancel) send({ type: 'so_scan_cancel' });
              window.close();
            }).catch(function () { window.close(); });
          } catch (e) { window.close(); }
        } else {
          if (sendCancel) send({ type: 'so_scan_cancel' });
          window.close();
        }
      }

      closeBtn.addEventListener('click', function () { stopAndClose(true); });

      // Minta fullscreen supaya address bar Chrome ikut hilang selagi
      // scan (browser tetap menampilkannya sebentar di awal — itu bagian
      // dari UI Chrome sendiri yang tidak bisa dihilangkan lewat kode,
      // tapi begitu masuk fullscreen dia otomatis sembunyi). Gagal minta
      // fullscreen (mis. tidak didukung / diblokir gesture policy) tidak
      // fatal, kamera tetap jalan seperti biasa.
      function requestFullscreenSafe() {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (req) {
          try { req.call(el).catch(function () {}); } catch (e) { /* no-op */ }
        }
      }
      requestFullscreenSafe();
      // Sebagian browser mobile hanya mengizinkan requestFullscreen kalau
      // dipicu langsung dari gesture user (tap), bukan otomatis saat
      // halaman dibuka. Sebagai fallback, tap pertama DI LUAR area video
      // (mis. di tulisan hint bawah) juga akan mencoba masuk fullscreen.
      // Sengaja TIDAK ditumpuk di listener tap-to-focus milik video (lihat
      // di bawah) supaya tap untuk fokus kamera tidak sekaligus memicu
      // notifikasi "keluar dari layar penuh" milik Chrome — dua gesture
      // itu dipisah biar jelas mana yang ngapain.
      document.getElementById('header').addEventListener('click', requestFullscreenSafe, { once: true });
      document.getElementById('msg').addEventListener('click', requestFullscreenSafe, { once: true });

      if (typeof Html5Qrcode === 'undefined') {
        setStatus('Library kamera gagal dimuat. Cek koneksi internet.', 'error', { persist: true });
        send({ type: 'so_scan_error', message: 'Library kamera (html5-qrcode) gagal dimuat.' });
        return;
      }

      qrReader = new Html5Qrcode('reader', false);

      // qrbox mengikuti proporsi barcode 1D (pendek & lebar) supaya area
      // pindai lebih toleran terhadap jarak kamera ke barang — sebelumnya
      // kotak 260x160 (hampir persegi) terlalu sempit untuk barcode
      // panjang, jadi user harus mundur pas-pasan supaya semua bar masuk
      // kotak. Ukuran sekarang dihitung relatif ke layar (bukan angka
      // tetap) supaya proporsional di HP dengan ukuran layar berbeda-beda.
      function computeQrbox(viewfinderWidth, viewfinderHeight) {
        var w = Math.round(Math.min(viewfinderWidth * 0.86, 480));
        var h = Math.round(Math.min(viewfinderHeight * 0.4, w * 0.4));
        return { width: w, height: Math.max(h, 110) };
      }

      var config = {
        fps: 8, // sedikit lebih rendah dari 10: beri waktu kamera HP
                // menyelesaikan autofocus antar-frame, jadi bar barcode
                // tidak "setengah blur" saat prosesnya membaca gambar.
        qrbox: computeQrbox,
        aspectRatio: 1.7777778, // dorong stream mendekati 16:9 agar FOV
                                 // lebih lebar, membantu barcode besar/dekat
                                 // tetap seluruhnya masuk frame.
        disableFlip: false,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      };

      // SENGAJA hanya { facingMode: 'environment' } — 1 key saja. Ini
      // argumen "cameraIdOrConfig" milik html5-qrcode, BUKAN tempat untuk
      // resolusi/constraints tambahan; kalau ditambah key lain (width,
      // height, advanced, dst) library akan melempar error
      // "cameraIdOrConfig object should have exactly 1 key". Resolusi
      // kamera dibiarkan default browser (biasanya sudah cukup tinggi di
      // HP modern) — lebih aman daripada resiko error total.
      var cameraIdOrConfig = { facingMode: 'environment' };

      qrReader.start(
        cameraIdOrConfig,
        config,
        function onScanSuccess(decodedText) {
          if (busy) return;
          busy = true;
          setStatus('Memeriksa barcode ' + decodedText + '…', 'checking');
          send({ type: 'so_scan_result', barcode: decodedText });
          // TIDAK auto-close lagi di sini. App yang menentukan apa yang
          // terjadi selanjutnya: kalau barcode DITEMUKAN, app akan kirim
          // pesan 'so_scan_close' ke jendela ini untuk menutupnya (baru
          // setelah itu tampilan app langsung nyampe ke item, tanpa modal
          // apapun kelihatan). Kalau barcode TIDAK dikenali, app kirim
          // 'so_scan_show_message' dan jendela kamera ini TETAP TERBUKA +
          // TETAP AKTIF supaya user bisa langsung coba barang lain.
        },
        function onScanFailure() { /* normal, diamkan */ }
      ).then(function () {
        // Jaga-jaga tambahan di luar CSS: cari & sembunyikan paksa elemen
        // shade/border qrbox bawaan library apapun strukturnya, supaya
        // tidak ada 2 kotak numpuk ("double") — CSS di atas menangani
        // kasus umum, ini menangani kasus id/struktur berbeda.
        function hideLibraryQrbox() {
          var readerEl = document.getElementById('reader');
          if (!readerEl) return;
          var shaded = document.getElementById('qr-shaded-region');
          if (shaded) shaded.style.display = 'none';
          // Matikan border/shadow di semua div turunan #reader KECUALI
          // yang membungkus <video> itu sendiri — supaya video tidak
          // ikut ketiban style yang tidak perlu.
          var divs = readerEl.querySelectorAll('div');
          divs.forEach(function (el) {
            if (el.querySelector('video')) return;
            el.style.border = 'none';
            el.style.boxShadow = 'none';
          });
        }
        hideLibraryQrbox();
        setTimeout(hideLibraryQrbox, 300); // library kadang re-render qrbox sesaat setelah start

        // Tap-to-focus: beberapa HP tidak otomatis re-fokus saat objek
        // berubah jarak mendadak (mis. dari cek email lalu langsung
        // hadap kamera dekat barang). applyConstraints dengan
        // pointsOfInterest memicu kamera fokus ulang ke titik yang
        // ditap user. Kalau browser tidak mendukung, ini gagal senyap
        // (try/catch) dan tidak mengganggu fungsi utama.
        var videoEl = document.querySelector('#reader video');
        if (videoEl) {
          videoEl.addEventListener('click', function (e) {
            try {
              var track = videoEl.srcObject && videoEl.srcObject.getVideoTracks()[0];
              if (!track) return;
              var caps = track.getCapabilities ? track.getCapabilities() : {};
              if (caps && caps.focusMode && caps.focusMode.indexOf('single-shot') !== -1) {
                var rect = videoEl.getBoundingClientRect();
                var x = (e.clientX - rect.left) / rect.width;
                var y = (e.clientY - rect.top) / rect.height;
                track.applyConstraints({
                  advanced: [{ focusMode: 'single-shot', pointsOfInterest: [{ x: x, y: y }] }]
                }).catch(function () {});
              }
            } catch (err) { /* browser tidak dukung, abaikan */ }
          });
        }
      }).catch(function (err) {
        var name = err && err.name;
        var m;
        if (name === 'NotAllowedError') {
          m = 'Akses kamera ditolak. Buka Pengaturan HP → Aplikasi → Chrome → Izin → Kamera → pastikan Diizinkan.';
        } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
          m = 'Kamera belakang tidak ditemukan di perangkat ini.';
        } else if (name === 'NotReadableError') {
          m = 'Kamera sedang dipakai aplikasi lain.';
        } else {
          m = 'Tidak bisa mengakses kamera: ' + (err && err.message ? err.message : err) + '.';
        }
        setStatus(m, 'error', { persist: true });
        hintEl.classList.add('is-hidden');
        send({ type: 'so_scan_error', message: m });
      });
    })();
  </script>
</body>
</html>
