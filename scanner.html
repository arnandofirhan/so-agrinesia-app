<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Scan Barcode — Stock Opname</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  /* ===== Header ===================================================== */
  #header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    padding-top: max(14px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 100%);
    color: #fff; z-index: 2;
    backdrop-filter: blur(2px);
  }
  #header .ttl { font-size: 15.5px; font-weight: 600; letter-spacing: 0.1px; }
  #closeBtn {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.16); color: #fff; font-size: 17px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #closeBtn:active { background: rgba(255,255,255,0.28); transform: scale(0.94); }

  /* ===== Camera preview =============================================== */
  #reader { position: fixed; inset: 0; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  /* Sembunyikan kotak/shade qrbox BAWAAN library (html5-qrcode membuat
     elemen dengan id "qr-shaded-region" + border putih sendiri) — kita
     gantikan dengan overlay custom #scanGuide yang proporsinya lebih pas
     untuk barcode 1D. Selector by id di sini jauh lebih pasti nembak
     dibanding menebak posisi lewat :first-child (yang kemarin ternyata
     meleset sehingga 2 kotak numpuk / "double"). Sebagai jaga-jaga kalau
     versi library berbeda strukturnya, border/shadow SEMUA div turunan
     langsung #reader juga ditiadakan lewat JS setelah start() (lihat
     hideLibraryQrbox() di bawah).) */
  #reader #qr-shaded-region { display: none !important; }
  #reader > div > div { border: none !important; box-shadow: none !important; }

  /* ===== Scan guide (kotak target) =====================================
     3 state visual, murni tampilan — TIDAK mengubah flow:
       .state-idle    -> default, putih, pulsing halus (nunggu barcode)
       .state-checking-> kuning/amber, saat barcode barusan kebaca kamera
                         dan sedang "diperiksa" (nunggu balasan dari app)
       .state-success -> hijau, app konfirmasi barcode ditemukan
       .state-error   -> merah, app konfirmasi barcode TIDAK ditemukan
                         (atau error kamera)                              */
  #scanGuide {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 86vw; max-width: 480px; height: 34vw; max-height: 190px;
    border-radius: 18px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.4);
    z-index: 1; pointer-events: none;
    transition: box-shadow 0.25s ease;
  }
  #scanGuide .frame {
    position: absolute; inset: 0;
    border-radius: 18px;
    border: 2px solid rgba(255,255,255,0.55);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  #scanGuide .corner {
    position: absolute; width: 28px; height: 28px;
    border-style: solid; border-width: 0;
    border-color: #ffffff;
    transition: border-color 0.25s ease, filter 0.25s ease;
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.35));
  }
  #scanGuide .tl { top: -3px; left: -3px; border-top-width: 4px; border-left-width: 4px; border-radius: 18px 0 0 0; }
  #scanGuide .tr { top: -3px; right: -3px; border-top-width: 4px; border-right-width: 4px; border-radius: 0 18px 0 0; }
  #scanGuide .bl { bottom: -3px; left: -3px; border-bottom-width: 4px; border-left-width: 4px; border-radius: 0 0 0 18px; }
  #scanGuide .br { bottom: -3px; right: -3px; border-bottom-width: 4px; border-right-width: 4px; border-radius: 0 0 18px 0; }

  /* Garis laser tipis yang bergerak naik-turun, hanya tampil saat idle,
     sekadar sinyal "kamera aktif & siap" — murni dekoratif. */
  #scanGuide .laser {
    position: absolute; left: 6%; right: 6%; height: 2px; top: 50%;
    background: linear-gradient(90deg, transparent 0%, rgba(74,222,128,0.9) 50%, transparent 100%);
    border-radius: 2px;
    opacity: 0.9;
    animation: laserMove 2.1s ease-in-out infinite;
    box-shadow: 0 0 8px rgba(74,222,128,0.7);
  }
  @keyframes laserMove {
    0%   { top: 14%; opacity: 0; }
    10%  { opacity: 0.9; }
    50%  { top: 86%; opacity: 0.9; }
    90%  { opacity: 0.9; }
    100% { top: 14%; opacity: 0; }
  }

  /* State: idle (default) — pulsing halus di border putih */
  #scanGuide.state-idle .frame { animation: framePulseIdle 2.4s ease-in-out infinite; }
  @keyframes framePulseIdle {
    0%, 100% { border-color: rgba(255,255,255,0.55); }
    50% { border-color: rgba(255,255,255,0.92); }
  }
  #scanGuide.state-idle .corner { border-color: #ffffff; }

  /* State: checking — amber/kuning, dipakai singkat sambil app memvalidasi
     barcode yang barusan berhasil dibaca kamera */
  #scanGuide.state-checking .laser { display: none; }
  #scanGuide.state-checking .frame {
    border-color: #fbbf24;
    animation: framePulseChecking 0.9s ease-in-out infinite;
  }
  @keyframes framePulseChecking {
    0%, 100% { border-color: #fbbf24; box-shadow: 0 0 0 0 rgba(251,191,36,0.35); }
    50% { border-color: #fde68a; box-shadow: 0 0 0 8px rgba(251,191,36,0); }
  }
  #scanGuide.state-checking .corner { border-color: #fbbf24; filter: drop-shadow(0 0 6px rgba(251,191,36,0.7)); }

  /* State: success — hijau tegas + sedikit "pop" saat transisi masuk */
  #scanGuide.state-success .laser { display: none; }
  #scanGuide.state-success .frame {
    border-color: #22c55e;
    border-width: 3px;
    box-shadow: 0 0 0 6px rgba(34,197,94,0.18);
  }
  #scanGuide.state-success .corner { border-color: #22c55e; filter: drop-shadow(0 0 8px rgba(34,197,94,0.85)); }
  #scanGuide.state-success { animation: guidePopIn 0.22s ease; }

  /* State: error — merah, sedikit "shake" supaya kerasa sebagai sinyal
     negatif (jarak terlalu jauh / barcode tak dikenal / gagal akses kamera) */
  #scanGuide.state-error .laser { display: none; }
  #scanGuide.state-error .frame {
    border-color: #ef4444;
    border-width: 3px;
    box-shadow: 0 0 0 6px rgba(239,68,68,0.16);
  }
  #scanGuide.state-error .corner { border-color: #ef4444; filter: drop-shadow(0 0 8px rgba(239,68,68,0.85)); }
  #scanGuide.state-error { animation: guideShake 0.32s ease; }

  @keyframes guidePopIn {
    0% { transform: translate(-50%, -50%) scale(0.96); }
    60% { transform: translate(-50%, -50%) scale(1.015); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes guideShake {
    0%, 100% { transform: translate(-50%, -50%); }
    25% { transform: translate(calc(-50% - 5px), -50%); }
    50% { transform: translate(calc(-50% + 5px), -50%); }
    75% { transform: translate(calc(-50% - 3px), -50%); }
  }

  /* ===== Bottom message bar ============================================ */
  #msg {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 15px 18px; padding-bottom: max(15px, env(safe-area-inset-bottom));
    background: rgba(15,77,46,0.94); color: #fff; font-size: 13.5px; text-align: center; z-index: 3;
    transition: background 0.25s ease, transform 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    backdrop-filter: blur(6px);
  }
  #msg .status-icon { font-size: 15px; line-height: 1; flex-shrink: 0; }
  #msg.is-error {
    background: rgba(185,28,28,0.95);
    font-weight: 600;
    animation: msgPop 0.25s ease;
  }
  #msg.is-success {
    background: rgba(21,128,61,0.95);
    font-weight: 600;
    animation: msgPop 0.25s ease;
  }
  #msg.is-checking {
    background: rgba(15,77,46,0.92);
    font-style: italic;
  }
  @keyframes msgPop {
    0% { transform: translateY(6px); opacity: 0.4; }
    100% { transform: translateY(0); opacity: 1; }
  }
  #tapFocusHint {
    position: fixed; left: 0; right: 0; bottom: 58px;
    text-align: center; color: rgba(255,255,255,0.8); font-size: 11.5px;
    z-index: 2; padding: 0 16px; pointer-events: none;
    transition: opacity 0.2s ease;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  #tapFocusHint.is-hidden { opacity: 0; }
</style>
</head>
<body>
  <div id="header"><span class="ttl">Scan Barcode</span><button id="closeBtn">✕</button></div>
  <div id="reader"></div>
  <div id="scanGuide" class="state-idle">
    <div class="frame"></div>
    <div class="laser"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div id="tapFocusHint">Tap layar untuk fokus ulang kalau gambar buram</div>
  <div id="msg">Arahkan kamera ke barcode…</div>

  <script>
    (function () {
      var msgEl = document.getElementById('msg');
      var hintEl = document.getElementById('tapFocusHint');
      var closeBtn = document.getElementById('closeBtn');
      var guideEl = document.getElementById('scanGuide');
      var qrReader = null;
      // "busy" menahan scan barcode BARU selagi hasil scan sebelumnya masih
      // diproses (nunggu jawaban dari app: ditemukan / tidak / error) —
      // dilepas lagi otomatis begitu app mengirim balik pesan status lewat
      // so_scan_show_message, jadi user bisa langsung coba barang berikutnya
      // tanpa jendela kamera pernah tertutup di antaranya.
      var busy = false;
      var statusResetTimer = null;
      var guideResetTimer = null;

      function send(payload) {
        try {
          if (window.opener) {
            window.opener.postMessage(payload, '*');
          } else if (window.parent && window.parent !== window) {
            // Mode overlay iframe (khusus iPhone, lihat startScanBarcodeCamera
            // di JavaScript.html) — tidak ada window.opener karena ini bukan
            // popup, jadi kirim ke window.parent (app yang menyisipkan
            // iframe ini) supaya hasil scan tetap sampai.
            window.parent.postMessage(payload, '*');
          }
        } catch (e) { /* no-op */ }
      }

      // ---- Visual state kotak scan (MURNI TAMPILAN) ----------------------
      // Tidak menyentuh flow sama sekali: hanya mengganti class CSS pada
      // #scanGuide mengikuti kind yang SUDAH ADA di alur pesan (checking /
      // success / error / idle). Pesan teksnya sendiri cukup tampil satu
      // kali saja di bar bawah (#msg) — badge terpisah di atas kotak sudah
      // dihapus karena dobel dengan bar bawah dan menutupi kamera.
      function setGuideState(kind) {
        guideEl.className = 'state-' + kind;
        if (guideResetTimer) { clearTimeout(guideResetTimer); guideResetTimer = null; }

        if (kind === 'success' || kind === 'error') {
          guideResetTimer = setTimeout(function () {
            setGuideState('idle');
          }, 2600);
        }
      }

      // Tampilkan pesan status di banner bawah jendela kamera ITU SENDIRI —
      // dipakai baik untuk pesan lokal (mis. hasil scan barcode terbaca)
      // maupun pesan yang dikirim BALIK dari app (mis. "barcode tidak
      // dikenali"). Ini pusat dari perubahan UX: dulu pesan begini tampil
      // di modal terpisah di app yang baru kelihatan setelah jendela ini
      // tertutup — sekarang semuanya tampil langsung di sini, real-time,
      // tanpa jendela kamera pernah perlu ditutup untuk kasus error.
      function setStatus(text, kind, opts) {
        var icon = kind === 'error' ? '⚠️' : kind === 'success' ? '✅' : kind === 'checking' ? '⏳' : '';
        msgEl.innerHTML = (icon ? '<span class="status-icon">' + icon + '</span>' : '') + '<span>' + text.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>';
        msgEl.className = kind ? 'is-' + kind : '';

        // Kotak scan & badge kecil mengikuti kind yang sama persis dengan
        // banner bawah — tidak ada logika baru, cuma cermin visual.
        setGuideState(kind || 'idle', text);

        if (statusResetTimer) clearTimeout(statusResetTimer);
        var persist = opts && opts.persist;
        if (!persist && (kind === 'error' || kind === 'success')) {
          statusResetTimer = setTimeout(function () {
            setStatus('Arahkan kamera ke barcode…', null);
          }, 2600);
        }
      }

      // Menerima pesan dari app pemanggil (JavaScript.html): hasil resolve
      // barcode (ditemukan / tidak / error) dikirim ke sini lewat
      // so_scan_show_message, supaya tampil langsung di jendela kamera.
      window.addEventListener('message', function (event) {
        var data = event && event.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'so_scan_show_message') {
          setStatus(data.message || '', data.kind || 'error');
          busy = false; // siap terima scan barcode berikutnya lagi
        } else if (data.type === 'so_scan_close') {
          // App minta jendela ditutup (dipakai saat barcode sukses
          // ditemukan & app sudah selesai mengarahkan ke item-nya).
          stopAndClose(false);
        }
      });

      function exitFullscreenSafe() {
        try {
          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(function () {});
          } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        } catch (e) { /* no-op */ }
      }

      // Kalau jendela ini popup asli (window.opener ada), dia boleh
      // menutup dirinya sendiri lewat window.close() seperti semula.
      // Kalau ini overlay iframe (mode iPhone, tidak ada window.opener),
      // window.close() tidak berlaku untuk iframe — cukup kirim pesan,
      // parent (app) yang akan melepas elemen iframe-nya sendiri
      // (lihat handler so_scan_cancel / stopScanBarcodeCamera di
      // JavaScript.html).
      function closeSelfIfPopup() {
        if (window.opener) {
          try { window.close(); } catch (e) { /* no-op */ }
        }
      }

      function stopAndClose(sendCancel) {
        exitFullscreenSafe();
        if (qrReader) {
          try {
            qrReader.stop().then(function () {
              try { qrReader.clear(); } catch (e) {}
              if (sendCancel) send({ type: 'so_scan_cancel' });
              closeSelfIfPopup();
            }).catch(function () {
              if (sendCancel) send({ type: 'so_scan_cancel' });
              closeSelfIfPopup();
            });
          } catch (e) {
            if (sendCancel) send({ type: 'so_scan_cancel' });
            closeSelfIfPopup();
          }
        } else {
          if (sendCancel) send({ type: 'so_scan_cancel' });
          closeSelfIfPopup();
        }
      }

      closeBtn.addEventListener('click', function () { stopAndClose(true); });

      // Minta fullscreen supaya address bar Chrome ikut hilang selagi
      // scan (browser tetap menampilkannya sebentar di awal — itu bagian
      // dari UI Chrome sendiri yang tidak bisa dihilangkan lewat kode,
      // tapi begitu masuk fullscreen dia otomatis sembunyi). Gagal minta
      // fullscreen (mis. tidak didukung / diblokir gesture policy) tidak
      // fatal, kamera tetap jalan seperti biasa.
      function requestFullscreenSafe() {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (req) {
          try { req.call(el).catch(function () {}); } catch (e) { /* no-op */ }
        }
      }
      requestFullscreenSafe();
      // Sebagian browser mobile hanya mengizinkan requestFullscreen kalau
      // dipicu langsung dari gesture user (tap), bukan otomatis saat
      // halaman dibuka. Sebagai fallback, tap PERTAMA DI MANA SAJA di layar
      // (termasuk area video kamera) juga mencoba masuk fullscreen —
      // sebelumnya cuma header/pesan bawah yang didengarkan, jadi kalau tap
      // pertama user justru di tengah layar (paling wajar, itu area video),
      // fullscreen tidak pernah kepicu & address bar tetap terlihat penuh
      // sesi. { once: true } di listener body memastikan ini cuma jalan
      // SEKALI dan tidak mengganggu tap-to-focus milik video (listener
      // terpisah di bawah, keduanya boleh jalan bersamaan untuk tap yang
      // sama tanpa konflik).
      document.body.addEventListener('click', requestFullscreenSafe, { once: true });
      document.addEventListener('visibilitychange', function () {
        // Sebagian browser Android otomatis keluar dari fullscreen saat
        // tab sempat pindah fokus (mis. notifikasi masuk) lalu kembali —
        // coba masuk fullscreen lagi begitu tab aktif kembali.
        if (!document.hidden && !document.fullscreenElement) requestFullscreenSafe();
      });

      if (typeof Html5Qrcode === 'undefined') {
        setStatus('Library kamera gagal dimuat. Cek koneksi internet.', 'error', { persist: true });
        send({ type: 'so_scan_error', message: 'Library kamera (html5-qrcode) gagal dimuat.' });
        return;
      }

      qrReader = new Html5Qrcode('reader', false);

      // qrbox mengikuti proporsi barcode 1D (pendek & lebar) supaya area
      // pindai lebih toleran terhadap jarak kamera ke barang — sebelumnya
      // kotak 260x160 (hampir persegi) terlalu sempit untuk barcode
      // panjang, jadi user harus mundur pas-pasan supaya semua bar masuk
      // kotak. Ukuran sekarang dihitung relatif ke layar (bukan angka
      // tetap) supaya proporsional di HP dengan ukuran layar berbeda-beda.
      function computeQrbox(viewfinderWidth, viewfinderHeight) {
        var w = Math.round(Math.min(viewfinderWidth * 0.86, 480));
        var h = Math.round(Math.min(viewfinderHeight * 0.4, w * 0.4));
        return { width: w, height: Math.max(h, 110) };
      }

      var config = {
        fps: 8, // sedikit lebih rendah dari 10: beri waktu kamera HP
                // menyelesaikan autofocus antar-frame, jadi bar barcode
                // tidak "setengah blur" saat prosesnya membaca gambar.
        qrbox: computeQrbox,
        // aspectRatio SEBELUMNYA dipaksa 16:9 di sini. DIHAPUS — ini
        // kemungkinan besar AKAR MASALAH "kamera nyala, barcode kelihatan
        // jelas di kotak, tapi tidak pernah terbaca" khusus di iPhone:
        // layar iPhone portrait rasionya jauh lebih sempit/tinggi
        // (~9:19.5) daripada 16:9 (~1.78). Dikombinasikan dengan CSS
        // "object-fit: cover" pada <video> (biar kamera full-screen,
        // bukan ada bar hitam) di atas, browser terpaksa MEMBESARKAN
        // gambar video 16:9 itu sampai tingginya pas, yang artinya
        // sisi KIRI-KANANNYA terpotong SANGAT BANYAK (cuma ~1/4 lebar
        // asli yang kelihatan) supaya muat penuh di layar. Yang
        // terlihat oleh mata di layar HP sudah ter-crop/zoom besar-
        // besaran begitu, tapi html5-qrcode menghitung area pindainya
        // dari VIDEO STREAM ASLI (sebelum crop CSS itu terjadi) — jadi
        // kotak scan yang diarahkan user ke barcode secara VISUAL,
        // ternyata memindai bagian frame kamera yang BERBEDA dan tidak
        // pernah kena barcode-nya sama sekali. Dengan aspectRatio
        // dihapus, browser/kamera iPhone akan pakai rasio nativenya
        // sendiri (biasanya jauh lebih dekat ke rasio layar), sehingga
        // crop dari object-fit:cover jauh lebih kecil dan area yang
        // dipindai library kembali selaras dengan yang terlihat user.
        disableFlip: false,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      };

      // SENGAJA hanya { facingMode: 'environment' } — 1 key saja. Ini
      // argumen "cameraIdOrConfig" milik html5-qrcode, BUKAN tempat untuk
      // resolusi/constraints tambahan; kalau ditambah key lain (width,
      // height, advanced, dst) library akan melempar error
      // "cameraIdOrConfig object should have exactly 1 key". Resolusi
      // kamera dibiarkan default browser (biasanya sudah cukup tinggi di
      // HP modern) — lebih aman daripada resiko error total.
      var cameraIdOrConfig = { facingMode: 'environment' };

      qrReader.start(
        cameraIdOrConfig,
        config,
        function onScanSuccess(decodedText) {
          if (busy) return;
          busy = true;
          setStatus('Memeriksa barcode ' + decodedText + '…', 'checking');
          send({ type: 'so_scan_result', barcode: decodedText });
          // TIDAK auto-close lagi di sini. App yang menentukan apa yang
          // terjadi selanjutnya: kalau barcode DITEMUKAN, app akan kirim
          // pesan 'so_scan_close' ke jendela ini untuk menutupnya (baru
          // setelah itu tampilan app langsung nyampe ke item, tanpa modal
          // apapun kelihatan). Kalau barcode TIDAK dikenali, app kirim
          // 'so_scan_show_message' dan jendela kamera ini TETAP TERBUKA +
          // TETAP AKTIF supaya user bisa langsung coba barang lain.
        },
        function onScanFailure() { /* normal, diamkan */ }
      ).then(function () {
        // Jaga-jaga tambahan di luar CSS: cari & sembunyikan paksa elemen
        // shade/border qrbox bawaan library apapun strukturnya, supaya
        // tidak ada 2 kotak numpuk ("double") — CSS di atas menangani
        // kasus umum, ini menangani kasus id/struktur berbeda.
        function hideLibraryQrbox() {
          var readerEl = document.getElementById('reader');
          if (!readerEl) return;
          var shaded = document.getElementById('qr-shaded-region');
          if (shaded) shaded.style.display = 'none';
          // Matikan border/shadow di semua div turunan #reader KECUALI
          // yang membungkus <video> itu sendiri — supaya video tidak
          // ikut ketiban style yang tidak perlu.
          var divs = readerEl.querySelectorAll('div');
          divs.forEach(function (el) {
            if (el.querySelector('video')) return;
            el.style.border = 'none';
            el.style.boxShadow = 'none';
          });
        }
        hideLibraryQrbox();
        setTimeout(hideLibraryQrbox, 300); // library kadang re-render qrbox sesaat setelah start

        // Minta resolusi lebih tinggi + fokus kontinu SETELAH kamera jalan
        // (bukan lewat cameraIdOrConfig di atas, supaya tidak kena error
        // "object should have exactly 1 key"). Resolusi default browser
        // untuk getUserMedia kadang cukup rendah (mis. 640x480) — barcode
        // yang padat/kecil bisa gagal ke-decode walau kelihatan "jelas"
        // secara visual di layar HP. focusMode continuous jaga kamera
        // tetap fokus walau HP digerakkan mendekat/menjauh ke barang.
        // Best-effort murni: kalau device/browser tidak dukung, gagal
        // senyap dan tidak mengganggu scan yang sudah jalan.
        try {
          qrReader.applyVideoConstraints({
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            advanced: [{ focusMode: 'continuous' }]
          }).catch(function () {});
        } catch (e) { /* browser tidak dukung, abaikan */ }

        var videoEl = document.querySelector('#reader video');
        // Tap-to-focus: beberapa HP tidak otomatis re-fokus saat objek
        // berubah jarak mendadak (mis. dari cek email lalu langsung
        // hadap kamera dekat barang). applyConstraints dengan
        // pointsOfInterest memicu kamera fokus ulang ke titik yang
        // ditap user. Kalau browser tidak mendukung, ini gagal senyap
        // (try/catch) dan tidak mengganggu fungsi utama.
        if (videoEl) {
          videoEl.addEventListener('click', function (e) {
            try {
              var track = videoEl.srcObject && videoEl.srcObject.getVideoTracks()[0];
              if (!track) return;
              var caps = track.getCapabilities ? track.getCapabilities() : {};
              if (caps && caps.focusMode && caps.focusMode.indexOf('single-shot') !== -1) {
                var rect = videoEl.getBoundingClientRect();
                var x = (e.clientX - rect.left) / rect.width;
                var y = (e.clientY - rect.top) / rect.height;
                track.applyConstraints({
                  advanced: [{ focusMode: 'single-shot', pointsOfInterest: [{ x: x, y: y }] }]
                }).catch(function () {});
              }
            } catch (err) { /* browser tidak dukung, abaikan */ }
          });
        }
      }).catch(function (err) {
        var name = err && err.name;
        var m;
        if (name === 'NotAllowedError') {
          m = 'Akses kamera ditolak. Buka Pengaturan HP → Aplikasi → Chrome → Izin → Kamera → pastikan Diizinkan.';
        } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
          m = 'Kamera belakang tidak ditemukan di perangkat ini.';
        } else if (name === 'NotReadableError') {
          m = 'Kamera sedang dipakai aplikasi lain.';
        } else {
          m = 'Tidak bisa mengakses kamera: ' + (err && err.message ? err.message : err) + '.';
        }
        setStatus(m, 'error', { persist: true });
        hintEl.classList.add('is-hidden');
        send({ type: 'so_scan_error', message: m });
      });
    })();
  </script>
</body>
</html>
