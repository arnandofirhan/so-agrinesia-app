  const valuePctText = d.pctSelisihValue === null ? '' : ' (' + (d.pctSelisihValue > 0 ? '+' : '') + d.pctSelisihValue.toFixed(1) + '%)';
  const cardTotalValue = trendCardHtml(
    'Selisih Value',
    trendArrowHtml(d.deltaSelisihValue),
    null,
    '<span class="' + (d.deltaSelisihValue > 0 ? 'tag-membaik' : (d.deltaSelisihValue < 0 ? 'tag-memburuk' : '')) + '">' + (d.deltaSelisihValue > 0 ? '+' : '') + formatRupiah(d.deltaSelisihValue) + '</span>' + valuePctText,
    'Periode 1: ' + formatRupiah(d.periode1.selisihValue) + ' → Periode 2: ' + formatRupiah(d.periode2.selisihValue)
  );

  const cardTotalQty = trendCardHtml(
    'Selisih Qty',
    trendArrowHtml(d.deltaSelisihQty),
    null,
    '<span class="' + (d.deltaSelisihQty > 0 ? 'tag-membaik' : (d.deltaSelisihQty < 0 ? 'tag-memburuk' : '')) + '">' + (d.deltaSelisihQty > 0 ? '+' : '') + formatNumber(d.deltaSelisihQty) + ' unit</span>',
    'Periode 1: ' + formatNumber(d.periode1.selisihQty) + ' → Periode 2: ' + formatNumber(d.periode2.selisihQty)
  );

  const cardStoreWorst = d.storeWorst ? trendCardHtml(
    'Store Memburuk',
    trendArrowHtml(d.storeWorst.deltaValue),
    d.storeWorst.store,
    '<span class="tag-memburuk">' + formatRupiah(d.storeWorst.deltaValue) + '</span>',
    formatRupiah(d.storeWorst.periode1.selisihValue) + ' → ' + formatRupiah(d.storeWorst.periode2.selisihValue)
  ) : trendCardHtml('Store Memburuk', trendArrowHtml(0), null, '<span class="trend-summary-empty">Tidak ada yang memburuk</span>', '');

  const cardStoreBest = d.storeBest ? trendCardHtml(
    'Store Membaik',
    trendArrowHtml(d.storeBest.deltaValue),
    d.storeBest.store,
    '<span class="tag-membaik">+' + formatRupiah(d.storeBest.deltaValue) + '</span>',
    formatRupiah(d.storeBest.periode1.selisihValue) + ' → ' + formatRupiah(d.storeBest.periode2.selisihValue)
  ) : trendCardHtml('Store Membaik', trendArrowHtml(0), null, '<span class="trend-summary-empty">Tidak ada yang membaik</span>', '');

  const cardItemWorst = d.itemWorst ? trendCardHtml(
    'Item Memburuk',
    trendArrowHtml(d.itemWorst.deltaValue),
    d.itemWorst.sku + ' — ' + (d.itemWorst.nama || '-'),
    '<span class="tag-memburuk">' + formatRupiah(d.itemWorst.deltaValue) + '</span>',
    formatRupiah(d.itemWorst.periode1.selisihValue) + ' → ' + formatRupiah(d.itemWorst.periode2.selisihValue)
  ) : trendCardHtml('Item Memburuk', trendArrowHtml(0), null, '<span class="trend-summary-empty">Tidak ada yang memburuk</span>', '');

  const cardItemBest = d.itemBest ? trendCardHtml(
    'Item Membaik',
    trendArrowHtml(d.itemBest.deltaValue),
    d.itemBest.sku + ' — ' + (d.itemBest.nama || '-'),
    '<span class="tag-membaik">+' + formatRupiah(d.itemBest.deltaValue) + '</span>',
    formatRupiah(d.itemBest.periode1.selisihValue) + ' → ' + formatRupiah(d.itemBest.periode2.selisihValue)
  ) : trendCardHtml('Item Membaik', trendArrowHtml(0), null, '<span class="trend-summary-empty">Tidak ada yang membaik</span>', '');

  grid.innerHTML = cardTotalValue + cardTotalQty + cardStoreWorst + cardStoreBest + cardItemWorst + cardItemBest;
}

    '</div>' +

      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>' +
      '<button class="btn btn-danger" id="resetSoConfirmBtn" disabled>' + ICONS.trash + ' Hapus Permanen</button>' +
    '</div>'
  );
  const input = document.getElementById('resetSoConfirmInput');
  const confirmBtn = document.getElementById('resetSoConfirmBtn');
  input.addEventListener('input', function() {
    confirmBtn.disabled = input.value.trim().toUpperCase() !== 'HAPUS';
  });
  input.focus();
  confirmBtn.addEventListener('click', async function() {
    if (input.value.trim().toUpperCase() !== 'HAPUS') return;
    closeModal();
    const res = await callServer('resetSoData', { currentUser: CURRENT_USER }, { loadingText: 'Menghapus data SO...' });
    if (res.success) {
      showToast(res.message, 'success');
      invalidateCache(); 
      ACTIVITY_LOG_PAGINATION.page = 1;
      loadActivityLogTable(true);
    } else {
      showToast(res.message, 'error');
    }
  });

async function loadActivityLogUserOptions() {

const ACTIVITY_LOG_PAGINATION = createPaginationState(25);

async function loadActivityLogTable(force) {
  const params = {
    search: document.getElementById('logSearchInput').value,
    username: document.getElementById('logUserFilter').value,
    aksi: document.getElementById('logAksiFilter').value,
    tanggalMulai: document.getElementById('logTanggalMulai').value,
    tanggalAkhir: document.getElementById('logTanggalAkhir').value,
    currentUser: CURRENT_USER
  };
  const tbody = document.getElementById('logTableBody');
  const cacheKey = 'activityLog:' + JSON.stringify(params);

  const cachedRes = !force ? peekCached(cacheKey) : null;
  if (cachedRes && cachedRes.success) {
    renderActivityLogTable(cachedRes.data, tbody);
  }

  const res = await getCached(cacheKey, function() {
    return callServer('getActivityLog', params, { silent: true });
  }, force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  ACTIVITY_LOG_CACHE = res.data;
  renderActivityLogTable(res.data, tbody);
}

function renderActivityLogTable(data, tbody) {
  if (!tbody || !document.body.contains(tbody)) return;
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="td-empty-state"><div class="empty-state"><div class="empty-icon">' + ICONS.history + '</div><div class="empty-title">Belum ada aktivitas tercatat</div><div class="empty-desc">Belum ditemukan aktivitas pada filter yang dipilih.</div></div></td></tr>';
    clearPaginationBarById('logPaginationBar', 'logPageSizeBar');
    return;
  }

  const aksiColorMap = {
    'Hapus Stock Opname': 'badge-red',
    'Reset Password': 'badge-orange',
    'Ubah Status User': 'badge-orange',
    'Tambah Item Master': 'badge-green',
    'Tambah User': 'badge-green',
    'Buat Stock Opname': 'badge-green',
    'Ajukan Approval Stock Opname': 'badge-blue',
    'Approve Stock Opname': 'badge-green',
    'Reject Stock Opname': 'badge-red'
  };

  const pageData = paginateSlice(data, ACTIVITY_LOG_PAGINATION);
  window._ACTIVITY_LOG_PAGE_DATA = pageData;
  tbody.innerHTML = pageData.map(function(l, idx) {
    const badgeClass = aksiColorMap[l.aksi] || 'badge-gray';
    return '<tr class="clickable-row" data-log-idx="' + idx + '">' +
      '<td data-label="Waktu" style="white-space:nowrap;color:var(--gray-500);font-size:12.5px;">' + escapeHtml(formatTimestampDisplay(l.timestamp)) + '</td>' +
      '<td data-label="User"><strong>' + escapeHtml(l.nama || l.username) + '</strong></td>' +
      '<td data-label="Aksi"><span class="badge ' + badgeClass + '">' + escapeHtml(l.aksi) + '</span></td>' +
      '<td data-label="Target"><span class="cell-clip cell-clip-sm">' + escapeHtml(l.target) + '</span></td>' +
      '<td data-label="Detail" style="color:var(--gray-600);"><span class="cell-clip" style="max-width:100%;">' + escapeHtml(formatDetailDates(l.detail)) + '</span></td>' +
    '</tr>';
  }).join('');
  tbody.querySelectorAll('tr[data-log-idx]').forEach(function(tr) {
    tr.addEventListener('click', function() {
      const l = window._ACTIVITY_LOG_PAGE_DATA[Number(tr.getAttribute('data-log-idx'))];
      openActivityLogDetailModal_(l, aksiColorMap[l.aksi] || 'badge-gray');
    });
  });

  renderPaginationBar(document.getElementById('logPaginationBar'), data.length, ACTIVITY_LOG_PAGINATION, 'aktivitas', function() {
    renderActivityLogTable(data, tbody);
  }, document.getElementById('logPageSizeBar'));
}

let ROLE_PERM_DATA = null;       
let ROLE_PERM_SELECTED_ID = null; 
let ROLE_PERM_DRAFT = null;       

const PERM_ACTION_LABELS = { view: 'View', create: 'Create', edit: 'Edit', delete: 'Delete' };

async function renderRolePermission(force) {
  if (!isAdmin()) { navigateTo('dashboard'); return; }
  const content = document.getElementById('pageContent');
  const cacheKey = 'rolePermissionData';
  const cachedRes = !force ? peekCached(cacheKey) : null;

  content.innerHTML =
    '<div class="page-header"><h2>Role & Permission</h2>' +
      '<button class="btn btn-primary" id="btnAddRole">' + ICONS.plus + ' Tambah Role</button>' +
    '</div>' +
    '<div class="role-perm-layout">' +
      '<div class="card role-list-panel" id="rolePermListPanel">' + (cachedRes && cachedRes.success ? '' : skeletonBarsHtml(4)) + '</div>' +
      '<div class="card" id="rolePermDetailPanel">' + (cachedRes && cachedRes.success ? '' : '<div class="empty-state"><div class="empty-icon">' + ICONS.users + '</div><div class="empty-title">Memuat data role...</div></div>') + '</div>' +
    '</div>';

  document.getElementById('btnAddRole').addEventListener('click', openAddRoleModal);

  function applyRolePermData_(data) {
    ROLE_PERM_DATA = data;
    ROLE_LIST_CACHE = data.roles.map(function(r) { return { roleId: r.roleId, roleName: r.roleName, isSystem: r.isSystem }; });
    if (!ROLE_PERM_SELECTED_ID || !ROLE_PERM_DATA.roles.some(function(r) { return r.roleId === ROLE_PERM_SELECTED_ID; })) {
      ROLE_PERM_SELECTED_ID = ROLE_PERM_DATA.roles.length ? ROLE_PERM_DATA.roles[0].roleId : null;
    }
    renderRoleListPanel();
    renderRoleDetailPanel();
  }

  if (cachedRes && cachedRes.success) {
    applyRolePermData_(cachedRes.data);
  }

  const res = await getCached(cacheKey, function() {
    return callServer('getRolePermissionData', { currentUser: CURRENT_USER }, { silent: true });
  }, force);
  if (!res.success) {
    if (!(cachedRes && cachedRes.success)) {
      showToast(res.message, 'error');
      document.getElementById('rolePermListPanel').innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Gagal memuat data</div></div>';
    }
    return;
  }
  applyRolePermData_(res.data);
}

function renderRoleListPanel() {
  const panel = document.getElementById('rolePermListPanel');
  if (!panel) return;
  const items = ROLE_PERM_DATA.roles.map(function(r) {
    const initials = (r.roleName || '?').trim().split(/\s+/).slice(0, 2).map(function(w) { return w.charAt(0).toUpperCase(); }).join('');
    return '<div class="role-list-item' + (r.roleId === ROLE_PERM_SELECTED_ID ? ' active' : '') + '" onclick="selectRolePerm(\'' + escapeHtml(r.roleId).replace(/'/g,"\\'") + '\')">' +

function selectRolePerm(roleId) {
  if (ROLE_PERM_DRAFT_DIRTY_) {
    confirmDialog('Perubahan permission pada role sebelumnya belum disimpan dan akan hilang. Lanjutkan pindah role?', function() {
      ROLE_PERM_DRAFT_DIRTY_ = false;
      ROLE_PERM_SELECTED_ID = roleId;
      renderRoleListPanel();
      renderRoleDetailPanel();
    }, { type: 'warning', title: 'Perubahan belum disimpan' });
    return;
  }
  ROLE_PERM_SELECTED_ID = roleId;
  renderRoleListPanel();
  renderRoleDetailPanel();
}

let ROLE_PERM_DRAFT_DIRTY_ = false;

function renderRoleDetailPanel() {
  const panel = document.getElementById('rolePermDetailPanel');
  if (!panel) return;
  const role = ROLE_PERM_DATA.roles.find(function(r) { return r.roleId === ROLE_PERM_SELECTED_ID; });
  if (!role) {
    panel.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.users + '</div><div class="empty-title">Belum ada Role</div><div class="empty-desc">Klik "+ Tambah Role" untuk membuat role baru.</div></div>';
    return;
  }
  ROLE_PERM_DRAFT = JSON.parse(JSON.stringify(role.permissions));
  ROLE_PERM_DRAFT_DIRTY_ = false;
  const isSuperAdmin = role.roleId === 'ADMIN';
  const initials = (role.roleName || '?').trim().split(/\s+/).slice(0, 2).map(function(w) { return w.charAt(0).toUpperCase(); }).join('');

  const groups = {};
  const groupOrder = [];
  ROLE_PERM_DATA.menus.forEach(function(m) {
    if (!groups[m.group]) { groups[m.group] = []; groupOrder.push(m.group); }
    groups[m.group].push(m);
  });

  const headerCells = ALL_PERMISSION_ACTIONS_.map(function(a) {
    return '<th><div class="perm-table-action-th">' + PERM_ACTION_LABELS[a] +
      '<input type="checkbox" class="perm-check select-all-check" data-select-all-action="' + a + '" title="Pilih semua ' + PERM_ACTION_LABELS[a] + '"' + (isSuperAdmin ? ' disabled' : '') + '>' +
    '</div></th>';
  }).join('');

  const bodyRows = groupOrder.map(function(g) {
    const groupHeaderRow = '<tr class="perm-table-group-row"><td colspan="' + (ALL_PERMISSION_ACTIONS_.length + 1) + '"><span class="perm-table-group-label">' + escapeHtml(g) + '</span></td></tr>';
    const menuRows = groups[g].map(function(m) {
      const cells = ALL_PERMISSION_ACTIONS_.map(function(a) {
        if (m.actions.indexOf(a) === -1) return '<td data-action-label="' + escapeHtml(PERM_ACTION_LABELS[a]) + '"><span class="perm-check-empty"></span></td>';
        const checked = ROLE_PERM_DRAFT[m.key] && ROLE_PERM_DRAFT[m.key][a];
        return '<td data-action-label="' + escapeHtml(PERM_ACTION_LABELS[a]) + '"><input type="checkbox" class="perm-check" data-menu="' + m.key + '" data-action="' + a + '"' + (checked ? ' checked' : '') + (isSuperAdmin ? ' disabled' : '') + '></td>';
      }).join('');
      return '<tr class="perm-row" data-menu-label="' + escapeHtml(m.label).toLowerCase() + '"><td>' +
        '<div class="perm-menu-cell">' +
          '<input type="checkbox" class="perm-check" data-select-all-menu="' + m.key + '"' + (isSuperAdmin ? ' disabled' : '') + '>' +
          '<span class="perm-menu-cell-label">' + escapeHtml(m.label) + '</span>' +
        '</div>' +
      '</td>' + cells + '</tr>';
    }).join('');
    return groupHeaderRow + menuRows;
  }).join('');

  panel.innerHTML =
    '<div class="role-detail-header">' +
      '<div class="role-detail-heading">' +
        '<div class="role-detail-avatar">' + escapeHtml(initials) + '</div>' +
        '<div class="role-detail-title-wrap"><h3>' + escapeHtml(role.roleName) + '</h3>' +
          '<div class="page-subtitle">' + (isSuperAdmin ? 'Super Admin selalu memiliki akses penuh ke semua menu &amp; aksi.' : 'Atur menu &amp; aksi yang boleh diakses role ini.') + '</div></div>' +
      '</div>' +
      '<div class="action-btns">' +
        (role.isSystem ? '' :
          '<button class="icon-btn" data-tooltip="Ubah Nama Role" onclick="openRenameRoleModal(\'' + escapeHtml(role.roleId).replace(/'/g,"\\'") + '\',\'' + escapeHtml(role.roleName).replace(/'/g,"\\'") + '\')">' + ICONS.edit + '</button>' +
          '<button class="icon-btn danger" data-tooltip="Hapus Role" onclick="confirmDeleteRole(\'' + escapeHtml(role.roleId).replace(/'/g,"\\'") + '\',\'' + escapeHtml(role.roleName).replace(/'/g,"\\'") + '\')">' + ICONS.trash + '</button>') +
      '</div>' +
    '</div>' +
    (isSuperAdmin ? '' :
      '<div class="perm-toolbar">' +
        '<div class="perm-search-wrap">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
          '<input type="text" id="permSearchInput" placeholder="Cari menu...">' +
        '</div>' +
        '<span class="perm-dirty-pill hidden" id="permDirtyPill">' + ICONS.alert + ' Ada perubahan belum disimpan</span>' +
      '</div>') +
    '<div class="perm-table-wrap"><table class="perm-table">' +
      '<thead><tr><th>Menu</th>' + headerCells + '</tr></thead>' +
      '<tbody id="permTableBody">' + bodyRows + '</tbody>' +
    '</table></div>' +
    (isSuperAdmin ? '' :
      '<div class="modal-footer" style="padding:18px 0 0;border-top:1px solid var(--gray-100);margin-top:16px;">' +
        '<button class="btn btn-secondary" id="btnResetRolePerm">Reset</button>' +
        '<button class="btn btn-primary" id="btnSaveRolePerm">' + ICONS.save + ' Simpan Perubahan</button>' +
      '</div>');

  if (isSuperAdmin) return;

  function markDirty_() {
    ROLE_PERM_DRAFT_DIRTY_ = true;
    const pill = document.getElementById('permDirtyPill');
    if (pill) pill.classList.remove('hidden');
  }

  panel.querySelectorAll('.perm-check[data-menu]').forEach(function(cb) {
    cb.addEventListener('change', function() {
      const menu = cb.getAttribute('data-menu');
      const action = cb.getAttribute('data-action');
      if (!ROLE_PERM_DRAFT[menu]) ROLE_PERM_DRAFT[menu] = {};
      ROLE_PERM_DRAFT[menu][action] = cb.checked;
      markDirty_();
      syncMenuSelectAllCheckbox_(menu);
      syncActionSelectAllCheckbox_(action);
    });
  });
  panel.querySelectorAll('[data-select-all-menu]').forEach(function(cb) {
    cb.addEventListener('change', function() {
      const menu = cb.getAttribute('data-select-all-menu');
      const menuDef = ROLE_PERM_DATA.menus.find(function(m) { return m.key === menu; });
      if (!menuDef) return;
      if (!ROLE_PERM_DRAFT[menu]) ROLE_PERM_DRAFT[menu] = {};
      menuDef.actions.forEach(function(a) { ROLE_PERM_DRAFT[menu][a] = cb.checked; });
      markDirty_();
      renderRoleDetailPanel();
    });
  });
  panel.querySelectorAll('.perm-menu-cell').forEach(function(cell) {
    cell.addEventListener('click', function(e) {
      const cb = cell.querySelector('[data-select-all-menu]');
      if (!cb || cb.disabled) return;
      if (e.target === cb) return; 
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change', { bubbles: true }));
    });
  });
  panel.querySelectorAll('[data-select-all-action]').forEach(function(cb) {
    cb.addEventListener('change', function() {
      const action = cb.getAttribute('data-select-all-action');
      ROLE_PERM_DATA.menus.forEach(function(m) {
        if (m.actions.indexOf(action) === -1) return;
        if (!ROLE_PERM_DRAFT[m.key]) ROLE_PERM_DRAFT[m.key] = {};
        ROLE_PERM_DRAFT[m.key][action] = cb.checked;
      });
      markDirty_();
      renderRoleDetailPanel();
    });
  });

  const searchInput = document.getElementById('permSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const q = searchInput.value.trim().toLowerCase();
      panel.querySelectorAll('#permTableBody tr.perm-row').forEach(function(row) {
        const label = row.getAttribute('data-menu-label') || '';
        row.classList.toggle('perm-row-hidden', !!q && label.indexOf(q) === -1);
      });
      panel.querySelectorAll('#permTableBody tr.perm-table-group-row').forEach(function(groupRow) {
        let sib = groupRow.nextElementSibling;
        let anyVisible = false;
        while (sib && !sib.classList.contains('perm-table-group-row')) {
          if (!sib.classList.contains('perm-row-hidden')) anyVisible = true;
          sib = sib.nextElementSibling;
        }
        groupRow.classList.toggle('perm-row-hidden', !anyVisible);
      });
    });
  }

  document.getElementById('btnResetRolePerm').addEventListener('click', function() {
    ROLE_PERM_DRAFT_DIRTY_ = false;
    renderRoleDetailPanel();
  });
  document.getElementById('btnSaveRolePerm').addEventListener('click', async function() {
    const res2 = await callServer('saveRolePermissions', { currentUser: CURRENT_USER, roleId: role.roleId, permissions: ROLE_PERM_DRAFT }, { loadingText: 'Menyimpan permission...' });
    if (res2.success) {
      showToast(res2.message, 'success');
      role.permissions = JSON.parse(JSON.stringify(ROLE_PERM_DRAFT));
      ROLE_PERM_DRAFT_DIRTY_ = false;
      invalidateCache('rolePermissionData');
      invalidateCache('roleList');
      renderRoleDetailPanel();
    } else {
      showToast(res2.message, 'error');
    }
  });
}

const ALL_PERMISSION_ACTIONS_ = ['view', 'create', 'edit', 'delete'];

function syncMenuSelectAllCheckbox_(menuKey) {
  const menuDef = ROLE_PERM_DATA.menus.find(function(m) { return m.key === menuKey; });
  if (!menuDef) return;
  const allChecked = menuDef.actions.every(function(a) { return ROLE_PERM_DRAFT[menuKey] && ROLE_PERM_DRAFT[menuKey][a]; });
  const el = document.querySelector('[data-select-all-menu="' + menuKey + '"]');
  if (el) el.checked = allChecked;
}
function syncActionSelectAllCheckbox_(action) {
  const relevantMenus = ROLE_PERM_DATA.menus.filter(function(m) { return m.actions.indexOf(action) !== -1; });
  const allChecked = relevantMenus.every(function(m) { return ROLE_PERM_DRAFT[m.key] && ROLE_PERM_DRAFT[m.key][action]; });
  const el = document.querySelector('[data-select-all-action="' + action + '"]');
  if (el) el.checked = allChecked;
}

async function loadUserTable(force) {
  const res = await getUserListCached(!!force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  USER_LIST_CACHE = res.data;
  renderUserRows(USER_LIST_CACHE);
}

function filterUserTable() {
  const q = document.getElementById('userSearchInput').value.toLowerCase().trim();
  const roleF = document.getElementById('userRoleFilter').value;
  const statusF = document.getElementById('userStatusFilter').value;
  const filtered = USER_LIST_CACHE.filter(function(u) {
    const matchQ = !q || String(u.username).toLowerCase().indexOf(q) > -1 || String(u.nama).toLowerCase().indexOf(q) > -1;
    const matchRole = !roleF || normalizeUserRole_(u.role) === roleF;
    const matchStatus = !statusF || String(u.status).toLowerCase() === statusF.toLowerCase();
    return matchQ && matchRole && matchStatus;
  });
  USER_MGMT_PAGINATION.page = 1;
  renderUserRows(filtered);
}

const USER_MGMT_PAGINATION = createPaginationState(25);
let ROLE_LIST_CACHE = []; 

async function getRoleListCached(force) {
  return getCached('roleList', async function() {
    const res = await callServer('getRolePermissionData', { currentUser: CURRENT_USER }, { silent: true });
    if (res.success) {
      ROLE_LIST_CACHE = res.data.roles.map(function(r) { return { roleId: r.roleId, roleName: r.roleName, isSystem: r.isSystem }; });
    }
    return res;
  }, force);
}

function roleDisplayName_(roleId) {
  const found = ROLE_LIST_CACHE.find(function(r) { return r.roleId === roleId; });
  return found ? found.roleName : (roleId || '-');
}

function roleBadgeClass_(roleId) {
  if (roleId === 'ADMIN') return 'badge-green';
  if (roleId === 'STORE_COORDINATOR') return 'badge-blue';
  if (roleId === 'HEAD_STORE') return 'badge-gray';
  if (roleId === 'USER_STORE') return 'badge-purple';
  return 'badge-orange';
}

function isSingleStoreRole_(roleId) {
  return roleId === 'USER_STORE';
}
function isNoStoreRole_(roleId) {
  return roleId === 'ADMIN';
}

function roleOptionsHtml_(selectedRoleId) {
  return ROLE_LIST_CACHE.map(function(r) {
    return '<option value="' + escapeHtml(r.roleId) + '"' + (r.roleId === selectedRoleId ? ' selected' : '') + '>' + escapeHtml(r.roleName) + '</option>';
  }).join('');
}

function normalizeUserRole_(role) {
  return String(role || '').trim();
}

function buildStoreDisplayHtml(u) {
  if (isNoStoreRole_(normalizeUserRole_(u.role))) return '<span class="cell-clip cell-clip-sm">Semua Store</span>';
  const list = String(u.store || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
  if (!list.length) return '<span style="color:var(--gray-400);">-</span>';
  const fullTitle = list.join(', ');
  if (list.length === 1) {
    return '<span class="cell-clip cell-clip-sm" title="' + escapeHtml(fullTitle) + '">' + escapeHtml(list[0]) + '</span>';
  }
  return '<span class="cell-clip cell-clip-sm" title="' + escapeHtml(fullTitle) + '">' + escapeHtml(list[0]) + '</span>' +
    ' <span class="badge badge-gray store-more-badge" title="' + escapeHtml(fullTitle) + '">+' + (list.length - 1) + ' lainnya</span>';
}

function renderUserRows(users) {
  const tbody = document.getElementById('userTableBody');
  if (!tbody) return;
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="td-empty-state"><div class="empty-state"><div class="empty-icon">' + ICONS.users + '</div><div class="empty-title">Belum ada user</div></div></td></tr>';
    clearPaginationBarById('userPaginationBar', 'userPageSizeBar');
    return;
  }
  const pageUsers = paginateSlice(users, USER_MGMT_PAGINATION);
  tbody.innerHTML = pageUsers.map(function(u) {
    const uRole = normalizeUserRole_(u.role);
    const roleBadge = '<span class="badge ' + roleBadgeClass_(uRole) + '">' + escapeHtml(roleDisplayName_(uRole)) + '</span>';
    const storeDisplay = buildStoreDisplayHtml(u);
    const statusBadgeHtml = String(u.status).toLowerCase() === 'aktif' ? '<span class="badge badge-green">Aktif</span>' : '<span class="badge badge-red">Nonaktif</span>';
    return '<tr data-username="' + escapeHtml(u.username) + '">' +
      '<td data-label="Username" class="card-title"><strong class="cell-clip cell-clip-sm" title="' + escapeHtml(u.username) + '">' + escapeHtml(u.username) + '</strong></td>' +
      '<td data-label="Nama User"><span class="cell-clip cell-clip-sm" title="' + escapeHtml(u.nama) + '">' + escapeHtml(u.nama) + '</span></td>' +
      '<td data-label="Role">' + roleBadge + '</td>' +
      '<td data-label="Store">' + storeDisplay + '</td>' +
      '<td data-label="Email">' + (u.email ? '<span class="cell-clip cell-clip-sm" title="' + escapeHtml(u.email) + '">' + escapeHtml(u.email) + '</span>' : '<span style="color:var(--gray-400);">-</span>') + '</td>' +
      '<td data-label="Last Login">' + (u.lastLogin ? escapeHtml(formatTimestampDisplay(u.lastLogin)) : '<span style="color:var(--gray-400);">Belum pernah</span>') + '</td>' +
      '<td data-label="Status">' + statusBadgeHtml + '</td>' +
      '<td data-label="Aksi" class="text-center sticky-col-right"><div class="action-btns" style="justify-content:center;">' +
        '<button class="icon-btn success" data-tooltip="Edit" onclick="openEditUserModal(\'' + escapeHtml(u.username).replace(/'/g,"\\'") + '\')">' + ICONS.edit + '</button>' +
        '<button class="icon-btn warning" data-tooltip="Reset Password" onclick="openResetPasswordModal(\'' + escapeHtml(u.username).replace(/'/g,"\\'") + '\')">' + ICONS.key + '</button>' +
        '<button class="icon-btn ' + (String(u.status).toLowerCase() === 'aktif' ? 'danger' : 'success') + '" data-tooltip="Nonaktifkan / Aktifkan" onclick="toggleUserStatusAction(\'' + escapeHtml(u.username).replace(/'/g,"\\'") + '\')">' + ICONS.toggle + '</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');

  renderPaginationBar(document.getElementById('userPaginationBar'), users.length, USER_MGMT_PAGINATION, 'user', function() {
    renderUserRows(users);
  }, document.getElementById('userPageSizeBar'));
}

async function openAddUserModal() {
  if (!STORE_LIST_CACHE.length) await getStoreListCached();
  if (!ROLE_LIST_CACHE.length) await getRoleListCached();
  const storeChecklist = STORE_LIST_CACHE.map(function(s) {
    return '<label class="store-check-item"><input type="checkbox" class="newUserStoreCheck" value="' + escapeHtml(s) + '"> ' + escapeHtml(s) + '</label>';
  }).join('');
  const storeRadioList = STORE_LIST_CACHE.map(function(s) {
    return '<label class="store-check-item"><input type="radio" name="newUserStoreRadio" class="newUserStoreRadio" value="' + escapeHtml(s) + '"> ' + escapeHtml(s) + '</label>';
  }).join('');
  const defaultRole = ROLE_LIST_CACHE.length ? ROLE_LIST_CACHE[ROLE_LIST_CACHE.length - 1].roleId : 'USER_STORE';
  openModal(
    modalHeaderHtml({ icon: ICONS.plus, color: 'primary', title: 'Tambah User', subtitle: 'Buat akun user baru' }) +
    '<div class="modal-body">' +
      '<div class="form-group"><label>Username</label><input type="text" id="newUserUsername"></div>' +
      '<div class="form-group"><label>Password</label><input type="text" id="newUserPassword"></div>' +
      '<div class="form-group"><label>Nama User</label><input type="text" id="newUserNama"></div>' +
      '<div class="form-group"><label>Email (opsional)</label><input type="text" id="newUserEmail" placeholder="untuk notifikasi reset password"></div>' +
      '<div class="form-group"><label>Role</label><select id="newUserRole" onchange="toggleStoreFieldVisibility()">' +
        roleOptionsHtml_(defaultRole) +
      '</select></div>' +
      '<div class="form-group" id="newUserStoreGroupSingle"><label>Store yang dipegang (pilih 1)</label>' +
        (storeRadioList ? '<div class="store-check-list">' + storeRadioList + '</div>' : '<div style="font-size:12px;color:var(--gray-500);">Belum ada store. Tambahkan store di menu Store Management terlebih dahulu.</div>') +
      '</div>' +
      '<div class="form-group" id="newUserStoreGroup"><label>Store yang dipegang (bisa lebih dari 1)</label>' +
        (storeChecklist ? '<div class="store-check-list">' + storeChecklist + '</div>' : '<div style="font-size:12px;color:var(--gray-500);">Belum ada store. Tambahkan store di menu Store Management terlebih dahulu.</div>') +
      '</div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>' +
      '<button class="btn btn-primary" id="saveNewUserBtn">' + ICONS.save + ' Simpan</button>' +
    '</div>'
  );
  toggleStoreFieldVisibility();

  const saveNewUserBtn = document.getElementById('saveNewUserBtn');
  const validation = attachFormValidation([
    { id: 'newUserUsername', label: 'Username', validate: function(v) {
      return /\s/.test(v) ? 'Username tidak boleh mengandung spasi' : null;
    } },
    { id: 'newUserPassword', label: 'Password', validate: function(v) {
      return v.length < 4 ? 'Password minimal 4 karakter' : null;
    } },
    { id: 'newUserNama', label: 'Nama User', validate: function(v) { return v.length < 3 ? 'Nama User minimal 3 karakter' : null; } },
    { id: 'newUserEmail', required: false, validate: function(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? null : 'Format email tidak valid';
    } }
  ], saveNewUserBtn);

  saveNewUserBtn.addEventListener('click', async function() {
    if (!validation.validateAll()) return;
    const role = document.getElementById('newUserRole').value;
    let storeList = [];
    if (isSingleStoreRole_(role)) {
      const checkedRadio = document.querySelector('.newUserStoreRadio:checked');
      if (checkedRadio) storeList.push(checkedRadio.value);
    } else if (!isNoStoreRole_(role)) {
      storeList = Array.from(document.querySelectorAll('.newUserStoreCheck:checked')).map(function(el) { return el.value; });
    }
    const user = {
      username: document.getElementById('newUserUsername').value.trim(),
      password: document.getElementById('newUserPassword').value,
      nama: document.getElementById('newUserNama').value.trim(),
      email: document.getElementById('newUserEmail') ? document.getElementById('newUserEmail').value.trim() : '',
      role: role,
      storeList: storeList,
      status: 'Aktif',
      currentUser: CURRENT_USER
    };
    if (isSingleStoreRole_(role) && storeList.length !== 1) {
      showToast('Role ini wajib memilih tepat 1 store.', 'error');
      return;
    }
    if (!isSingleStoreRole_(role) && !isNoStoreRole_(role) && !storeList.length) {
      showToast('Wajib memilih minimal 1 store.', 'error');
      return;
    }
    const res = await callServer('addUser', user, { loadingText: 'Menyimpan user...' });
    if (res.success) {
      showToast(res.message, 'success');
      closeModal();
      invalidateCache('storeList');
      await loadUserTable(true);
      flashRowSuccess(document.querySelector('#userTableBody tr[data-username="' + CSS.escape(user.username) + '"]'));
    } else {
      showToast(res.message, 'error');
    }
  });
}

function toggleStoreFieldVisibility() {

async function openEditUserModal(username) {
  if (!STORE_LIST_CACHE.length) await getStoreListCached();
  if (!ROLE_LIST_CACHE.length) await getRoleListCached();
  const user = USER_LIST_CACHE.find(function(u) { return String(u.username) === String(username); });
  if (!user) return;
  const currentStores = user.storeList || (user.store ? String(user.store).split(',').map(function(s){return s.trim();}).filter(function(s){return s;}) : []);
  const extraStores = currentStores.filter(function(s) { return STORE_LIST_CACHE.indexOf(s) === -1; });
  const allStoreOptions = STORE_LIST_CACHE.concat(extraStores);
  const storeChecklist = allStoreOptions.map(function(s) {
    const checked = currentStores.indexOf(s) !== -1 ? ' checked' : '';
    return '<label class="store-check-item"><input type="checkbox" class="editUserStoreCheck" value="' + escapeHtml(s) + '"' + checked + '> ' + escapeHtml(s) + '</label>';
  }).join('');
  const storeRadioList = allStoreOptions.map(function(s) {
    const checked = currentStores.indexOf(s) !== -1 ? ' checked' : '';
    return '<label class="store-check-item"><input type="radio" name="editUserStoreRadio" class="editUserStoreRadio" value="' + escapeHtml(s) + '"' + checked + '> ' + escapeHtml(s) + '</label>';
  }).join('');
  const userRole = normalizeUserRole_(user.role);

  openModal(
    modalHeaderHtml({ icon: ICONS.edit, color: 'blue', title: 'Edit User', subtitle: user.username }) +
    '<div class="modal-body">' +
      '<div class="form-group"><label>Username</label><input type="text" value="' + escapeHtml(user.username) + '" disabled></div>' +
      '<div class="form-group"><label>Nama User</label><input type="text" id="editUserNama" value="' + escapeHtml(user.nama) + '"></div>' +
      '<div class="form-group"><label>Email</label><input type="text" id="editUserEmail" value="' + escapeHtml(user.email || '') + '" placeholder="untuk notifikasi reset password"></div>' +
      '<div class="form-group"><label>Role</label><select id="editUserRole" onchange="toggleEditStoreFieldVisibility()">' +
        roleOptionsHtml_(userRole) +
      '</select></div>' +
      '<div class="form-group" id="editUserStoreGroupSingle" style="' + (isSingleStoreRole_(userRole) ? '' : 'display:none;') + '">' +
        '<label>Store yang dipegang (pilih 1)</label>' +
        (storeRadioList ? '<div class="store-check-list">' + storeRadioList + '</div>' : '<div style="font-size:12px;color:var(--gray-500);">Belum ada store. Tambahkan store di menu Store Management terlebih dahulu.</div>') +
      '</div>' +
      '<div class="form-group" id="editUserStoreGroup" style="' + ((!isSingleStoreRole_(userRole) && !isNoStoreRole_(userRole)) ? '' : 'display:none;') + '">' +
        '<label>Store yang dipegang (bisa lebih dari 1)</label>' +
        (storeChecklist ? '<div class="store-check-list">' + storeChecklist + '</div>' : '<div style="font-size:12px;color:var(--gray-500);">Belum ada store. Tambahkan store di menu Store Management terlebih dahulu.</div>') +
      '</div>' +
      '<div class="form-group"><label>Status</label><select id="editUserStatus">' +
        '<option value="Aktif"' + (String(user.status).toLowerCase() === 'aktif' ? ' selected' : '') + '>Aktif</option>' +
        '<option value="Nonaktif"' + (String(user.status).toLowerCase() !== 'aktif' ? ' selected' : '') + '>Nonaktif</option>' +
      '</select></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>' +
      '<button class="btn btn-primary" id="saveEditUserBtn">' + ICONS.save + ' Simpan</button>' +
    '</div>'
  );

  const editUserValidation = attachFormValidation([
    { id: 'editUserNama', label: 'Nama User', validate: function(v) { return v.length < 3 ? 'Nama User minimal 3 karakter' : null; } },
    { id: 'editUserEmail', required: false, validate: function(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? null : 'Format email tidak valid';
    } }
  ], document.getElementById('saveEditUserBtn'));

  document.getElementById('saveEditUserBtn').addEventListener('click', async function() {
    if (!editUserValidation.validateAll()) return;
    const role = document.getElementById('editUserRole').value;
    let storeList = [];
    if (isSingleStoreRole_(role)) {
      const checkedRadio = document.querySelector('.editUserStoreRadio:checked');
      if (checkedRadio) storeList.push(checkedRadio.value);
    } else if (!isNoStoreRole_(role)) {
      storeList = Array.from(document.querySelectorAll('.editUserStoreCheck:checked')).map(function(el) { return el.value; });
    }
    const upd = {
      username: user.username,
      nama: document.getElementById('editUserNama').value.trim(),
      email: document.getElementById('editUserEmail').value.trim(),
      role: role,
      storeList: storeList,
      status: document.getElementById('editUserStatus').value,
      currentUser: CURRENT_USER
    };
    if (isSingleStoreRole_(role) && storeList.length !== 1) {
      showToast('Role ini wajib memilih tepat 1 store.', 'error');
      return;
    }
    if (!isSingleStoreRole_(role) && !isNoStoreRole_(role) && !storeList.length) {
      showToast('Wajib memilih minimal 1 store.', 'error');
      return;
    }
    const res = await callServer('updateUser', upd, { loadingText: 'Memperbarui user...' });
    if (res.success) {
      showToast(res.message, 'success');
      closeModal();
      await loadUserTable(true);
      flashRowSuccess(document.querySelector('#userTableBody tr[data-username="' + CSS.escape(user.username) + '"]'));
    } else {
      showToast(res.message, 'error');
    }
  });
}

      '<thead><tr><th>Store ID</th><th>Nama Store</th><th>Status</th><th>Created At</th><th>Updated At</th><th class="text-center sticky-col-right">Aksi</th></tr></thead>' +

    document.getElementById('storeResetBtn'),

      filterStoreTable();
    },
    function() {
      STORE_MGMT_KPI_FILTER = '';
      document.getElementById('storeSearchInput').value = '';
      document.getElementById('storeStatusFilter').value = '';
      filterStoreTable();
    }
  );

  STORE_MGMT_KPI_FILTER = '';
  STORE_MGMT_BELUM_SO = [];

  if (STORE_MASTER_CACHE.length) {
    renderStoreRows(STORE_MASTER_CACHE);
    renderStoreKpiCards();
  }
  await loadStoreTable();
  loadStoreKpiBelumSo();
}

function renderStoreKpiCards() {
  const grid = document.getElementById('storeKpiGrid');
  if (!grid) return;
  const total = STORE_MASTER_CACHE.length;
  const aktif = STORE_MASTER_CACHE.filter(function(s) { return String(s.status).toLowerCase() === 'aktif'; }).length;
  const nonaktif = total - aktif;
  const belum = STORE_MGMT_BELUM_SO.length;

  grid.innerHTML =
    statCard(ICONS.store, 'blue', formatNumber(total), 'Total Store', "filterStoreByKpi('')") +
    statCard(ICONS.check, 'green', formatNumber(aktif), 'Store Aktif', "filterStoreByKpi('aktif')") +
    statCard(ICONS.toggle, 'red', formatNumber(nonaktif), 'Store Nonaktif', "filterStoreByKpi('nonaktif')") +
    statCard(ICONS.warning, 'orange', formatNumber(belum), 'Belum Stock Opname', "filterStoreByKpi('belumso')");

  grid.querySelectorAll('.stat-card').forEach(function(card, idx) {
    const key = ['', 'aktif', 'nonaktif', 'belumso'][idx];
    if (key === STORE_MGMT_KPI_FILTER) card.classList.add('active');
  });
  fitStatCardValues(grid);
}

async function loadStoreKpiBelumSo(force) {
  const res = await getCached('weeklySoStatus:' + CURRENT_USER.username, function() {
    return callServer('getWeeklySoStatus', { currentUser: CURRENT_USER }, { silent: true });
  }, force);
  if (!res.success) return;
  STORE_MGMT_BELUM_SO = (res.data.stores || []).filter(function(s) { return !s.done; }).map(function(s) { return s.store; });
  renderStoreKpiCards();
  if (STORE_MGMT_KPI_FILTER === 'belumso') applyStoreKpiFilter();
}

function filterStoreByKpi(key) {
  STORE_MGMT_KPI_FILTER = key;
  const searchInput = document.getElementById('storeSearchInput');
  const statusFilter = document.getElementById('storeStatusFilter');
  if (searchInput) searchInput.value = '';
  if (statusFilter) statusFilter.value = (key === 'aktif' || key === 'nonaktif') ? (key === 'aktif' ? 'Aktif' : 'Nonaktif') : '';
  applyStoreKpiFilter();
}

function applyStoreKpiFilter() {
  let filtered = STORE_MASTER_CACHE;
  if (STORE_MGMT_KPI_FILTER === 'aktif') {
    filtered = STORE_MASTER_CACHE.filter(function(s) { return String(s.status).toLowerCase() === 'aktif'; });
  } else if (STORE_MGMT_KPI_FILTER === 'nonaktif') {
    filtered = STORE_MASTER_CACHE.filter(function(s) { return String(s.status).toLowerCase() === 'nonaktif'; });
  } else if (STORE_MGMT_KPI_FILTER === 'belumso') {
    filtered = STORE_MASTER_CACHE.filter(function(s) { return STORE_MGMT_BELUM_SO.indexOf(s.nama) > -1; });
  }
  STORE_MGMT_PAGINATION.page = 1;
  renderStoreRows(filtered);
  renderStoreKpiCards();
}

async function loadStoreTable(force) {
  const cachedRes = !force ? peekCached('storeMasterList') : null;
  if (cachedRes && cachedRes.success) {
    STORE_MASTER_CACHE = cachedRes.data;
    if (STORE_MGMT_KPI_FILTER) {
      applyStoreKpiFilter();
    } else {
      renderStoreRows(STORE_MASTER_CACHE);
      renderStoreKpiCards();
    }
  }

  const res = await getStoreMasterListCached(!!force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  STORE_MASTER_CACHE = res.data;
  if (STORE_MGMT_KPI_FILTER) {
    applyStoreKpiFilter();
  } else {
    renderStoreRows(STORE_MASTER_CACHE);
    renderStoreKpiCards();
  }
}

function filterStoreTable() {
  const q = document.getElementById('storeSearchInput').value.toLowerCase().trim();
  const statusF = document.getElementById('storeStatusFilter').value;
  const filtered = STORE_MASTER_CACHE.filter(function(s) {
    const matchQ = !q || String(s.nama).toLowerCase().indexOf(q) > -1 || String(s.storeId).toLowerCase().indexOf(q) > -1;
    const matchStatus = !statusF || String(s.status).toLowerCase() === statusF.toLowerCase();
    return matchQ && matchStatus;
  });
  STORE_MGMT_PAGINATION.page = 1;
  renderStoreRows(filtered);
  renderStoreKpiCards();
}

const STORE_MGMT_PAGINATION = createPaginationState(25);

function renderStoreRows(stores) {
  const tbody = document.getElementById('storeTableBody');
  if (!tbody) return;
  if (!stores.length) {
    const searchEl = document.getElementById('storeSearchInput');
    const statusEl = document.getElementById('storeStatusFilter');
    const isFiltered = (searchEl && searchEl.value.trim()) || (statusEl && statusEl.value) || STORE_MGMT_KPI_FILTER;
    tbody.innerHTML = isFiltered ?
      ('<tr><td colspan="6" class="td-empty-state"><div class="empty-state"><div class="empty-icon">' + ICONS.store + '</div><div class="empty-title">Belum ada data</div><div class="empty-desc">Belum ditemukan store pada filter yang dipilih.</div></div></td></tr>') :
      ('<tr><td colspan="6" class="td-empty-state"><div class="empty-state"><div class="empty-icon">' + ICONS.store + '</div><div class="empty-title">Belum ada store</div><div class="empty-desc">Tambah store baru untuk mulai mengelola lokasi.</div></div></td></tr>');
    clearPaginationBarById('storePaginationBar', 'storePageSizeBar');
    return;
  }
  const pageStores = paginateSlice(stores, STORE_MGMT_PAGINATION);
  tbody.innerHTML = pageStores.map(function(s) {
    const statusBadgeHtml = String(s.status).toLowerCase() === 'aktif' ? '<span class="badge badge-green">Aktif</span>' : '<span class="badge badge-red">Nonaktif</span>';
    return '<tr data-store-id="' + escapeHtml(s.storeId) + '">' +
      '<td data-label="Store ID"><span class="cell-clip cell-clip-sm" title="' + escapeHtml(s.storeId) + '">' + escapeHtml(s.storeId) + '</span></td>' +
      '<td data-label="Nama Store" class="card-title"><strong class="cell-clip cell-clip-sm" title="' + escapeHtml(s.nama) + '">' + escapeHtml(s.nama) + '</strong></td>' +
      '<td data-label="Status">' + statusBadgeHtml + '</td>' +
      '<td data-label="Created At">' + (s.createdAt ? escapeHtml(formatTimestampDisplay(s.createdAt)) : '-') + '</td>' +
      '<td data-label="Updated At">' + (s.updatedAt ? escapeHtml(formatTimestampDisplay(s.updatedAt)) : '-') + '</td>' +
      '<td data-label="Aksi" class="text-center sticky-col-right"><div class="action-btns" style="justify-content:center;">' +
        '<button class="icon-btn success" data-tooltip="Edit" onclick="openEditStoreModal(\'' + escapeHtml(s.storeId).replace(/'/g,"\\'") + '\')">' + ICONS.edit + '</button>' +
        '<button class="icon-btn ' + (String(s.status).toLowerCase() === 'aktif' ? 'danger' : 'success') + '" data-tooltip="Nonaktifkan / Aktifkan" onclick="toggleStoreStatusAction(\'' + escapeHtml(s.storeId).replace(/'/g,"\\'") + '\', \'' + escapeHtml(s.nama).replace(/'/g,"\\'") + '\')">' + ICONS.toggle + '</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');

  renderPaginationBar(document.getElementById('storePaginationBar'), stores.length, STORE_MGMT_PAGINATION, 'store', function() {
    renderStoreRows(stores);
  }, document.getElementById('storePageSizeBar'));
}

        invalidateCache('storeList');
        await loadStoreTable(true);
        flashRowSuccess(document.querySelector('#storeTableBody tr[data-store-id="' + CSS.escape(storeIdBaru) + '"]'));
      } else {
        showToast(res.message, 'error');
      }
    });
  });
}

function toggleStoreStatusAction(storeId, nama) {
  const s = STORE_MASTER_CACHE.find(function(x) { return String(x.storeId) === String(storeId); });
  const isCurrentlyActive = s ? String(s.status).toLowerCase() === 'aktif' : true;
  const goingTo = isCurrentlyActive ? 'Nonaktif' : 'Aktif';
  iconModal({
    type: isCurrentlyActive ? 'danger' : 'warning',
    title: (isCurrentlyActive ? 'Nonaktifkan' : 'Aktifkan') + ' Store?',
    detailRows: [
      { label: 'Store ID', value: storeId },
      { label: 'Nama Store', value: nama },
      { label: 'Status saat ini', value: s ? s.status : '-' },
      { label: 'Status baru', value: goingTo, warn: isCurrentlyActive }
    ],
    desc: isCurrentlyActive ? 'Store yang dinonaktifkan tidak akan muncul lagi sebagai pilihan store aktif untuk Stock Opname baru.' : 'Store akan kembali muncul sebagai pilihan store aktif.',
    confirmLabel: isCurrentlyActive ? 'Ya, Nonaktifkan' : 'Ya, Aktifkan',
    confirmClass: isCurrentlyActive ? 'btn-danger' : 'btn-primary',
    onConfirm: async function() {
      const res = await callServer('toggleStoreMasterStatus', { storeId: storeId, currentUser: CURRENT_USER }, { loadingText: 'Mengubah status...' });
      if (res.success) {
        showToast(res.message, 'success');
        invalidateCache('storeList');
        loadStoreTable(true);
      } else {
        showToast(res.message, 'error');
      }
    }
  });
}

const CATEGORY_MGMT_PAGINATION = createPaginationState(25);
let CATEGORY_MGMT_KPI_FILTER = '';

async function renderCategoryManagement() {
  if (!hasMenuPermission('categoryManagement', 'view')) {
    navigateTo('dashboard');
    return;
  }
  const content = document.getElementById('pageContent');
  const canManage = hasMenuPermission('categoryManagement', 'create') || hasMenuPermission('categoryManagement', 'edit');
  const hasCached = CATEGORY_MASTER_CACHE.length > 0;
  content.innerHTML =
    '<div class="stat-grid" id="categoryKpiGrid">' + (hasCached ? '' : skeletonStatGridHtml(3)) + '</div>' +
    '<div class="page-header"><h2>Category Management</h2>' +
      '<div class="page-header-actions">' +
        (canManage ? '<button class="btn btn-primary btn-sm" id="btnAddCategory">' + ICONS.plus + ' Tambah Kategori</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="filter-bar">' +
      '<div class="filter-bar-fields">' +
        '<div class="filter-field grow filter-field-search">' +
          '<span class="filter-field-label">' + ICONS.filterField + '<span>Cari Kategori</span></span>' +
          '<span class="filter-field-input-wrap"><input type="text" id="categorySearchInput" placeholder="Cari nama kategori..."></span>' +
        '</div>' +
        '<div class="filter-field">' +
          '<span class="filter-field-label">' + ICONS.toggle + '<span>Status</span></span>' +
          '<select id="categoryStatusFilter">' +
            '<option value="">Semua Status</option>' +
            '<option value="Aktif">Aktif</option>' +
            '<option value="Nonaktif">Nonaktif</option>' +
          '</select><span class="filter-field-chevron">' + ICONS.chevronDown + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="filter-bar-actions">' +
        '<button class="filter-action-btn reset hidden" id="categoryResetBtn" type="button" title="Reset Filter">' + ICONS.refresh + '<span class="filter-action-label">Reset</span></button>' +
      '</div>' +
    '</div>' +
    '<div class="table-wrapper"><div class="table-toolbar" id="categoryPageSizeBar"></div><div class="table-scroll"><table class="table-card-generic">' +
      '<thead><tr><th>Nama Kategori</th><th class="text-center">Jumlah Item</th><th>Status</th><th>Updated At</th><th class="text-center sticky-col-right">Aksi</th></tr></thead>' +
      '<tbody id="categoryTableBody">' + (hasCached ? '' : skeletonTableRowsHtml(6, 5)) + '</tbody>' +
    '</table></div></div>' +
    '<div class="pagination-bar" id="categoryPaginationBar"></div>';

  if (canManage) document.getElementById('btnAddCategory').addEventListener('click', openAddCategoryModal);
  setupAutoFilterBar(
    document.getElementById('categoryResetBtn').closest('.filter-bar'),
    document.getElementById('categoryResetBtn'),
    function() {
      CATEGORY_MGMT_KPI_FILTER = '';
      filterCategoryTable();
    },
    function() {
      CATEGORY_MGMT_KPI_FILTER = '';
      document.getElementById('categorySearchInput').value = '';
      document.getElementById('categoryStatusFilter').value = '';
      filterCategoryTable();
    }
  );

  CATEGORY_MGMT_KPI_FILTER = '';
  if (CATEGORY_MASTER_CACHE.length) {
    renderCategoryRows(CATEGORY_MASTER_CACHE);
    renderCategoryKpiCards();
  }
  await loadCategoryTable();
}

function renderCategoryKpiCards() {
  const grid = document.getElementById('categoryKpiGrid');
  if (!grid) return;
  const total = CATEGORY_MASTER_CACHE.length;
  const aktif = CATEGORY_MASTER_CACHE.filter(function(c) { return String(c.status).toLowerCase() === 'aktif'; }).length;
  const nonaktif = total - aktif;

  grid.innerHTML =
    statCard(ICONS.filterField, 'blue', formatNumber(total), 'Total Kategori', "filterCategoryByKpi('')") +
    statCard(ICONS.check, 'green', formatNumber(aktif), 'Kategori Aktif', "filterCategoryByKpi('aktif')") +
    statCard(ICONS.toggle, 'red', formatNumber(nonaktif), 'Kategori Nonaktif', "filterCategoryByKpi('nonaktif')");

  grid.querySelectorAll('.stat-card').forEach(function(card, idx) {
    const key = ['', 'aktif', 'nonaktif'][idx];
    if (key === CATEGORY_MGMT_KPI_FILTER) card.classList.add('active');
  });
  fitStatCardValues(grid);
}

function filterCategoryByKpi(key) {
  CATEGORY_MGMT_KPI_FILTER = key;
  const searchInput = document.getElementById('categorySearchInput');
  const statusFilter = document.getElementById('categoryStatusFilter');
  if (searchInput) searchInput.value = '';
  if (statusFilter) statusFilter.value = (key === 'aktif' || key === 'nonaktif') ? (key === 'aktif' ? 'Aktif' : 'Nonaktif') : '';
  applyCategoryKpiFilter();
}

function applyCategoryKpiFilter() {
  let filtered = CATEGORY_MASTER_CACHE;
  if (CATEGORY_MGMT_KPI_FILTER === 'aktif') {
    filtered = CATEGORY_MASTER_CACHE.filter(function(c) { return String(c.status).toLowerCase() === 'aktif'; });
  } else if (CATEGORY_MGMT_KPI_FILTER === 'nonaktif') {
    filtered = CATEGORY_MASTER_CACHE.filter(function(c) { return String(c.status).toLowerCase() === 'nonaktif'; });
  }
  CATEGORY_MGMT_PAGINATION.page = 1;
  renderCategoryRows(filtered);
  renderCategoryKpiCards();
}

async function loadCategoryTable(force) {
  const cachedRes = !force ? peekCached('categoryMasterList') : null;
  if (cachedRes && cachedRes.success) {
    CATEGORY_MASTER_CACHE = cachedRes.data;
    if (CATEGORY_MGMT_KPI_FILTER) { applyCategoryKpiFilter(); } else {
      renderCategoryRows(CATEGORY_MASTER_CACHE);
      renderCategoryKpiCards();
    }
  }
  const res = await getCategoryMasterListCached(!!force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  CATEGORY_MASTER_CACHE = res.data;
  if (CATEGORY_MGMT_KPI_FILTER) { applyCategoryKpiFilter(); } else {
    renderCategoryRows(CATEGORY_MASTER_CACHE);
    renderCategoryKpiCards();
  }
}

function filterCategoryTable() {
  const q = document.getElementById('categorySearchInput').value.toLowerCase().trim();
  const statusF = document.getElementById('categoryStatusFilter').value;
  const filtered = CATEGORY_MASTER_CACHE.filter(function(c) {
    const matchQ = !q || String(c.nama).toLowerCase().indexOf(q) > -1;
    const matchS = !statusF || c.status === statusF;
    return matchQ && matchS;
  });
  CATEGORY_MGMT_PAGINATION.page = 1;
  renderCategoryRows(filtered);
  renderCategoryKpiCards();
}

function renderCategoryRows(categories) {
  const tbody = document.getElementById('categoryTableBody');
  if (!tbody) return;
  const canManage = hasMenuPermission('categoryManagement', 'edit') || hasMenuPermission('categoryManagement', 'delete');

  if (!categories.length) {
    const searchEl = document.getElementById('categorySearchInput');
    const statusEl = document.getElementById('categoryStatusFilter');
    const isFiltered = (searchEl && searchEl.value.trim()) || (statusEl && statusEl.value) || CATEGORY_MGMT_KPI_FILTER;
    tbody.innerHTML = isFiltered ?
      ('<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">' + ICONS.clipboard + '</div><div class="empty-title">Belum ada data</div><div class="empty-desc">Belum ditemukan kategori pada filter yang dipilih.</div></div></td></tr>') :
      ('<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">' + ICONS.clipboard + '</div><div class="empty-title">Belum ada kategori</div><div class="empty-desc">Tambah kategori pertama (mis. Bakpia, Bakery, Minuman) untuk mulai mengelompokkan Item Master.</div></div></td></tr>');
    clearPaginationBarById('categoryPaginationBar', 'categoryPageSizeBar');
    return;
  }

  const pageItems = paginateSlice(categories, CATEGORY_MGMT_PAGINATION);
  tbody.innerHTML = pageItems.map(function(c) {
    const statusBadgeHtml = String(c.status).toLowerCase() === 'aktif' ? '<span class="badge badge-green">Aktif</span>' : '<span class="badge badge-red">Nonaktif</span>';
    return '<tr data-category-id="' + escapeHtml(c.categoryId) + '">' +
      '<td data-label="Nama Kategori" class="card-title"><strong>' + escapeHtml(c.nama) + '</strong></td>' +
      '<td data-label="Jumlah Item" class="text-center">' + (c.itemCount > 0
        ? '<span class="badge badge-gray" style="cursor:pointer;" title="Lihat item di kategori ini" onclick="navigateTo(\'itemMaster\',{presetSearch:\'\',presetKategori:\'' + escapeHtml(c.nama).replace(/'/g, "\\'") + '\'})">' + formatNumber(c.itemCount) + ' item</span>'
        : '<span class="empty-desc" style="font-size:12px;">0 item</span>') + '</td>' +
      '<td data-label="Status">' + statusBadgeHtml + '</td>' +
      '<td data-label="Updated At">' + (c.updatedAt ? escapeHtml(formatTimestampDisplay(c.updatedAt)) : '-') + '</td>' +
      '<td data-label="Aksi" class="text-center sticky-col-right"><div class="action-btns" style="justify-content:center;">' +
        (canManage ? (
          '<button class="icon-btn success" data-tooltip="Edit" onclick="openEditCategoryModal(\'' + escapeHtml(c.categoryId).replace(/'/g,"\\'") + '\')">' + ICONS.edit + '</button>' +
          '<button class="icon-btn ' + (String(c.status).toLowerCase() === 'aktif' ? 'danger' : 'success') + '" data-tooltip="Nonaktifkan / Aktifkan" onclick="toggleCategoryStatusAction(\'' + escapeHtml(c.categoryId).replace(/'/g,"\\'") + '\', \'' + escapeHtml(c.nama).replace(/'/g,"\\'") + '\')">' + ICONS.toggle + '</button>'
        ) : '') +
      '</div></td>' +
    '</tr>';
  }).join('');

  renderPaginationBar(document.getElementById('categoryPaginationBar'), categories.length, CATEGORY_MGMT_PAGINATION, 'category', function() {
    renderCategoryRows(categories);
  }, document.getElementById('categoryPageSizeBar'));
}

function openAddCategoryModal() {
  openModal(
    modalHeaderHtml({ icon: ICONS.plus, color: 'primary', title: 'Tambah Kategori', subtitle: 'Buat kelompok item baru' }) +
    '<div class="modal-body">' +
      '<div class="form-group"><label>Nama Kategori</label><div class="field-icon-wrap">' + ICONS.filterField + '<input type="text" id="newCategoryNama" placeholder="Contoh: Bakpia, Bakery, Minuman"></div></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>' +
      '<button class="btn btn-primary" id="saveNewCategoryBtn">' + ICONS.save + ' Simpan</button>' +
    '</div>'
  );

    { id: 'newCategoryNama', label: 'Nama Kategori', validate: function(v) { return v.length < 2 ? 'Nama kategori minimal 2 karakter' : null; } }

  document.getElementById('saveNewCategoryBtn').addEventListener('click', function() {
    if (!validation.validateAll()) return;
    runWithButtonLoading(this, async function() {
      const nama = document.getElementById('newCategoryNama').value.trim();
      const res = await callServer('addCategoryMaster', { nama: nama, currentUser: CURRENT_USER }, { silent: true });
      if (res.success) {
        showToast(res.message, 'success');
        closeModal();
        invalidateCache('categoryList');
        await loadCategoryTable(true);
        const newId = (res.data && res.data.categoryId) ? res.data.categoryId : '';
        if (newId) flashRowSuccess(document.querySelector('#categoryTableBody tr[data-category-id="' + CSS.escape(newId) + '"]'));
      } else {
        showToast(res.message, 'error');
      }
    });
  });

    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>' +
      '<button class="btn btn-primary" id="saveEditCategoryBtn">' + ICONS.save + ' Simpan</button>' +

  );

        showToast(res.message, 'success');

        showToast(res.message, 'error');
      }

    confirmClass: isCurrentlyActive ? 'btn-danger' : 'btn-primary',
    onConfirm: async function() {

(function setupPullToRefresh() {
  const THRESHOLD = 90;
  const MAX_PULL = 130;
  // Jarak minimum gerakan jari mentah (piksel layar, sebelum dikali redaman
  // 0.5) sebelum indikator PTR mulai muncul sama sekali. Ini mencegah PTR
  // ke-trigger cuma dari scroll biasa yang baru mulai dari posisi paling
  // atas — user harus benar-benar menarik turun, bukan sekadar scroll.
  const DRAG_START_PX = 24;

  // FIX: sebelumnya `window._dashboardReflowing` cuma di-set true secara
  // manual di beberapa titik tertentu (load awal dashboard, ganti toggle
  // Mingguan/Bulanan). Tapi banyak hal LAIN yang juga bikin tinggi halaman
  // berubah mendadak — grafik Chart.js yang baru selesai digambar, toggle
  // Frekuensi/Value di Top 10 Item, kartu "Grafik tidak dapat dimuat" yang
  // muncul, dsb — dan semua itu TIDAK di-guard, jadi scroll bisa
  // "melompat" balik ke posisi atas persis saat jari masih menyentuh
  // layar, membuat PTR ke-trigger walau user sebenarnya sedang scroll di
  // tengah/bawah halaman (bukan menarik dari atas).
  // Solusinya: pasang ResizeObserver global di #pageContent. Setiap kali
  // tinggi konten berubah (apa pun penyebabnya), flag reflow dinyalakan
  // sesaat (debounce ~400ms) supaya PTR menahan diri dulu.
  let reflowResetTimer = null;
  function markReflowing() {
    window._dashboardReflowing = true;
    clearTimeout(reflowResetTimer);
    reflowResetTimer = setTimeout(function() {
      window._dashboardReflowing = false;
    }, 400);
  }
  (function watchContentReflow() {
    const target = document.getElementById('pageContent') || document.body;
    if (!target || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(function() { markReflowing(); });
    ro.observe(target);
  })();

  let startY = 0;
  let startX = 0;
  let pulling = false;
  let currentPull = 0;
  let indicator = null;
  let iconEl = null;
  let directionLocked = false;
  let isVerticalPull = false;

  function ensureIndicator() {
    if (indicator) return indicator;
    indicator = document.createElement('div');
    indicator.id = 'ptrIndicator';
    indicator.className = 'ptr-indicator';
    indicator.innerHTML =
      '<div class="ptr-indicator-inner">' +
        '<svg id="ptrIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>' +
      '</div>';
    document.body.appendChild(indicator);
    iconEl = indicator.querySelector('#ptrIcon');
    return indicator;
  }

  function atPageTop() {
    const se = document.scrollingElement || document.documentElement;
    return se.scrollTop <= 0;
  }

  function isExemptTarget(target) {
    return !!(target.closest && target.closest('.modal-overlay, .more-sheet, .table-scroll, input, select, textarea, .role-perm-layout, .perm-table-wrap'));
  }

  document.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) return;
    if (!atPageTop()) return;
    if (isExemptTarget(e.target)) return;
    if (window._dashboardReflowing) return;
    const overlay = document.getElementById('loadingOverlay');
    if (overlay && !overlay.classList.contains('hidden')) return;
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    pulling = true;
    currentPull = 0;
    directionLocked = false;
    isVerticalPull = false;
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pulling || e.touches.length !== 1) return;
    if (window._dashboardReflowing) { pulling = false; currentPull = 0; resetIndicator(); return; }
    const dy = e.touches[0].clientY - startY;
    const dx = e.touches[0].clientX - startX;

    // Kunci arah gesture begitu jari sudah bergerak sedikit — kalau
    // gerakannya lebih condong horizontal (swipe kiri/kanan) atau baru
    // sedikit sekali, jangan anggap ini pull-to-refresh.
    if (!directionLocked) {
      if (Math.abs(dy) < DRAG_START_PX && Math.abs(dx) < DRAG_START_PX) return;
      directionLocked = true;
      isVerticalPull = Math.abs(dy) > Math.abs(dx) * 1.2;
      if (!isVerticalPull) { pulling = false; currentPull = 0; return; }
    }
    if (!isVerticalPull) return;

    if (dy <= 0) { currentPull = 0; return; }
    if (!atPageTop()) { pulling = false; currentPull = 0; return; }

    currentPull = Math.min(dy, MAX_PULL * 1.6);
    const el = ensureIndicator();
    const visualPull = Math.min(currentPull * 0.5, MAX_PULL);
    el.classList.add('active');
    el.style.transform = 'translateY(' + visualPull + 'px)';
    const progress = Math.min(visualPull / THRESHOLD, 1);
    el.style.opacity = String(progress);
    if (iconEl) iconEl.style.transform = 'rotate(' + (progress * 360) + 'deg)';
    if (progress >= 1) el.classList.add('ready'); else el.classList.remove('ready');
  }, { passive: true });

  function resetIndicator() {
    if (!indicator) return;
    indicator.classList.remove('active', 'ready');
    indicator.style.transform = 'translateY(0)';
    indicator.style.opacity = '0';
  }

  document.addEventListener('touchend', function() {
    if (!pulling) { directionLocked = false; isVerticalPull = false; return; }
    pulling = false;
    const visualPull = Math.min(currentPull * 0.5, MAX_PULL);
    if (isVerticalPull && visualPull >= THRESHOLD) {
      if (indicator) {
        indicator.classList.add('loading');
        indicator.style.transform = 'translateY(' + (THRESHOLD * 0.7) + 'px)';
        indicator.style.opacity = '1';
      }
      invalidateCache();
      navigateTo(CURRENT_PAGE, LAST_NAV_PARAMS);
      setTimeout(resetIndicator, 700);
    } else {
      resetIndicator();
    }
    currentPull = 0;
    directionLocked = false;
    isVerticalPull = false;
  }, { passive: true });

  document.addEventListener('touchcancel', function() {
    pulling = false;
    currentPull = 0;
    directionLocked = false;
    isVerticalPull = false;
    resetIndicator();
  }, { passive: true });
})();
</script>
