  const statusFilter = document.getElementById('itemStatusFilter');
  if (searchInput) searchInput.value = '';
  if (statusFilter) statusFilter.value = (key === 'aktif' || key === 'nonaktif') ? (key === 'aktif' ? 'Aktif' : 'Nonaktif') : '';
  applyItemKpiFilter();
}

function applyItemKpiFilter() {
  if (ITEM_MGMT_KPI_FILTER === 'selisih') {
    const selisihSkuSet = {};
    ITEM_MASTER_KPI_SELISIH_SKUS.forEach(function(sku) { selisihSkuSet[String(sku)] = true; });
    ITEM_MASTER_FILTERED = ITEM_MASTER_CACHE.filter(function(it) { return selisihSkuSet[String(it.sku)]; });
  } else if (ITEM_MGMT_KPI_FILTER === 'aktif') {
    ITEM_MASTER_FILTERED = ITEM_MASTER_CACHE.filter(function(it) { return String(it.status).toLowerCase() === 'aktif'; });
  } else if (ITEM_MGMT_KPI_FILTER === 'nonaktif') {
    ITEM_MASTER_FILTERED = ITEM_MASTER_CACHE.filter(function(it) { return String(it.status).toLowerCase() === 'nonaktif'; });
  } else if (ITEM_MGMT_KPI_FILTER === 'barcodeAda') {
    ITEM_MASTER_FILTERED = ITEM_MASTER_CACHE.filter(function(it) { return String(it.barcode || '').trim() !== ''; });
  } else if (ITEM_MGMT_KPI_FILTER === 'barcodeBelum') {
    ITEM_MASTER_FILTERED = ITEM_MASTER_CACHE.filter(function(it) { return String(it.barcode || '').trim() === ''; });
  } else {
    ITEM_MASTER_FILTERED = ITEM_MASTER_CACHE;
  }
  ITEM_MASTER_PAGINATION.page = 1;
  renderItemMasterRows(ITEM_MASTER_FILTERED);
  renderItemKpiCards();
}

const PAGE_SIZE_OPTIONS = [10, 25, 50, 100];

function createPaginationState(defaultPageSize) {
  return { page: 1, pageSize: defaultPageSize || 25 };
}

function paginateSlice(items, state) {
  const totalPages = Math.max(1, Math.ceil(items.length / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  const startIdx = (state.page - 1) * state.pageSize;
  return items.slice(startIdx, startIdx + state.pageSize);
}

function buildPaginationPageNumbers(current, total) {
  const pages = [];
  if (total <= 7) {
    for (let i = 1; i <= total; i++) pages.push(i);
    return pages;
  }
  pages.push(1);
  if (current > 3) pages.push('...');
  const start = Math.max(2, current - 1);
  const end = Math.min(total - 1, current + 1);
  for (let i = start; i <= end; i++) pages.push(i);
  if (current < total - 2) pages.push('...');
  pages.push(total);
  return pages;
}

function renderPageSizeControl(sizeEl, state, onChange) {
  if (!sizeEl) return;
  const pageSizeOptionsHtml = PAGE_SIZE_OPTIONS.map(function(n) {
    return '<option value="' + n + '"' + (n === state.pageSize ? ' selected' : '') + '>' + n + '</option>';
  }).join('');
  sizeEl.innerHTML =
    '<div class="pagination-size">' +
      '<span class="pagination-size-label">Tampilkan</span>' +
      '<select class="pagination-size-select">' + pageSizeOptionsHtml + '</select>' +
      '<span class="pagination-size-label">data / halaman</span>' +
    '</div>';
  const sizeSelect = sizeEl.querySelector('.pagination-size-select');
  if (sizeSelect) sizeSelect.addEventListener('change', function() {
    state.pageSize = parseInt(sizeSelect.value, 10) || state.pageSize;
    state.page = 1;
    onChange();
  });
}

function renderPaginationBar(barEl, totalItems, state, itemLabel, onChange, sizeEl) {
  if (sizeEl) renderPageSizeControl(sizeEl, state, onChange);
  if (!barEl) return;
  if (!totalItems) { barEl.innerHTML = ''; return; }
  const totalPages = Math.max(1, Math.ceil(totalItems / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  const startIdx = (state.page - 1) * state.pageSize;
  const endIdx = Math.min(startIdx + state.pageSize, totalItems);

  const pageNumbersHtml = buildPaginationPageNumbers(state.page, totalPages).map(function(p) {
    if (p === '...') return '<span class="pagination-ellipsis">…</span>';
    return '<button type="button" class="pagination-page-btn' + (p === state.page ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
  }).join('');

  barEl.innerHTML =
    '<div class="pagination-info">Menampilkan <strong>' + (startIdx + 1) + '–' + endIdx + '</strong> dari <strong>' + formatNumber(totalItems) + '</strong> ' + itemLabel + '</div>' +
    '<div class="pagination-controls">' +
      '<button type="button" class="btn btn-secondary btn-sm pagination-prev"' + (state.page <= 1 ? ' disabled' : '') + '>' + ICONS.chevronLeft + ' Prev</button>' +
      '<div class="pagination-pages">' + pageNumbersHtml + '</div>' +
      '<button type="button" class="btn btn-secondary btn-sm pagination-next"' + (state.page >= totalPages ? ' disabled' : '') + '>Next ' + ICONS.chevronRight + '</button>' +
    '</div>';

  const prevBtn = barEl.querySelector('.pagination-prev');
  if (prevBtn) prevBtn.addEventListener('click', function() { state.page = Math.max(1, state.page - 1); onChange(); });
  const nextBtn = barEl.querySelector('.pagination-next');
  if (nextBtn) nextBtn.addEventListener('click', function() { state.page = Math.min(totalPages, state.page + 1); onChange(); });
  barEl.querySelectorAll('.pagination-page-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.page = parseInt(btn.getAttribute('data-page'), 10) || 1;
      onChange();
    });
  });
}

function clearPaginationBarById(id, sizeId) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = '';
  if (sizeId) {
    const sizeEl = document.getElementById(sizeId);
    if (sizeEl) sizeEl.innerHTML = '';
  }
}

const ITEM_MASTER_PAGINATION = createPaginationState(50);

async function loadItemMasterTable(force) {
  const cachedRes = !force ? peekCached('itemMaster') : null;
  if (cachedRes && cachedRes.success) {
    ITEM_MASTER_CACHE = cachedRes.data;
    renderItemKpiCards();
    if (ITEM_MGMT_KPI_FILTER) {
      applyItemKpiFilter();
    } else {
      ITEM_MASTER_FILTERED = cachedRes.data;
      ITEM_MASTER_PAGINATION.page = 1;
      renderItemMasterRows(ITEM_MASTER_FILTERED);
    }
  }

  const res = await getItemMasterCached(!!force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  ITEM_MASTER_CACHE = res.data;
  renderItemKpiCards();
  populateItemKategoriFilterOptions();
  if (ITEM_MGMT_KPI_FILTER) {
    applyItemKpiFilter();
  } else {
    ITEM_MASTER_FILTERED = res.data;
    ITEM_MASTER_PAGINATION.page = 1;
    renderItemMasterRows(ITEM_MASTER_FILTERED);
  }
}

function populateItemKategoriFilterOptions() {
  const sel = document.getElementById('itemKategoriFilter');
  if (!sel) return;
  const current = sel.value;
  const kategoriSet = {};
  ITEM_MASTER_CACHE.forEach(function(it) { if (it.kategori) kategoriSet[it.kategori] = true; });
  const kategoriList = Object.keys(kategoriSet).sort();
  sel.innerHTML = '<option value="">Semua Kategori</option>' +
    kategoriList.map(function(k) { return '<option value="' + escapeHtml(k) + '">' + escapeHtml(k) + '</option>'; }).join('');
  if (current && kategoriList.indexOf(current) > -1) sel.value = current;
  const wrap = sel.nextElementSibling;
  if (wrap && wrap.classList.contains('cs-select')) refreshCsSelect(sel, wrap);
}

function filterItemMasterTable() {
  const q = document.getElementById('itemSearchInput').value.toLowerCase().trim();
  const statusF = document.getElementById('itemStatusFilter').value;
  const kategoriF = document.getElementById('itemKategoriFilter').value;
  ITEM_MASTER_FILTERED = ITEM_MASTER_CACHE.filter(function(it) {
    const matchQ = !q || String(it.sku).toLowerCase().indexOf(q) > -1 || String(it.nama).toLowerCase().indexOf(q) > -1;
    const matchS = !statusF || it.status === statusF;
    const matchK = !kategoriF || it.kategori === kategoriF;
    return matchQ && matchS && matchK;
  });
  ITEM_MASTER_PAGINATION.page = 1;
  renderItemMasterRows(ITEM_MASTER_FILTERED);
  renderItemKpiCards();
}

function renderItemMasterRows(items) {
  const tbody = document.getElementById('itemTableBody');
  if (!tbody) return;
  const readOnly = isReadOnlyRole();
  const colCount = 7;

  if (!items.length) {
    const searchEl = document.getElementById('itemSearchInput');
    const statusEl = document.getElementById('itemStatusFilter');
    const kategoriEl = document.getElementById('itemKategoriFilter');
    const isFiltered = (searchEl && searchEl.value.trim()) || (statusEl && statusEl.value) || (kategoriEl && kategoriEl.value) || ITEM_MGMT_KPI_FILTER;
    tbody.innerHTML = isFiltered ?
      ('<tr><td colspan="' + colCount + '"><div class="empty-state"><div class="empty-icon">' + ICONS.clipboard + '</div><div class="empty-title">Belum ada data</div><div class="empty-desc">Belum ditemukan item pada filter yang dipilih.</div></div></td></tr>') :
      ('<tr><td colspan="' + colCount + '"><div class="empty-state"><div class="empty-icon">' + ICONS.clipboard + '</div><div class="empty-title">Belum ada item</div><div class="empty-desc">Tambah item baru atau import dari file untuk mulai mengelola Item Master.</div></div></td></tr>');
    clearPaginationBarById('itemPaginationBar', 'itemPageSizeBar');
    return;
  }

  const pageItems = paginateSlice(items, ITEM_MASTER_PAGINATION);
  tbody.innerHTML = pageItems.map(function(it) {
    return '<tr data-sku="' + escapeHtml(it.sku) + '">' +
      '<td data-label="SKU"><strong>' + escapeHtml(it.sku) + '</strong></td>' +
      '<td data-label="Nama Item" class="card-title"><span class="cell-clip" title="' + escapeHtml(it.nama) + '">' + escapeHtml(it.nama) + '</span></td>' +
      '<td data-label="Kategori">' + (it.kategori ? '<span class="badge badge-gray">' + escapeHtml(it.kategori) + '</span>' : '<span class="empty-desc" style="font-size:12px;">-</span>') + '</td>' +
      '<td data-label="Barcode">' + (it.barcode ? '<span class="cell-clip" title="' + escapeHtml(it.barcode) + '">' + escapeHtml(it.barcode) + '</span>' : '<span class="badge badge-gray" style="font-size:10.5px;padding:1px 7px;">Belum Ada</span>') + '</td>' +
      '<td data-label="Harga" class="text-right">' + formatRupiah(it.harga) + '</td>' +
      '<td data-label="Status">' + (it.status === 'Aktif' ? '<span class="badge badge-green">Aktif</span>' : '<span class="badge badge-red">Nonaktif</span>') + '</td>' +
      '<td data-label="Aksi" class="text-center sticky-col-right"><div class="action-btns" style="justify-content:center;">' +
        '<button class="icon-btn" data-tooltip="Lihat Detail" onclick="openItemDetailModal(\'' + escapeHtml(it.sku).replace(/'/g,"\\'") + '\')">' + ICONS.eye + '</button>' +
        (readOnly ? '' :
          '<button class="icon-btn success" data-tooltip="Edit" onclick="openEditItemModal(\'' + escapeHtml(it.sku).replace(/'/g,"\\'") + '\')">' + ICONS.edit + '</button>') +
      '</div></td>' +
    '</tr>';
  }).join('');

  renderPaginationBar(document.getElementById('itemPaginationBar'), items.length, ITEM_MASTER_PAGINATION, 'item', function() {
    renderItemMasterRows(items);
  }, document.getElementById('itemPageSizeBar'));
}

function wireKategoriSelectNewOption(selectId) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  const wrap = sel.closest('.field-icon-wrap');
  const formGroup = wrap ? wrap.parentElement : sel.parentElement;

  function closeInlineForm() {
    const existing = document.getElementById(selectId + 'NewCatForm');
    if (existing) existing.remove();
  }

  sel.addEventListener('change', function() {
    closeInlineForm();
    if (sel.value !== NEW_CATEGORY_OPTION_VALUE_) return;

    const formHtml =
      '<div class="inline-new-category" id="' + selectId + 'NewCatForm" style="margin-top:8px;padding:10px;border:1px solid var(--border-color,#e2e8f0);border-radius:8px;background:var(--bg-subtle,#f8fafc);">' +
        '<label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">Nama kategori baru</label>' +
        '<div style="display:flex;gap:8px;">' +
          '<input type="text" id="' + selectId + 'NewCatInput" placeholder="Contoh: Snack" style="flex:1;">' +
          '<button type="button" class="btn btn-secondary" id="' + selectId + 'NewCatCancel">Batal</button>' +
          '<button type="button" class="btn btn-primary" id="' + selectId + 'NewCatSave">Tambah</button>' +
        '</div>' +
        '<div id="' + selectId + 'NewCatError" style="color:var(--danger,#dc2626);font-size:12px;margin-top:6px;display:none;"></div>' +
      '</div>';

    if (formGroup) formGroup.insertAdjacentHTML('beforeend', formHtml);
    const input = document.getElementById(selectId + 'NewCatInput');
    const errorEl = document.getElementById(selectId + 'NewCatError');
    if (input) input.focus();

    function showError(msg) {
      if (!errorEl) return;
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    document.getElementById(selectId + 'NewCatCancel').addEventListener('click', function() {
      sel.value = '';
      closeInlineForm();
    });

    async function submitNewCategory() {
      const nama = (input.value || '').trim();
      if (!nama) { showError('Nama kategori wajib diisi.'); input.focus(); return; }
      const res = await callServer('addCategoryMaster', { nama: nama, currentUser: CURRENT_USER }, { loadingText: 'Menambahkan kategori...' });
      if (res.success) {
        showToast(res.message, 'success');
        invalidateCache('categoryList');
        invalidateCache('categoryMasterList');
        await getCategoryListCached(true);
        sel.innerHTML = kategoriSelectOptionsHtml(nama);
        closeInlineForm();
      } else {
        showError(res.message);
      }
    }

    document.getElementById(selectId + 'NewCatSave').addEventListener('click', submitNewCategory);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); submitNewCategory(); }
      if (e.key === 'Escape') { sel.value = ''; closeInlineForm(); }
    });
  });
}

function openImportItemModal() {
  openModal(
    modalHeaderHtml({ icon: ICONS.upload, color: 'purple', title: 'Import Item Master', subtitle: 'Upload data item secara massal dari file' }) +
    '<div class="modal-body">' +
      '<div class="upload-box" id="importItemDropzone">' +

        '<div class="upload-text">Klik untuk pilih file</div>' +

        '<input type="file" id="importItemFile" accept=".csv,.tsv,.txt,.xlsx,.xls" style="display:none">' +
      '</div>' +
      '<div id="importItemFileName" style="margin-top:10px;font-size:12.5px;color:var(--gray-700);"></div>' +
      '<div class="import-warning">File Item Master biasanya berkolom: Nomor SKU, Judul Produk, Unit dalam Persediaan, Harga. SKU, Nama Produk, Harga akan diambil, dan kolom Kategori/Tipe Produk (kalau ada di file) ikut diimport juga. Stock tidak diimport di sini. SKU yang sudah terdaftar akan dilewati (nama/harga/kategori TIDAK ditimpa) — KECUALI kolom Barcode: kalau file punya kolom Barcode dan SKU-nya cocok dengan item lama yang barcode-nya masih kosong, barcode-nya akan otomatis terisi.</div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>' +
      '<button class="btn btn-primary" id="processImportItemBtn" disabled>' + ICONS.upload + ' Import</button>' +
    '</div>'
  );

  let parsedRows = null;
  const dropzone = document.getElementById('importItemDropzone');
  const fileInput = document.getElementById('importItemFile');
  dropzone.addEventListener('click', function() { fileInput.click(); });

  fileInput.addEventListener('change', async function() {
    const file = fileInput.files[0];
    if (!file) return;
    document.getElementById('importItemFileName').textContent = file.name;
    try {
      const parsed = await parseImportFile(file);
      if (!parsed.headers.length) {
        showToast('File kosong atau format tidak sesuai.', 'error');
        return;
      }
      const headersLower = parsed.headers.map(function(h) { return h.toLowerCase(); });
      const idxSku = findColumnIndex(headersLower, ['nomor sku', 'sku', 'kode sku']);
      const idxNama = findColumnIndex(headersLower, ['judul produk', 'nama produk', 'nama item', 'nama']);
      const idxHarga = findColumnIndex(headersLower, ['harga']);
      const idxKategori = findColumnIndex(headersLower, ['kategori', 'category', 'tipe produk', 'jenis produk']);
      const idxBarcode = findColumnIndex(headersLower, ['barcode', 'kode barcode', 'no barcode', 'nomor barcode']);

      if (idxSku === -1) {
        showToast('Kolom SKU tidak ditemukan di file.', 'error');
        return;
      }
      if (idxBarcode === -1 && (idxNama === -1 || idxHarga === -1)) {
        showToast('Kolom SKU / Nama Produk / Harga tidak ditemukan di file.', 'error');
        return;
      }

      parsedRows = parsed.rows.map(function(row) {
        const r = {
          sku: row[idxSku] || '',
          nama: idxNama > -1 ? (row[idxNama] || '') : '',
          harga: idxHarga > -1 ? (row[idxHarga] || '0').replace(/[^0-9.\-]/g, '') : '0'
        };
        if (idxKategori > -1) r.kategori = (row[idxKategori] || '').trim();
        if (idxBarcode > -1) r.barcode = (row[idxBarcode] || '').trim();
        return r;
      }).filter(function(r) { return r.sku; });

      document.getElementById('processImportItemBtn').disabled = parsedRows.length === 0;
      if (!parsedRows.length) showToast('Tidak ada baris valid ditemukan pada file.', 'error');
    } catch (err) {
      showToast('Gagal membaca file: ' + err.message, 'error');
    }
  });

  document.getElementById('processImportItemBtn').addEventListener('click', async function() {
    if (!parsedRows || !parsedRows.length) return;
    const btn = this;
    btn.disabled = true;

    // FIX UTAMA (import ~900 baris gagal): sebelumnya SELURUH rows dikirim
    // dalam SATU request tanpa dipecah sama sekali — sekarang dipecah
    // otomatis (runChunkedImport) sama seperti import Stock Sistem, plus
    // progress bar 0-100% asli, dan karena api-bridge.js sudah pindah ke
    // POST (bukan lagi GET/JSONP dengan payload di URL), tidak ada lagi
    // batas jumlah baris yang bisa diimport dalam sekali proses.
    const result = await runChunkedImport(
      'importItemMaster',
      parsedRows,
      function(chunk) { return { rows: chunk, currentUser: CURRENT_USER }; },
      function(total, chunkStats) {
        return {
          added: (total.added || 0) + (chunkStats.added || 0),
          updated: (total.updated || 0) + (chunkStats.updated || 0),
          alreadyExists: (total.alreadyExists || 0) + (chunkStats.alreadyExists || 0),
          barcodeFilled: (total.barcodeFilled || 0) + (chunkStats.barcodeFilled || 0),
          barcodeSkippedDup: (total.barcodeSkippedDup || 0) + (chunkStats.barcodeSkippedDup || 0),
          skipped: (total.skipped || 0) + (chunkStats.skipped || 0),
          duplicateInFile: (total.duplicateInFile || 0) + (chunkStats.duplicateInFile || 0)
        };
      },
      'Mengimport item master...'
    );

    btn.disabled = false;

    if (result.success) {
      const stats = result.stats;
      showStatsToast(
        'Import item master selesai',
        [
          { label: 'Ditambah', value: stats.added },
          { label: 'SKU sudah ada (ditolak)', value: stats.alreadyExists > 0 ? stats.alreadyExists : null, warn: stats.alreadyExists > 0 },
          { label: 'Barcode terisi ke item lama', value: stats.barcodeFilled > 0 ? stats.barcodeFilled : null },
          { label: 'Barcode dilewati (sudah dipakai item lain)', value: stats.barcodeSkippedDup > 0 ? stats.barcodeSkippedDup : null, warn: stats.barcodeSkippedDup > 0 },
          { label: 'Baris kosong (dilewati)', value: stats.skipped > 0 ? stats.skipped : null },
          { label: 'SKU duplikat dlm file (diabaikan)', value: stats.duplicateInFile > 0 ? stats.duplicateInFile : null, warn: true }
        ],
        'success'
      );
      closeModal();
      loadItemMasterTable(true);
    } else {
      showToast(result.message, 'error');
    }
  });
}

function findColumnIndex(headersLower, candidates) {
  for (let i = 0; i < headersLower.length; i++) {
    for (let j = 0; j < candidates.length; j++) {
      if (headersLower[i].indexOf(candidates[j]) > -1) return i;
    }
  }
  return -1;
}

function downloadCsv(content, filename) {
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

const _EXPORT_WIDGET_BOUND = new WeakSet();
function bindExportWidget(id, dataProviderFn) {
  const wrap = document.getElementById(id);
  const btn = document.getElementById(id + '_btn');
  const pop = document.getElementById(id + '_pop');
  if (!wrap || !btn || !pop) return;
  if (_EXPORT_WIDGET_BOUND.has(wrap)) return; 
  _EXPORT_WIDGET_BOUND.add(wrap);

  function closePopover() { wrap.classList.remove('open'); }
  function togglePopover(e) {
    e.stopPropagation();
    const willOpen = !wrap.classList.contains('open');
    document.querySelectorAll('.export-widget.open').forEach(function(w) { w.classList.remove('open'); });
    if (willOpen && typeof closeAllRowMenus === 'function') closeAllRowMenus();
    if (willOpen) wrap.classList.add('open');
  }
  btn.addEventListener('click', togglePopover);
  document.addEventListener('click', function(e) {
    if (!wrap.isConnected) return; 
    if (!wrap.contains(e.target)) closePopover();
  });

  pop.querySelectorAll('.export-popover-item').forEach(function(item) {
    item.addEventListener('click', async function(e) {
      e.stopPropagation();
      closePopover();
      if (btn.disabled) return;
      const fmt = item.getAttribute('data-fmt');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.classList.add('loading');
      btn.innerHTML = EXPORT_ICON_MAIN + '<span>Memproses...</span>';
      try {
        const spec = await dataProviderFn();
        if (!spec || !spec.rows || !spec.rows.length) {
          showToast('Tidak ada data untuk diexport.', 'error');
          return;
        }
        if (fmt === 'csv') exportSpecAsCsv(spec);
        else if (fmt === 'pdf') exportSpecAsPdf(spec);
        else exportSpecAsExcel(spec);
        showToast('Export ' + fmt.toUpperCase() + ' berhasil.', 'success');
      } catch (err) {
        showToast('Gagal export: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.innerHTML = originalHtml;
      }
    });
  });
}

function exportTimestamp() {
  const d = new Date();
  const pad = function(n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());
}

function csvEscape(val) {
  if (val === null || val === undefined) return '';
  const s = String(val);
  if (/[",\n;]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportSpecAsCsv(spec) {
  const cols = spec.columns;
  let csv = '\uFEFF'; 
  if (spec.title) csv += csvEscape(spec.title) + '\n';
  if (spec.subtitle) csv += csvEscape(spec.subtitle) + '\n';
  if (spec.approvalInfo) csv += csvEscape(spec.approvalInfo) + '\n';
  if (spec.title || spec.subtitle) csv += '\n';
  csv += cols.map(function(c) { return csvEscape(c.label); }).join(',') + '\n';
  spec.rows.forEach(function(row) {
    csv += cols.map(function(c) { return csvEscape(row[c.key]); }).join(',') + '\n';
  });
  downloadCsv(csv, (spec.filenameBase || 'export') + '_' + exportTimestamp() + '.csv');
}

function exportSpecAsExcel(spec) {
  const cols = spec.columns;
  const numberColSet = {};
  (spec.numberCols || []).forEach(function(k) { numberColSet[k] = true; });
  const displayFormatCols = spec.displayFormatCols || {};

  const COLOR_HEADER_BG = 'C6D9B0';
  const COLOR_SUBTOTAL_BG = 'F4C99B';
  const COLOR_GRANDTOTAL_BG = '4472C4';
  const COLOR_SELISIH_MINUS_BG = 'FF0000';
  const COLOR_SELISIH_ZERO_BG = 'C6EFCE';  
  const COLOR_SELISIH_PLUS_BG = 'FFEB9C';  
  const BORDER_THIN = { style: 'thin', color: { rgb: 'B7B7B7' } };
  const THIN_BORDER = { top: BORDER_THIN, bottom: BORDER_THIN, left: BORDER_THIN, right: BORDER_THIN };

  const aoa = [];
  if (spec.title) aoa.push([spec.title]);
  if (spec.subtitle) aoa.push([spec.subtitle]);
  let approvalInfoRowIndex = -1;
  if (spec.approvalInfo) {
    aoa.push([spec.approvalInfo]);
    approvalInfoRowIndex = aoa.length - 1;
  }
  if (spec.title || spec.subtitle) aoa.push([]);
  const headerRowIndex = aoa.length; 
  aoa.push(cols.map(function(c) { return c.label; }));
  spec.rows.forEach(function(row) {
    aoa.push(cols.map(function(c) { return row[c.key]; }));
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  if (spec.title) {
    ws['A1'].s = { font: { bold: true, sz: 13 } };
  }
  if (approvalInfoRowIndex >= 0) {
    const approvalAddr = XLSX.utils.encode_cell({ r: approvalInfoRowIndex, c: 0 });
    if (ws[approvalAddr]) {
      ws[approvalAddr].s = { font: { italic: true, sz: 10, color: { rgb: '6B7280' } } };
    }
  }

  if (spec.badgeText) {
    const lastColIdx = cols.length - 1;
    const badgeStartCol = Math.max(0, lastColIdx - 1); 
    const badgeAddr = XLSX.utils.encode_cell({ r: 0, c: badgeStartCol });
    ws[badgeAddr] = { t: 's', v: spec.badgeText };
    ws[badgeAddr].s = {
      font: { bold: true, color: { rgb: 'FFFFFF' }, sz: 12 },
      fill: { fgColor: { rgb: spec.badgeColor || '2E86C1' } },
      alignment: { horizontal: 'center', vertical: 'center' }
    };
    if (badgeStartCol < lastColIdx) {
      const badgeEndAddr = XLSX.utils.encode_cell({ r: 0, c: lastColIdx });
      if (!ws[badgeEndAddr]) ws[badgeEndAddr] = { t: 's', v: '' };
      ws[badgeEndAddr].s = ws[badgeAddr].s;
      ws['!merges'] = ws['!merges'] || [];
      ws['!merges'].push({ s: { r: 0, c: badgeStartCol }, e: { r: 0, c: lastColIdx } });
    }
  }

  const headerExcelRow = headerRowIndex + 1; 
  cols.forEach(function(c, ci) {
    const addr = XLSX.utils.encode_cell({ r: headerRowIndex, c: ci });
    if (!ws[addr]) ws[addr] = { t: 's', v: c.label };
    ws[addr].s = {
      font: { bold: true, color: { rgb: '000000' } },
      fill: { fgColor: { rgb: COLOR_HEADER_BG } },
      alignment: { horizontal: c.align || (numberColSet[c.key] ? 'right' : 'left'), wrapText: true },
      border: THIN_BORDER
    };
  });

  spec.rows.forEach(function(row, ri) {
    const excelRowIndex = headerRowIndex + 1 + ri; 
    const rowType = spec.rowTypeKey ? row[spec.rowTypeKey] : null;
    const isSubtotal = rowType === 'subtotal';
    const isGrandtotal = rowType === 'grandtotal';

    cols.forEach(function(c, ci) {
      const addr = XLSX.utils.encode_cell({ r: excelRowIndex, c: ci });
      const v = row[c.key];
      const isNumCol = !!numberColSet[c.key];
      const align = c.align || (isNumCol ? 'right' : 'left');

      let cellStyle = {
        alignment: { horizontal: align },
        border: THIN_BORDER
      };

      if (isNumCol) {
        const n = typeof v === 'number' ? v : parseFloat(v);
        if (v === '' || v === null || v === undefined) {
          if (!ws[addr]) ws[addr] = { t: 's', v: '' };
        } else if (!isNaN(n)) {
          ws[addr] = { t: 'n', v: n };
          cellStyle.numFmt = '#,##0';
        }
      }

      const isNeg = typeof ws[addr] !== 'undefined' && ws[addr].t === 'n' && ws[addr].v < 0;
      const isSelisihCol = !isSubtotal && !isGrandtotal && (c.key === 'selisihQty' || c.key === 'selisihValue');

      if (isGrandtotal) {
        cellStyle.fill = { fgColor: { rgb: COLOR_GRANDTOTAL_BG } };
        cellStyle.font = { bold: true, color: { rgb: 'FFFFFF' } };
      } else if (isSubtotal) {
        cellStyle.fill = { fgColor: { rgb: COLOR_SUBTOTAL_BG } };
        cellStyle.font = { bold: true };
      } else if (isSelisihCol) {
        const numVal = typeof ws[addr] !== 'undefined' && ws[addr].t === 'n' ? ws[addr].v : NaN;
        if (isNeg) {
          cellStyle.fill = { fgColor: { rgb: COLOR_SELISIH_MINUS_BG } };
          cellStyle.font = { bold: true, color: { rgb: 'FFFFFF' } };
        } else if (numVal > 0) {
          cellStyle.fill = { fgColor: { rgb: COLOR_SELISIH_PLUS_BG } };
        } else {
          cellStyle.fill = { fgColor: { rgb: COLOR_SELISIH_ZERO_BG } };
        }
      } else if (isNeg) {
        cellStyle.font = { color: { rgb: 'DC2626' } };
      }

      if (!ws[addr]) ws[addr] = { t: 's', v: '' };
      ws[addr].s = cellStyle;
    });
  });

  const lastRow = headerRowIndex + spec.rows.length;
  const lastCol = cols.length - 1;
  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: lastRow, c: lastCol } });
  ws['!freeze'] = { xSplit: 0, ySplit: headerExcelRow };
  ws['!rows'] = [];
  if (spec.badgeText) ws['!rows'][0] = { hpt: 24 };
  ws['!rows'][headerRowIndex] = { hpt: 34 };

  ws['!cols'] = cols.map(function(c) {
    let maxLen = String(c.label).length;
    spec.rows.forEach(function(row) {
      const v = row[c.key];
      const len = v === null || v === undefined ? 0 : String(v).length;
      if (len > maxLen) maxLen = len;
    });
    return { wch: Math.min(Math.max(maxLen + 3, 10), 45) };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (spec.sheetName || 'Data').substring(0, 31));
  XLSX.writeFile(wb, (spec.filenameBase || 'export') + '_' + exportTimestamp() + '.xlsx');
}

function exportSpecAsPdf(spec) {

    return '<th style="text-align:' + (c.align || (c.numeric ? 'right' : 'left')) + '">' + escapeHtml(c.label) + '</th>';
  }).join('') + '</tr>';

  const tbodyHtml = spec.rows.map(function(row, i) {
    const rowType = spec.rowTypeKey ? row[spec.rowTypeKey] : null;
    const rowClass = rowType === 'subtotal' ? 'subtotal-row' : (rowType === 'grandtotal' ? 'grandtotal-row' : (i % 2 === 0 ? 'even' : 'odd'));
    return '<tr class="' + rowClass + '">' + cols.map(function(c) {
      const v = row[c.key];
      const align = c.align || ((spec.numberCols && spec.numberCols.indexOf(c.key) !== -1) ? 'right' : 'left');

      return '<td style="text-align:' + align + ';' + cellStyle + '">' + escapeHtml(displayVal === null || displayVal === undefined ? '' : String(displayVal)) + '</td>';

      '.header{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #16A34A;padding-bottom:10px;margin-bottom:14px;}' +
      '.header h1{font-size:18px;margin:0 0 4px 0;color:#166534;}' +
      '.header .sub{font-size:11px;color:#6b7280;}' +
      '.header .approval-info{font-size:10.5px;color:#6b7280;font-style:italic;margin-top:3px;}' +

      'td{padding:6px 8px;border:1px solid #e5e7eb;word-break:break-word;}' +
      'tr.even td{background:#f9fafb;}' +

function isRejectedSo_(so) {
  return String(so.status) === 'Draft' && String(so.approvalNote || '').trim() !== '';
}

function renderSoTableRows(data) {
  SO_ACTIVE_LIST_CACHE = data || [];
  const tbody = document.getElementById('soTableBody');
  if (!tbody) return;

  const statusFilterEl = document.getElementById('soStatusFilter');
  const statusFilterVal = statusFilterEl ? statusFilterEl.value : '';
  let filteredData = data || [];
  if (statusFilterVal === 'Rejected') {
    filteredData = filteredData.filter(isRejectedSo_);
  } else if (statusFilterVal === 'Draft') {
    filteredData = filteredData.filter(function(so) { return !isRejectedSo_(so); });
  }

  const countEl = document.getElementById('soFilterCount');
  if (countEl) countEl.innerHTML = 'Menampilkan <strong>' + filteredData.length + '</strong> SO';
  if (!filteredData.length) {
    tbody.innerHTML = '<tr><td colspan="11" class="td-empty-state"><div class="empty-state"><div class="empty-icon">' + ICONS.note + '</div><div class="empty-title">' + (statusFilterVal ? 'Tidak ada SO dengan status ini' : 'Tidak ada Stock Opname yang sedang berjalan') + '</div><div class="empty-desc">' + (statusFilterVal ? 'Coba ubah atau reset filter Status.' : 'Mulai SO baru, atau lihat SO yang sudah selesai di menu Riwayat SO.') + '</div></div></td></tr>';

  }
  tbody.innerHTML = filteredData.map(function(so) {
    const selisihCls = so.totalSelisihQty < 0 ? 'prev-selisih-minus' : (so.totalSelisihQty > 0 ? 'prev-selisih-plus' : 'prev-selisih-zero');

      '<td data-label="Total Item" class="text-center">' + so.totalItem + '</td>' +

      '<td data-label="Aksi" class="text-center sticky-col-right"><div class="action-btns" style="justify-content:center;">' +
        '<button class="icon-btn" data-tooltip="Lihat Detail" onclick="navigateTo(\'soDetail\',{soId:\'' + escapeHtml(so.soId) + '\'})">' + ICONS.eye + '</button>' +
        (isAdmin() ? '<button class="icon-btn danger" data-tooltip="Hapus" onclick="confirmDeleteSo(\'' + escapeHtml(so.soId) + '\', \'stockOpname\')">' + ICONS.trash + '</button>' : '') +
      '</div></td>' +
    '</tr>';
  }).join('');
}

async function loadSoTable(force) {
  const params = { currentUser: CURRENT_USER, statusFilter: 'active', tipeSo: TIPE_SO_STATE.stockOpname };
  params.search = document.getElementById('soSearchInput') ? document.getElementById('soSearchInput').value : '';
  if (needsStorePicker() && document.getElementById('soStoreFilter')) {
    params.store = document.getElementById('soStoreFilter').value;
  }
  const cacheKey = 'soList:' + JSON.stringify(params);

  const cachedRes = !force ? peekCached(cacheKey) : null;
  let skeletonTimer = null;
  if (cachedRes && cachedRes.success) {
    renderSoTableRows(cachedRes.data);
  } else {
    skeletonTimer = setTimeout(function() {
      const tbody = document.getElementById('soTableBody');
      if (tbody) tbody.innerHTML = skeletonSoListCardsHtml(4);
    }, 150);
  }

  prefetchOppositeTipeSo('stockOpname', 'soList', 'getSoListForStore', function(tipe) {
    const p = { currentUser: CURRENT_USER, statusFilter: 'active', tipeSo: tipe };
    p.search = document.getElementById('soSearchInput') ? document.getElementById('soSearchInput').value : '';
    if (needsStorePicker() && document.getElementById('soStoreFilter')) {
      p.store = document.getElementById('soStoreFilter').value;
    }
    return p;
  });

  const res = await getCached(cacheKey, function() {
    return callServer('getSoListForStore', params, { silent: true });
  }, force);
  clearTimeout(skeletonTimer);
  if (!res.success) { showToast(res.message, 'error'); return; }

  renderSoTableRows(res.data);
}

    '<div class="modal-body">' +
      storeField +
      tipeField +
      '<div class="form-group"><label>Tanggal SO</label><div class="field-icon-wrap">' + ICONS.clock + '<input type="date" id="newSoTanggal" value="' + todayStr() + '"></div></div>' +
    '</div>' +

      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>' +
      '<button class="btn btn-primary" id="createSoBtn">' + ICONS.plus + ' Buat SO</button>' +
    '</div>'
  );

  if (needsStorePicker()) createSoFields.unshift({ id: 'newSoStore', label: 'Store' });
  attachFormValidation(createSoFields, document.getElementById('createSoBtn'));

  document.getElementById('createSoBtn').addEventListener('click', function() {
    runWithButtonLoading(this, async function() {
      const storeVal = needsStorePicker()
        ? document.getElementById('newSoStore').value
        : ((myStores && myStores.length) ? myStores[0] : CURRENT_USER.store);
      const params = {
        currentUser: CURRENT_USER,
        store: storeVal,
        tipe: document.getElementById('newSoTipe').value,
        tanggal: document.getElementById('newSoTanggal').value,
        // FIX (Buat SO 1x jadi beberapa SO): key unik dibuat SEKALI di sini
        // per klik tombol, dan tetap SAMA persis dipakai lagi kalau
        // callServer melakukan retry otomatis (timeout/gagal jaringan) untuk
        // percobaan yang SAMA. Backend (createStockOpname di Code.gs)
        // memakai key ini untuk mengenali "ini permintaan yang sama yang
        // sempat diulang" dan tidak membuat baris SO kedua/ketiga/dst.
        idempotencyKey: (Date.now() + '_' + Math.random().toString(36).slice(2))
      };
      if (!params.store || !params.tanggal) {
        showToast('Store dan Tanggal SO wajib diisi.', 'error');
        return;
      }
      const res = await callServer('createStockOpname', params, { silent: true });
      if (res.success) {
        showToast('SO berhasil dibuat', 'success', { code: res.data.soId });
        invalidateCache(null, { tipeSo: params.tipe });
        TIPE_SO_STATE.stockOpname = params.tipe;
        closeModal();
        navigateTo('soDetail', { soId: res.data.soId });
      } else {
        showToast(res.message, 'error');
      }
    });
  });
}

  const cached = peekCached(cacheKey);
  if (cached && cached.success) {
    CURRENT_SO_DETAIL = cached.data;
    document.getElementById('pageTitle').textContent = 'Detail SO — ' + cached.data.soId;
    renderSoDetailContent();
  } else {
    content.innerHTML = brandSpinnerHtml('Memuat...');
  }

  const firstAttemptPromise = new Promise(function(resolve) {
    google.script.run
      .withSuccessHandler(function(result) { resolve({ ok: true, result: result }); })
      .withFailureHandler(function(err) { resolve({ ok: false, err: err }); })
      .getSoDetail(soId);
  }).then(function(outcome) {
    if (!outcome.ok || !outcome.result || !outcome.result.success) return outcome;

    if (myOpenToken !== _SO_DETAIL_OPEN_TOKEN) return outcome;

    const editingThisSo = CURRENT_SO_DETAIL && CURRENT_SO_DETAIL.soId === outcome.result.data.soId &&
      (_soDraftAutosaveTimer || _soDraftAutosaveInFlight);
    if (!editingThisSo) {
      _CACHE_STORE[cacheKey] = outcome.result;
    }

    if (!document.getElementById('pageContent') || CURRENT_PAGE !== 'soDetail' || editingThisSo) {
      return outcome;
    }

    const isFreshShell = !CURRENT_SO_DETAIL || CURRENT_SO_DETAIL.soId !== outcome.result.data.soId ||
      content.querySelector('.empty-state') || content.querySelector('.brand-spinner');
    CURRENT_SO_DETAIL = outcome.result.data;
    document.getElementById('pageTitle').textContent = 'Detail SO — ' + outcome.result.data.soId;
    try {
      if (isFreshShell) {
        renderSoDetailContent();
      } else {
        if (CURRENT_SO_TAB === 'selisih' && document.getElementById('soSelisihTableBody')) {
          renderSoSelisihRows();
        } else if (document.getElementById('soDetailTableBody')) {
          const isReadOnly = CURRENT_SO_DETAIL.status === 'Selesai' || CURRENT_SO_DETAIL.status === 'Menunggu Approval' || isReadOnlyRole();
          renderSoDetailRows(isReadOnly);
        } else if (CURRENT_SO_TAB === 'overview') {
          updateSoOverviewSummary();
        }
      }
      loadSoPrevSelisihBadgesLazy(soId);
    } catch (renderErr) {
      console.error('Gagal merender Detail SO (hasil telat) ' + soId + ':', renderErr);
    }
    return outcome;
  });

  let res;
  try {
    res = await getCached(cacheKey, async function() {
      const uiTimeout = new Promise(function(resolve) {
        setTimeout(function() { resolve({ ok: false, err: new Error('TIMEOUT_UI') }); }, 15000);
      });
      const outcome = await Promise.race([firstAttemptPromise, uiTimeout]);
      if (outcome.ok) return outcome.result;
      throw (outcome.err instanceof Error ? outcome.err : new Error((outcome.err && outcome.err.message) || 'Gagal memuat detail SO.'));
    }, !cached);
  } catch (err) {
    const isUiTimeout = err && err.message === 'TIMEOUT_UI';
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">' + (isUiTimeout ? 'Server sedang lambat merespons' : escapeHtml((err && err.message) ? err.message : 'Gagal memuat detail SO.')) + '</div><div class="empty-desc">Halaman ini akan otomatis terisi sendiri begitu responsnya sampai. Atau klik tombol di bawah untuk mencoba lagi sekarang.</div><button class="btn btn-primary" style="margin-top:12px" onclick="renderSoDetail(\'' + escapeHtml(soId) + '\')">Coba Lagi</button></div>';
    return;
  }
  if (!res) {
    const extraRes = await callServer('getSoDetail', soId, { silent: true, maxRetries: 4 });
    if (myOpenToken !== _SO_DETAIL_OPEN_TOKEN) return; 
    if (extraRes && extraRes.success) {
      _CACHE_STORE[cacheKey] = extraRes;
      CURRENT_SO_DETAIL = extraRes.data;
      document.getElementById('pageTitle').textContent = 'Detail SO — ' + extraRes.data.soId;
      try {
        renderSoDetailContent();
        loadSoPrevSelisihBadgesLazy(soId);
      } catch (renderErr) {
        console.error('Gagal merender Detail SO ' + soId + ':', renderErr);
        invalidateCache(cacheKey);
        content.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Gagal menampilkan Detail SO</div><div class="empty-desc">Terjadi kendala teknis saat menampilkan data SO ini. Silakan coba lagi.</div><button class="btn btn-primary" style="margin-top:12px" onclick="renderSoDetail(\'' + escapeHtml(soId) + '\')">Coba Lagi</button></div>';
      }
      return;
    }
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Gagal memuat detail SO</div><div class="empty-desc">Koneksi ke server sedang bermasalah. Silakan refresh/reload tab browser Anda (bukan tombol di dalam aplikasi), lalu buka kembali SO ini.</div><button class="btn btn-primary" style="margin-top:12px" onclick="renderSoDetail(\'' + escapeHtml(soId) + '\')">Coba Lagi</button></div>';
    return;
  }
  if (!res.success) {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">' + escapeHtml(res.message) + '</div></div>';
    return;
  }
  if (myOpenToken !== _SO_DETAIL_OPEN_TOKEN) return; 
  CURRENT_SO_DETAIL = res.data;
  document.getElementById('pageTitle').textContent = 'Detail SO — ' + res.data.soId;

  try {
    renderSoDetailContent();
    loadSoPrevSelisihBadgesLazy(soId);
  } catch (renderErr) {
    console.error('Gagal merender Detail SO ' + soId + ':', renderErr);
    invalidateCache(cacheKey); 
    content.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">' + ICONS.warning + '</div>' +
        '<div class="empty-title">Gagal menampilkan Detail SO</div>' +
        '<div class="empty-desc">Terjadi kendala teknis saat menampilkan data SO ini. Silakan coba lagi.</div>' +
        '<button class="btn btn-primary" style="margin-top:12px" onclick="renderSoDetail(\'' + escapeHtml(soId) + '\')">Coba Lagi</button>' +
      '</div>';
  }
}

async function loadSoPrevSelisihBadgesLazy(soId) {
  try {
    const res = await callServer('getSoPrevSelisihBadges', soId, { silent: true, maxRetries: 1 });
    if (!res || !res.success || !CURRENT_SO_DETAIL || CURRENT_SO_DETAIL.soId !== soId) return;
    const prevMap = res.data || {};
    CURRENT_SO_DETAIL.details.forEach(function(d) {
      const prev = prevMap[String(d.sku).trim()];
      d.prevSelisihQty = prev ? prev.selisihQty : null;
      d.prevSoId = prev ? prev.soId : null;
      d.prevTanggal = prev ? prev.tanggal : null;
    });
    if (CURRENT_SO_TAB === 'selisih' && document.getElementById('soSelisihTableBody')) {
      renderSoSelisihRows();
    } else if (document.getElementById('soDetailTableBody')) {
      const isReadOnly = CURRENT_SO_DETAIL.status === 'Selesai' || CURRENT_SO_DETAIL.status === 'Menunggu Approval' || isReadOnlyRole();
      renderSoDetailRows(isReadOnly);
    }
  } catch (e) {
  }
}

function filterSoDetailRows(query) {
  const tbody = document.getElementById('soDetailTableBody');
  if (!tbody) return;
  const q = String(query || '').trim().toLowerCase();
  const rows = tbody.querySelectorAll('tr[data-sku]');
  let visibleCount = 0;
  rows.forEach(function(row) {
    const sku = (row.getAttribute('data-sku') || '').toLowerCase();
    const nama = row.getAttribute('data-nama') || '';
    const match = !q || sku.indexOf(q) > -1 || nama.indexOf(q) > -1;
    row.classList.toggle('so-row-filtered-out', !match);
    if (match) visibleCount++;
  });
  const countEl = document.getElementById('soDetailItemSearchCount');
  if (countEl) countEl.textContent = q ? (visibleCount + ' / ' + rows.length + ' item') : '';

  let emptyRow = tbody.querySelector('tr.so-search-empty-row');
  if (q && visibleCount === 0) {
    if (!emptyRow) {
      emptyRow = document.createElement('tr');
      emptyRow.className = 'so-search-empty-row';
      const colCount = tbody.closest('table').querySelectorAll('thead th').length || 11;
      emptyRow.innerHTML = '<td colspan="' + colCount + '"><div class="empty-state"><div class="empty-icon">' + ICONS.search + '</div><div class="empty-title">Item tidak ditemukan</div><div class="empty-desc">Coba kata kunci lain, atau periksa ejaan SKU/nama item.</div></div></td>';
      tbody.appendChild(emptyRow);
    }
  } else if (emptyRow) {
    emptyRow.remove();
  }
}

let CURRENT_SO_TAB = 'overview';
let SO_RIWAYAT_LOADED_FOR = null;

function soTabBtnHtml(key, label, count) {
  const isActive = CURRENT_SO_TAB === key || (key === 'overview' && !CURRENT_SO_TAB);
  const badge = (typeof count === 'number') ? ' <span class="so-tab-badge" id="soTabBadge-' + key + '">' + formatNumber(count) + '</span>' : '';
  return '<button type="button" class="so-tab-btn' + (isActive ? ' active' : '') + '" data-tab="' + key + '">' + escapeHtml(label) + badge + '</button>';
}

function switchSoTab(tab) {
  if (!tab || tab === CURRENT_SO_TAB) return;
  CURRENT_SO_TAB = tab;

  document.querySelectorAll('#soTabsNav .so-tab-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
  });
  ['overview', 'selisih', 'allItems', 'riwayat'].forEach(function(key) {
    const panel = document.getElementById('soTabPanel-' + key);
    if (panel) panel.classList.toggle('hidden', key !== tab);
  });

  if (tab === 'selisih') renderSoSelisihRows();
  if (tab === 'riwayat') loadSoRiwayat();
}

function renderSoSelisihRows() {
  const tbody = document.getElementById('soSelisihTableBody');
  if (!tbody || !CURRENT_SO_DETAIL) return;
  const rows = CURRENT_SO_DETAIL.details.filter(function(d) { return Number(d.selisihQty) !== 0; });

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="11" class="td-empty-state"><div class="empty-state"><div class="empty-icon">' + ICONS.check + '</div><div class="empty-title">Tidak ada selisih</div><div class="empty-desc">Semua item yang sudah dihitung sesuai dengan stock sistem.</div></div></td></tr>';
    return;

  tbody.innerHTML = rows.map(function(d) {
    return '<tr>' +
      '<td><strong>' + escapeHtml(d.sku) + '</strong></td>' +
      '<td><span class="cell-clip" title="' + escapeHtml(d.nama) + '">' + escapeHtml(d.nama) + '</span></td>' +
      '<td class="text-right">' + formatRupiah(d.harga) + '</td>' +
      '<td class="text-right">' + formatNumber(d.stockSistem) + '</td>' +
      '<td class="text-right">' + formatNumber(d.fisikDepan) + '</td>' +
      '<td class="text-right">' + formatNumber(d.fisikGudang) + '</td>' +
      '<td class="text-right">' + formatNumber(d.totalFisik) + '</td>' +
      '<td class="text-right">' + selisihBadge(d.selisihQty) + '</td>' +
      '<td class="text-right">' + prevSelisihBadge(d) + '</td>' +
      '<td class="text-right">' + formatRupiah(d.selisihValue) + '</td>' +
      '<td>' + escapeHtml(d.catatan || '') + '</td>' +

async function loadSoRiwayat() {
  const container = document.getElementById('soRiwayatContainer');
  if (!container || !CURRENT_SO_DETAIL) return;
  const soId = CURRENT_SO_DETAIL.soId;
  if (SO_RIWAYAT_LOADED_FOR === soId) return;

  container.innerHTML = brandSpinnerHtml('Memuat riwayat...');
  const myToken = PAGE_NAV_TOKEN;
  try {
    const res = await callServer('getSoActivityLog', { soId: soId, currentUser: CURRENT_USER }, { silent: true });
    if (myToken !== PAGE_NAV_TOKEN || CURRENT_SO_TAB !== 'riwayat' || !CURRENT_SO_DETAIL || CURRENT_SO_DETAIL.soId !== soId || !document.getElementById('soRiwayatContainer')) return;

    if (!res.success) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Riwayat tidak tersedia</div><div class="empty-desc">' + escapeHtml(res.message || '') + '</div></div>';
      return;
    }
    SO_RIWAYAT_LOADED_FOR = soId;
    if (!res.data || !res.data.length) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.history + '</div><div class="empty-title">Belum ada riwayat aktivitas</div><div class="empty-desc">Aktivitas seperti pembuatan atau penyelesaian SO akan muncul di sini.</div></div>';
      return;
    }
    container.innerHTML = '<div class="so-history-list">' + res.data.map(function(h) {
      return '<div class="so-history-item">' +
        '<div class="so-history-dot"></div>' +
        '<div class="so-history-body">' +
          '<div class="so-history-top"><span class="so-history-aksi">' + escapeHtml(h.aksi) + '</span><span class="so-history-time">' + escapeHtml(h.timestamp) + '</span></div>' +
          (h.detail ? '<div class="so-history-detail">' + escapeHtml(h.detail) + '</div>' : '') +
          '<div class="so-history-user">oleh ' + escapeHtml(h.nama || h.username || '-') + '</div>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';

    if (CURRENT_SO_TAB !== 'riwayat') return;
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Gagal memuat riwayat</div></div>';

function summaryBox(label, value) {
  return '<div class="summary-box"><div class="s-label">' + label + '</div><div class="s-value">' + value + '</div></div>';

function computeSoProgress(so) {
  const details = (so && so.details) || [];
  const total = details.length;
  let done = 0, sesuai = 0, minus = 0, plus = 0;

  details.forEach(function(d) {
    const depanFilled = d.fisikDepan !== null && d.fisikDepan !== undefined && d.fisikDepan !== '';
    const gudangFilled = d.fisikGudang !== null && d.fisikGudang !== undefined && d.fisikGudang !== '';
    const isDone = depanFilled && gudangFilled;
    if (!isDone) return;
    done++;
    const selisih = Number(d.selisihQty) || 0;
    if (selisih === 0) sesuai++;
    else if (selisih < 0) minus++;
    else plus++;
  });

  const pct = total === 0 ? 0 : Math.round((done / total) * 1000) / 10;
  return { total: total, done: done, pending: total - done, sesuai: sesuai, minus: minus, plus: plus, pct: pct };
}

function soSkuCategoryPrefix(sku) {
  const s = String(sku || '').trim().toUpperCase();
  const m = s.match(/^[A-Z]+/);
  return m ? m[0] : (s.slice(0, 3) || 'LAINNYA');
}
function soCompareSku(a, b) {
  const sa = String(a || '').trim().toUpperCase();
  const sb = String(b || '').trim().toUpperCase();
  const ma = sa.match(/^([A-Z]*)(\d*)(.*)$/);
  const mb = sb.match(/^([A-Z]*)(\d*)(.*)$/);
  const prefixA = ma ? ma[1] : sa;
  const prefixB = mb ? mb[1] : sb;
  if (prefixA !== prefixB) return prefixA.localeCompare(prefixB);
  const numA = ma && ma[2] ? parseInt(ma[2], 10) : NaN;
  const numB = mb && mb[2] ? parseInt(mb[2], 10) : NaN;
  if (!isNaN(numA) && !isNaN(numB) && numA !== numB) return numA - numB;
  return sa.localeCompare(sb);
}

function buildSoExportSpec(so) {
  const groups = {};
  so.details.forEach(function(d) {
    const cat = d.kategori || 'Tanpa Kategori';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(d);
  });
  const catNames = Object.keys(groups).sort(function(a, b) {
    if (a === 'Tanpa Kategori') return 1;
    if (b === 'Tanpa Kategori') return -1;
    return a.localeCompare(b);
  });
  catNames.forEach(function(cat) { groups[cat].sort(function(a, b) { return soCompareSku(a.sku, b.sku); }); });

  const rows = [];
  let grandSelisihQty = 0, grandSelisihValue = 0, grandValueSistem = 0, grandValueFisik = 0;

  catNames.forEach(function(cat) {
    const items = groups[cat];
    let catSelisihQty = 0, catSelisihValue = 0, catValueSistem = 0, catValueFisik = 0;

    items.forEach(function(d) {
      const valueSistem = d.stockSistem * d.harga;
      const valueFisik = d.totalFisik * d.harga;
      rows.push({
        _rowType: d.selisihQty < 0 ? 'minus' : 'normal',
        sku: d.sku, nama: d.nama, harga: d.harga,
        sistem: d.stockSistem, fisikDepan: d.fisikDepan, fisikGudang: d.fisikGudang, total: d.totalFisik,
        selisihQty: d.selisihQty, selisihValue: d.selisihValue,
        valueSistem: valueSistem, valueFisik: valueFisik,
        catatan: d.catatan || ''
      });
      catSelisihQty += d.selisihQty;
      catSelisihValue += d.selisihValue;
      catValueSistem += valueSistem;
      catValueFisik += valueFisik;
    });

    rows.push({
      _rowType: 'subtotal',
      sku: '', nama: 'Subtotal ' + cat, harga: '', sistem: '', fisikDepan: '', fisikGudang: '', total: '',
      selisihQty: catSelisihQty, selisihValue: catSelisihValue,
      valueSistem: catValueSistem, valueFisik: catValueFisik, catatan: ''
    });

    grandSelisihQty += catSelisihQty;
    grandSelisihValue += catSelisihValue;
    grandValueSistem += catValueSistem;
    grandValueFisik += catValueFisik;
  });

  rows.push({
    _rowType: 'grandtotal',
    sku: '', nama: 'TOTAL KESELURUHAN', harga: '', sistem: '', fisikDepan: '', fisikGudang: '', total: '',
    selisihQty: grandSelisihQty, selisihValue: grandSelisihValue,

  const isBulananSo = so.tipeSo === 'Bulanan';

  const badgeColorSo = isBulananSo ? '8E44AD' : '2E86C1';

  const approvalInfoSo = so.approvalNote ?
    (function() {
      const isRejectInfo = so.status === 'Draft';
      return (isRejectInfo ? 'Rejected by' : 'Approved by') + ': ' + (so.approvedBy || '-') +
        (so.approvedAt ? '  |  ' + (isRejectInfo ? 'Rejected at' : 'Approved at') + ': ' + formatTimestampDisplay(so.approvedAt) : '') +
        '  |  ' + (isRejectInfo ? 'Reject Note' : 'Approval Note') + ': ' + so.approvalNote;
    })()
    : '';

  return {
    filenameBase: (isBulananSo ? 'SO_BULANAN_' : 'SO_MINGGUAN_') + so.soId,
    title: 'Stock Opname: ' + so.soId,
    subtitle: 'Store: ' + so.store + '  |  Tanggal: ' + formatDateDisplay(so.tanggal) + '  |  Status: ' + so.status,
    approvalInfo: approvalInfoSo,
    badgeText: badgeTextSo,
    badgeColor: badgeColorSo,
    sheetName: 'SO ' + so.soId,
    numberCols: ['harga', 'sistem', 'fisikDepan', 'fisikGudang', 'total', 'selisihQty', 'selisihValue', 'valueSistem', 'valueFisik'],
    displayFormatCols: { harga: 'rupiah', selisihValue: 'rupiah', valueSistem: 'rupiah', valueFisik: 'rupiah' },
    rowTypeKey: '_rowType', 
    columns: [
      { key: 'sku', label: 'Item Code' },
      { key: 'nama', label: 'Item Name' },
      { key: 'harga', label: 'Harga', align: 'right' },
      { key: 'sistem', label: 'Sistem', align: 'right' },
      { key: 'fisikDepan', label: 'Fisik Depan', align: 'right' },
      { key: 'fisikGudang', label: 'Fisik Gudang', align: 'right' },
      { key: 'total', label: 'Fisik Total', align: 'right' },
      { key: 'selisihQty', label: 'Selisih Qty', align: 'right' },
      { key: 'selisihValue', label: 'Selisih Value', align: 'right' },

}

const SO_FORM_CATEGORY_ORDER_ = ['AGRI', 'RASALOKAL', 'NON-AGRINESIA'];
function soFormCategorySortRank_(cat) {
  if (cat === 'Tanpa Kategori') return 1000;
