async function exportSoFormExcel(soId) {
  const cacheKey = 'soDetail:' + soId;
  const cached = peekCached(cacheKey);
  let so = cached && cached.success ? cached.data : null;
  if (!so) {
    const res = await getCached(cacheKey, function() {
      return callServer('getSoDetail', soId, { silent: true, maxRetries: 4 });
    });
    if (!res.success) { showToast(res.message, 'error'); return; }
    so = res.data;
  }
  const spec = buildSoFormExportSpec(so);
  const cols = spec.columns;
  const numberColSet = {};
  spec.numberCols.forEach(function(k) { numberColSet[k] = true; });

  const COLOR_HEADER_BG = 'C6D9B0';
  const COLOR_SUBTOTAL_BG = 'F4C99B';
  const COLOR_GRANDTOTAL_BG = '4472C4';
  const COLOR_SELISIH_MINUS_BG = 'FF0000';
  const BORDER_THIN = { style: 'thin', color: { rgb: 'B7B7B7' } };
  const THIN_BORDER = { top: BORDER_THIN, bottom: BORDER_THIN, left: BORDER_THIN, right: BORDER_THIN };

  const aoa = [[spec.title], [spec.subtitle], []];
  const headerRowIndex = aoa.length;
  aoa.push(cols.map(function(c) { return c.label; }));
  spec.rows.forEach(function(row) { aoa.push(cols.map(function(c) { return row[c.key]; })); });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = [];

  ws['A1'].s = { font: { bold: true, sz: 13 }, alignment: { horizontal: 'center', vertical: 'center' } };
  ws['A2'].s = { font: { bold: true, sz: 11 }, alignment: { horizontal: 'center', vertical: 'center' } };
  ws['!merges'].push({ s: { r: 0, c: 0 }, e: { r: 0, c: cols.length - 1 } });
  ws['!merges'].push({ s: { r: 1, c: 0 }, e: { r: 1, c: cols.length - 1 } });

  cols.forEach(function(c, ci) {
    const addr = XLSX.utils.encode_cell({ r: headerRowIndex, c: ci });
    ws[addr].s = {
      font: { bold: true },
      fill: { fgColor: { rgb: COLOR_HEADER_BG } },
      alignment: { horizontal: c.align || (numberColSet[c.key] ? 'right' : 'left'), wrapText: true },
      border: THIN_BORDER
    };
  });

  const LABEL_MERGE_START = 1, LABEL_MERGE_END = 5;

  // Kolom-kolom yang dibutuhkan untuk membangun RUMUS EXCEL Selisih Qty & Selisih Rp
  // (bukan angka statis lagi), supaya kalau Qty Fisik diubah manual di Excel,
  // Selisih Qty & Selisih Rp ikut ter-update otomatis.
  const idxQtySistem = cols.findIndex(function(c) { return c.key === 'qtySistem'; });
  const idxQtyFisikDepan = cols.findIndex(function(c) { return c.key === 'qtyFisikDepan'; });
  const idxQtyFisikGudang = cols.findIndex(function(c) { return c.key === 'qtyFisikGudang'; });
  const idxQtyFisik = cols.findIndex(function(c) { return c.key === 'qtyFisik'; });
  const idxHarga = cols.findIndex(function(c) { return c.key === 'harga'; });
  const idxSelisihQty = cols.findIndex(function(c) { return c.key === 'selisihQty'; });
  const idxSelisihRp = cols.findIndex(function(c) { return c.key === 'selisihRp'; });
  const colQtySistem = XLSX.utils.encode_col(idxQtySistem);
  const colQtyFisikDepan = XLSX.utils.encode_col(idxQtyFisikDepan);
  const colQtyFisikGudang = XLSX.utils.encode_col(idxQtyFisikGudang);
  const colQtyFisik = XLSX.utils.encode_col(idxQtyFisik);
  const colHarga = XLSX.utils.encode_col(idxHarga);
  const colSelisihQty = XLSX.utils.encode_col(idxSelisihQty);
  const colSelisihRp = XLSX.utils.encode_col(idxSelisihRp);
  const FORMAT_RP = '"Rp"* #,##0;"Rp"* -#,##0;"Rp"* -';

  // Range baris data (per kategori, EXCLUDING baris subtotal) dipakai untuk
  // rumus SUM di baris subtotal, dan dikumpulkan lagi untuk rumus SUM di
  // baris grand total (supaya tidak double-count baris subtotal).
  let catStartRow = null;
  let catEndRow = null;
  const allCatRanges = [];

  spec.rows.forEach(function(row, ri) {
    const excelRowIndex = headerRowIndex + 1 + ri;
    const excelRowNum = excelRowIndex + 1; // 1-indexed, dipakai di alamat rumus (mis. L5)
    const rowType = row._rowType;
    const isSubtotal = rowType === 'subtotal';
    const isGrandtotal = rowType === 'grandtotal';
    const isDataRow = !isSubtotal && !isGrandtotal;

    if (isDataRow) {
      if (catStartRow === null) catStartRow = excelRowNum;
      catEndRow = excelRowNum;
    } else if (isSubtotal) {
      if (catStartRow !== null) allCatRanges.push([catStartRow, catEndRow]);
      catStartRow = null;
      catEndRow = null;
    }

    if (isSubtotal || isGrandtotal) {
      ws['!merges'].push({ s: { r: excelRowIndex, c: LABEL_MERGE_START }, e: { r: excelRowIndex, c: LABEL_MERGE_END } });
    }

    cols.forEach(function(c, ci) {
      const addr = XLSX.utils.encode_cell({ r: excelRowIndex, c: ci });
      const v = row[c.key];
      const isNumCol = !!numberColSet[c.key];
      const align = c.align || (isNumCol ? 'right' : 'left');
      let cellStyle = { alignment: { horizontal: align }, border: THIN_BORDER };

      if (ci === idxQtyFisik) {
        // Total Qty Fisik = Qty Fisik Depan + Qty Fisik Gudang
        if (isDataRow) {
          ws[addr] = { t: 'n', f: colQtyFisikDepan + excelRowNum + '+' + colQtyFisikGudang + excelRowNum, v: (typeof v === 'number' ? v : 0) };
        } else if (isSubtotal) {
          const r = allCatRanges[allCatRanges.length - 1];
          ws[addr] = { t: 'n', f: 'SUM(' + colQtyFisik + r[0] + ':' + colQtyFisik + r[1] + ')', v: (typeof v === 'number' ? v : 0) };
        } else if (isGrandtotal) {
          const ranges = allCatRanges.map(function(r) { return colQtyFisik + r[0] + ':' + colQtyFisik + r[1]; }).join(',');
          ws[addr] = { t: 'n', f: 'SUM(' + ranges + ')', v: (typeof v === 'number' ? v : 0) };
        }
        cellStyle.numFmt = '#,##0';
      } else if (ci === idxSelisihQty) {
        // Selisih Qty = Total Qty Fisik - Qty Sistem
        if (isDataRow) {
          ws[addr] = { t: 'n', f: colQtyFisik + excelRowNum + '-' + colQtySistem + excelRowNum, v: (typeof v === 'number' ? v : 0) };
        } else if (isSubtotal) {
          const r = allCatRanges[allCatRanges.length - 1];
          ws[addr] = { t: 'n', f: 'SUM(' + colSelisihQty + r[0] + ':' + colSelisihQty + r[1] + ')', v: (typeof v === 'number' ? v : 0) };
        } else if (isGrandtotal) {
          const ranges = allCatRanges.map(function(r) { return colSelisihQty + r[0] + ':' + colSelisihQty + r[1]; }).join(',');
          ws[addr] = { t: 'n', f: 'SUM(' + ranges + ')', v: (typeof v === 'number' ? v : 0) };
        }
        cellStyle.numFmt = '#,##0';
      } else if (ci === idxSelisihRp) {
        // Selisih Rp = Selisih Qty x Harga (untuk baris data); subtotal/grand
        // total menjumlahkan Selisih Rp per baris di rentangnya masing-masing.
        if (isDataRow) {
          ws[addr] = { t: 'n', f: colSelisihQty + excelRowNum + '*' + colHarga + excelRowNum, v: (typeof v === 'number' ? v : 0) };
        } else if (isSubtotal) {
          const r = allCatRanges[allCatRanges.length - 1];
          ws[addr] = { t: 'n', f: 'SUM(' + colSelisihRp + r[0] + ':' + colSelisihRp + r[1] + ')', v: (typeof v === 'number' ? v : 0) };
        } else if (isGrandtotal) {
          const ranges = allCatRanges.map(function(r) { return colSelisihRp + r[0] + ':' + colSelisihRp + r[1]; }).join(',');
          ws[addr] = { t: 'n', f: 'SUM(' + ranges + ')', v: (typeof v === 'number' ? v : 0) };
        }
        cellStyle.numFmt = FORMAT_RP;
      } else if (isNumCol) {
        const n = typeof v === 'number' ? v : parseFloat(v);
        if (v === '' || v === null || v === undefined) {
          if (!ws[addr]) ws[addr] = { t: 's', v: '' };
        } else if (!isNaN(n)) {
          ws[addr] = { t: 'n', v: n };
          cellStyle.numFmt = '#,##0';
        }
      }
      const isNeg = typeof ws[addr] !== 'undefined' && ws[addr].t === 'n' && ws[addr].v < 0;
      const isSelisihCol = !isSubtotal && !isGrandtotal && (c.key === 'selisihQty' || c.key === 'selisihRp');

      if (isGrandtotal) {
        cellStyle.fill = { fgColor: { rgb: COLOR_GRANDTOTAL_BG } };
        cellStyle.font = { bold: true, color: { rgb: 'FFFFFF' } };
      } else if (isSubtotal) {
        cellStyle.fill = { fgColor: { rgb: COLOR_SUBTOTAL_BG } };
        cellStyle.font = { bold: true };
      } else if (isSelisihCol && isNeg) {
        cellStyle.fill = { fgColor: { rgb: COLOR_SELISIH_MINUS_BG } };
        cellStyle.font = { bold: true, color: { rgb: 'FFFFFF' } };
      } else if (isNeg) {
        cellStyle.font = { color: { rgb: 'DC2626' } };
      }

      if (!ws[addr]) ws[addr] = { t: 's', v: '' };
      ws[addr].s = cellStyle;
    });
  });

  let footerRowIndex = headerRowIndex + 1 + spec.rows.length;
  spec.footerLines.forEach(function(line) {
    const addr = XLSX.utils.encode_cell({ r: footerRowIndex, c: 0 });
    ws[addr] = { t: 's', v: line };
    if (line) ws[addr].s = { font: { bold: line === 'Dilakukan oleh,' || line === 'Leader' } };
    footerRowIndex++;
  });

  const lastRow = footerRowIndex - 1;
  const lastCol = cols.length - 1;
  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: lastRow, c: lastCol } });
  ws['!freeze'] = { xSplit: 0, ySplit: headerRowIndex + 1 };
  ws['!cols'] = cols.map(function(c, ci) {
    const isNum = !!numberColSet[c.key];
    let maxLen = 0;
    spec.rows.forEach(function(row) {
      const v = row[c.key];
      if (v === null || v === undefined || v === '') return;
      const display = isNum && typeof v === 'number' ? formatNumber(v) : String(v);
      if (display.length > maxLen) maxLen = display.length;
    });

    if (ci === 1) {
      let dataOnlyMax = 0;
      spec.rows.forEach(function(row) {
        if (row._rowType === 'subtotal' || row._rowType === 'grandtotal') return;
        const v = row[c.key];
        const len = v === null || v === undefined ? 0 : String(v).length;
        if (len > dataOnlyMax) dataOnlyMax = len;
      });
      maxLen = dataOnlyMax;
    }

    const headerLen = String(c.label).length;
    const padding = isNum ? 2 : 2;
    let wch = Math.max(maxLen + padding, headerLen + 2);
    if (c.key !== 'namaItem') {
      wch = Math.min(wch, 40);
    } else {
      wch = maxLen + 2; 
    }
    return { wch: wch };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, spec.sheetName.substring(0, 31));
  XLSX.writeFile(wb, spec.filenameBase + '_' + exportTimestamp() + '.xlsx');
  showToast('Export Form SO berhasil.', 'success');
}

function prevSelisihBadge(d) {
  if (d.prevSelisihQty === null || d.prevSelisihQty === undefined) {
    return '<span class="prev-selisih-badge prev-selisih-none" title="Belum ada SO sebelumnya yang selesai untuk item ini">—</span>';
  }
  const val = d.prevSelisihQty;
  const cls = val < 0 ? 'prev-selisih-minus' : (val > 0 ? 'prev-selisih-plus' : 'prev-selisih-zero');
  const sign = val > 0 ? '+' : '';
  if (!d.prevSoId) {
    return '<span class="prev-selisih-badge ' + cls + '">' + sign + formatNumber(val) + '</span>';
  }
  const title = 'Dari ' + d.prevSoId + (d.prevTanggal ? ' · ' + formatDateDisplay(d.prevTanggal) : '') + ' — klik untuk preview';
  return '<span class="prev-selisih-badge prev-selisih-clickable ' + cls + '" title="' + escapeHtml(title) + '" onclick="event.stopPropagation();openPrevSoPreview(\'' + escapeHtml(d.prevSoId) + '\',\'' + escapeHtml(d.sku) + '\')">' + sign + formatNumber(val) + '</span>';
}

async function openPrevSoPreview(prevSoId, sku) {
  openModal(
    modalHeaderHtml({ icon: ICONS.eye, color: 'blue', title: 'Preview Item — SO Sebelumnya', subtitle: sku }) +
    '<div class="modal-body" id="prevSoPreviewBody">' + brandSpinnerHtml('Memuat...') + '</div>'
  );

  const cacheKey = 'soDetail:' + prevSoId;
  const res = await getCached(cacheKey, function() {
    return callServer('getSoDetail', prevSoId, { silent: true, maxRetries: 4 });
  });

  const body = document.getElementById('prevSoPreviewBody');
  if (!body) return; 

  if (!res.success) {
    body.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">' + escapeHtml(res.message) + '</div></div>';
    return;
  }

  const so = res.data;
  const d = so.details.find(function(x) { return x.sku === sku; });
  if (!d) {
    body.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Item tidak ditemukan di SO ini</div></div>';
    return;
  }

  body.innerHTML =
    '<div class="prev-preview-header">' +
      '<div><div class="prev-preview-soid">' + escapeHtml(so.soId) + '</div><div class="prev-preview-meta">' + escapeHtml(so.store) + ' · ' + formatDateDisplay(so.tanggal) + '</div></div>' +
      statusBadge(so.status, so.status === 'Draft' && String(so.approvalNote || '').trim() !== '') +
    '</div>' +
    '<div class="prev-preview-item">' +
      '<div class="prev-preview-sku">' + escapeHtml(d.sku) + '</div>' +
      '<div class="prev-preview-nama">' + escapeHtml(d.nama) + '</div>' +
    '</div>' +
    '<div class="prev-preview-grid">' +
      prevPreviewStat('Stock Sistem', formatNumber(d.stockSistem)) +
      prevPreviewStat('Fisik Depan', formatNumber(d.fisikDepan)) +
      prevPreviewStat('Fisik Gudang', formatNumber(d.fisikGudang)) +
      prevPreviewStat('Total Fisik', formatNumber(d.totalFisik)) +
      prevPreviewStat('Selisih Qty', (d.selisihQty > 0 ? '+' : '') + formatNumber(d.selisihQty), d.selisihQty < 0 ? 'stat-red' : 'stat-green') +
      prevPreviewStat('Selisih Value', formatRupiah(d.selisihValue), d.selisihValue < 0 ? 'stat-red' : '') +
    '</div>' +
    (d.catatan ?
      '<div class="prev-preview-catatan"><label>Catatan</label><div>' + escapeHtml(d.catatan) + '</div></div>' : '') +
    '<div class="modal-footer prev-preview-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Tutup</button>' +
      '<button class="btn btn-primary" onclick="closeModal();navigateTo(\'soDetail\',{soId:\'' + escapeHtml(so.soId) + '\'})">' + ICONS.eye + ' Buka SO Lengkap</button>' +
    '</div>';
}

function prevPreviewStat(label, value, cls) {
  return '<div class="prev-preview-stat' + (cls ? ' ' + cls : '') + '"><div class="prev-preview-stat-label">' + label + '</div><div class="prev-preview-stat-value">' + value + '</div></div>';
}

const SO_DETAIL_PAGINATION = createPaginationState(50);

function renderSoDetailRows(isReadOnly) {
  const tbody = document.getElementById('soDetailTableBody');
  if (!tbody) return;
  const so = CURRENT_SO_DETAIL;

  if (!so.details.length) {
    tbody.innerHTML = '<tr><td colspan="11" class="td-empty-state"><div class="empty-state"><div class="empty-icon">' + ICONS.box + '</div><div class="empty-title">Belum ada item di SO ini</div><div class="empty-desc">Import Stock Sistem atau Tambah Item untuk memulai.</div></div></td></tr>';
    if (isReadOnly) clearPaginationBarById('soDetailPaginationBar', 'soDetailPageSizeBar');
    return;
  }

  const rowsToRender = isReadOnly ? paginateSlice(so.details, SO_DETAIL_PAGINATION) : so.details;

  tbody.innerHTML = rowsToRender.map(function(d, idx) {
    const depanUnfilled = d.fisikDepan === null || d.fisikDepan === undefined;
    const gudangUnfilled = d.fisikGudang === null || d.fisikGudang === undefined;
    const fisikDepanCell = isReadOnly
      ? formatNumber(d.fisikDepan)
      : '<span class="fisik-input-wrap"><input type="number" class="fisik-input fisik-depan' + (depanUnfilled ? ' fisik-unfilled' : '') + '" value="' + (depanUnfilled ? '' : d.fisikDepan) + '" placeholder="0" min="0"></span>';
    const fisikGudangCell = isReadOnly
      ? formatNumber(d.fisikGudang)
      : '<span class="fisik-input-wrap"><input type="number" class="fisik-input fisik-gudang' + (gudangUnfilled ? ' fisik-unfilled' : '') + '" value="' + (gudangUnfilled ? '' : d.fisikGudang) + '" placeholder="0" min="0"></span>';
    const catatanCell = isReadOnly
      ? escapeHtml(d.catatan)
      : '<input type="text" class="catatan-input" value="' + escapeHtml(d.catatan) + '">';
    const totalFisikDisplay = (depanUnfilled && gudangUnfilled) ? '<span style="color:var(--gray-400);">—</span>' : formatNumber(d.totalFisik);

    return '<tr data-sku="' + escapeHtml(d.sku) + '" data-nama="' + escapeHtml((d.nama || '').toLowerCase()) + '">' +
      '<td data-label="SKU"><strong>' + escapeHtml(d.sku) + '</strong></td>' +
      '<td data-label="Nama Item"><span class="cell-clip" title="' + escapeHtml(d.nama) + '">' + escapeHtml(d.nama) + '</span></td>' +
      '<td data-label="Harga" class="text-right">' + formatRupiah(d.harga) + '</td>' +
      '<td data-label="Sistem" class="text-right">' + formatNumber(d.stockSistem) + '</td>' +
      '<td data-label="Depan" class="text-right">' + fisikDepanCell + '</td>' +
      '<td data-label="Gudang" class="text-right">' + fisikGudangCell + '</td>' +
      '<td data-label="Total" class="text-right total-fisik-cell">' + totalFisikDisplay + '</td>' +
      '<td data-label="Selisih" class="text-right selisih-cell">' + ((depanUnfilled && gudangUnfilled) ? '<span class="badge badge-gray">—</span>' : selisihBadge(d.selisihQty)) + '</td>' +
      '<td data-label="SO Sebelumnya" class="text-right">' + prevSelisihBadge(d) + '</td>' +
      '<td data-label="Value" class="text-right value-cell">' + ((depanUnfilled && gudangUnfilled) ? '—' : formatRupiah(d.selisihValue)) + '</td>' +
      '<td data-label="Catatan">' + catatanCell + '</td>' +
    '</tr>';
  }).join('');

  if (isReadOnly) {
    renderPaginationBar(document.getElementById('soDetailPaginationBar'), so.details.length, SO_DETAIL_PAGINATION, 'item', function() {
      renderSoDetailRows(isReadOnly);
    }, document.getElementById('soDetailPageSizeBar'));
    return;
  }

  const itemSearchElAfterRender = document.getElementById('soDetailItemSearch');
  if (itemSearchElAfterRender && itemSearchElAfterRender.value) filterSoDetailRows(itemSearchElAfterRender.value);

  tbody.querySelectorAll('.fisik-depan, .fisik-gudang').forEach(function(input) {
    input.addEventListener('input', function() {
      const row = input.closest('tr');
      recalcRow(row);
      scheduleSoDraftAutosave();
    });
    input.addEventListener('blur', function() {
    });
    input.addEventListener('keydown', function(e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) === -1) return;

      const row = input.closest('tr');
      const isDepan = input.classList.contains('fisik-depan');
      const colClass = isDepan ? 'fisik-depan' : 'fisik-gudang';
      let targetRow = row;

      if (e.key === 'ArrowUp') {
        targetRow = row.previousElementSibling;
      } else if (e.key === 'ArrowDown') {
        targetRow = row.nextElementSibling;
      } else if (e.key === 'ArrowLeft') {
        if (isDepan) return; 
        const target = row.querySelector('.fisik-depan');
        if (target) { e.preventDefault(); target.focus(); target.select(); }
        return;
      } else if (e.key === 'ArrowRight') {
        if (!isDepan) return; 
        const target = row.querySelector('.fisik-gudang');
        if (target) { e.preventDefault(); target.focus(); target.select(); }
        return;
      }

      if (targetRow) {
        const target = targetRow.querySelector('.' + colClass);
        if (target) { e.preventDefault(); target.focus(); target.select(); }
      }
    });
  });

  tbody.querySelectorAll('.catatan-input').forEach(function(input) {
    input.addEventListener('input', scheduleSoDraftAutosave);
  });
}

function recalcRow(row) {
  const sku = row.getAttribute('data-sku');
  const detail = CURRENT_SO_DETAIL.details.find(function(d) { return d.sku === sku; });
  if (!detail) return;

  const depanInput = row.querySelector('.fisik-depan');
  const gudangInput = row.querySelector('.fisik-gudang');
  const depanEmpty = depanInput.value === '';
  const gudangEmpty = gudangInput.value === '';
  depanInput.classList.toggle('fisik-unfilled', depanEmpty);
  gudangInput.classList.toggle('fisik-unfilled', gudangEmpty);

  const fisikDepan = depanEmpty ? null : (Number(depanInput.value) || 0);
  const fisikGudang = gudangEmpty ? null : (Number(gudangInput.value) || 0);
  const bothFilled = !depanEmpty && !gudangEmpty;
  const totalFisik = bothFilled ? (fisikDepan + fisikGudang) : null;
  const selisih = bothFilled ? (totalFisik - detail.stockSistem) : 0;
  const selisihValue = bothFilled ? (selisih * detail.harga) : 0;

  row.querySelector('.total-fisik-cell').innerHTML = bothFilled ? formatNumber(totalFisik) : '<span style="color:var(--gray-400);">—</span>';
  row.querySelector('.selisih-cell').innerHTML = bothFilled ? selisihBadge(selisih) : '<span class="badge badge-gray">—</span>';
  row.querySelector('.value-cell').textContent = bothFilled ? formatRupiah(selisihValue) : '—';

  detail.fisikDepan = fisikDepan;
  detail.fisikGudang = fisikGudang;
  detail.totalFisik = totalFisik;
  detail.selisihQty = selisih;
  detail.selisihValue = selisihValue;
  updateSoProgressCard();

  const selisihBadgeEl = document.getElementById('soTabBadge-selisih');
  if (selisihBadgeEl) {
    const selisihCount = CURRENT_SO_DETAIL.details.filter(function(x) { return Number(x.selisihQty) !== 0; }).length;
    selisihBadgeEl.textContent = formatNumber(selisihCount);
  }
  if (CURRENT_SO_TAB === 'selisih') renderSoSelisihRows();
  if (CURRENT_SO_TAB === 'overview') updateSoOverviewSummary();
}

function updateSoOverviewSummary() {
  const panel = document.getElementById('soTabPanel-overview');
  if (!panel || !CURRENT_SO_DETAIL) return;
  let totalSistem = 0, totalFisik = 0, totalSelisih = 0, totalSelisihValue = 0;
  CURRENT_SO_DETAIL.details.forEach(function(d) {
    totalSistem += Number(d.stockSistem) || 0;
    totalFisik += Number(d.totalFisik) || 0;
    totalSelisih += Number(d.selisihQty) || 0;
    totalSelisihValue += Number(d.selisihValue) || 0;
  });
  const boxes = panel.querySelectorAll('.summary-bar .s-value');
  if (boxes.length >= 5) {
    boxes[0].textContent = formatNumber(CURRENT_SO_DETAIL.details.length);
    boxes[1].textContent = formatNumber(totalSistem);
    boxes[2].textContent = formatNumber(totalFisik);
    boxes[3].textContent = formatNumber(totalSelisih);
    boxes[4].textContent = formatRupiah(totalSelisihValue);
  }
}

let _soDraftAutosaveTimer = null;
let _soDraftAutosaveInFlight = false;
let _soDraftAutosavePending = false;
let _soDraftAutosaveSeq = Date.now();
function scheduleSoDraftAutosave() {
  if (!CURRENT_SO_DETAIL || CURRENT_SO_DETAIL.status !== 'Draft') return;
  const statusEl = document.getElementById('soDraftAutosaveStatus');
  if (statusEl) statusEl.textContent = 'Menyimpan draft...';
  if (_soDraftAutosaveTimer) clearTimeout(_soDraftAutosaveTimer);
  _soDraftAutosaveTimer = setTimeout(runSoDraftAutosave, 1200);
}

async function runSoDraftAutosave() {
  _soDraftAutosaveTimer = null;

  if (_soDraftAutosaveInFlight) {
    _soDraftAutosavePending = true;
    return;
  }

  const tbody = document.getElementById('soDetailTableBody');
  const statusEl = document.getElementById('soDraftAutosaveStatus');
  if (!tbody || !CURRENT_SO_DETAIL || CURRENT_SO_DETAIL.status !== 'Draft') return;

  const rows = tbody.querySelectorAll('tr[data-sku]');
  if (!rows.length) return;

  const items = [];
  rows.forEach(function(row) {
    items.push({
      sku: row.getAttribute('data-sku'),
      fisikDepan: row.querySelector('.fisik-depan') ? row.querySelector('.fisik-depan').value : 0,
      fisikGudang: row.querySelector('.fisik-gudang') ? row.querySelector('.fisik-gudang').value : 0,
      catatan: row.querySelector('.catatan-input') ? row.querySelector('.catatan-input').value : ''
    });
  });

  const catatanUmumEl = document.getElementById('soCatatanUmum');
  _soDraftAutosaveSeq = Math.max(Date.now(), _soDraftAutosaveSeq + 1);
  const payload = { soId: CURRENT_SO_DETAIL.soId, items: items, currentUser: CURRENT_USER, seq: _soDraftAutosaveSeq };
  if (catatanUmumEl) payload.catatanUmum = catatanUmumEl.value;

  _soDraftAutosaveInFlight = true;
  try {
    const res = await callServer('saveSoDraft', payload, { silent: true });
    if (!CURRENT_SO_DETAIL || CURRENT_SO_DETAIL.soId !== payload.soId) return;
    if (res.success && !res.stale) {
      items.forEach(function(item) {
        const d = CURRENT_SO_DETAIL.details.find(function(x) { return x.sku === item.sku; });
        if (!d) return;
        const depanEmpty = item.fisikDepan === '';
        const gudangEmpty = item.fisikGudang === '';
        d.fisikDepan = depanEmpty ? null : (Number(item.fisikDepan) || 0);
        d.fisikGudang = gudangEmpty ? null : (Number(item.fisikGudang) || 0);
        d.totalFisik = (depanEmpty || gudangEmpty) ? null : (d.fisikDepan + d.fisikGudang);
        d.selisihQty = (depanEmpty || gudangEmpty) ? 0 : (d.totalFisik - d.stockSistem);
        d.selisihValue = d.selisihQty * d.harga;
        d.catatan = item.catatan;
      });
      if (catatanUmumEl) CURRENT_SO_DETAIL.catatanUmum = catatanUmumEl.value;
      const soDetailCacheKey = 'soDetail:' + CURRENT_SO_DETAIL.soId;
      const cachedDetail = _CACHE_STORE[soDetailCacheKey];
      if (cachedDetail && cachedDetail.success && cachedDetail.data) {
        cachedDetail.data = CURRENT_SO_DETAIL;
      }
      invalidateCache(null, { tipeSo: CURRENT_SO_DETAIL.tipeSo });
      if (statusEl) statusEl.textContent = 'Draft auto-saved';
    } else if (statusEl) {
      statusEl.textContent = '';
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = '';
  } finally {
    _soDraftAutosaveInFlight = false;
    if (_soDraftAutosavePending) {
      _soDraftAutosavePending = false;
      runSoDraftAutosave();
    }
  }
}

async function saveSoFisikData() {
  const tbody = document.getElementById('soDetailTableBody');
  const rows = tbody.querySelectorAll('tr[data-sku]');
  if (!rows.length) { showToast('Tidak ada item untuk disimpan.', 'error'); return; }

  const allUnfilledRows = findAllUnfilledSoRows(rows);
  if (allUnfilledRows.length) {
    showUnfilledSoItemPopup(allUnfilledRows[0], allUnfilledRows);
    return;
  }

  const items = [];
  rows.forEach(function(row) {
    items.push({
      sku: row.getAttribute('data-sku'),
      fisikDepan: row.querySelector('.fisik-depan').value,
      fisikGudang: row.querySelector('.fisik-gudang').value,
      catatan: row.querySelector('.catatan-input').value
    });
  });

  const isRevisiSetelahReject = CURRENT_SO_DETAIL &&
    String(CURRENT_SO_DETAIL.status) === 'Draft' &&
    String(CURRENT_SO_DETAIL.approvalNote || '').trim() !== '';

  const modalConfig = isRevisiSetelahReject ? {
    type: 'success',
    title: 'Selesaikan Revisi SO?',
    desc: 'Data fisik akan tersimpan sebagai revisi final — tidak perlu approval ulang dari approver.',
    detailRows: [
      { label: 'Status setelah ini', value: 'Selesai (terkunci)' }
    ],
    confirmLabel: 'Ya, Selesaikan',
    confirmClass: 'btn-primary'
  } : {
    type: 'warning',
    title: 'Ajukan untuk Approval?',
    desc: 'Data fisik akan tersimpan dan diajukan untuk direview.',
    detailRows: [
      { label: 'Status setelah ini', value: 'Pending Approval' },
      { label: 'Bisa diedit lagi?', value: 'Tidak, sampai direspon approver' }
    ],
    confirmLabel: 'Ya, Ajukan',
    confirmClass: 'btn-primary'
  };

  iconModal({
    type: modalConfig.type,
    title: modalConfig.title,
    desc: modalConfig.desc,
    detailRows: modalConfig.detailRows,
    confirmLabel: modalConfig.confirmLabel,
    confirmClass: modalConfig.confirmClass,
    onConfirm: async function() {
      const catatanUmumEl = document.getElementById('soCatatanUmum');
      const payload = { soId: CURRENT_SO_DETAIL.soId, items: items, currentUser: CURRENT_USER };
      if (catatanUmumEl) payload.catatanUmum = catatanUmumEl.value;

      const res = await callServer('saveSoFisik', payload, { loadingText: 'Menyimpan data fisik...' });
      if (res.success) {
        showToast(res.message, 'success');
        invalidateCache(null, { tipeSo: CURRENT_SO_DETAIL.tipeSo });
        refreshNotifBadge();
        SO_NAV_STACK.length = 0;
        goToRiwayat('stockOpname');
      } else {
        showToast(res.message, 'error');
        if (res.belumDiisi && res.belumDiisi.length) {
          const badRows = res.belumDiisi
            .map(function(sku) { return tbody.querySelector('tr[data-sku="' + cssEscapeAttr(sku) + '"]'); })
            .filter(Boolean);
          if (badRows.length) showUnfilledSoItemPopup(badRows[0], badRows);
        }
      }
    }
  });
}

function openImportStockModal() {
  openModal(
    modalHeaderHtml({ icon: ICONS.upload, color: 'purple', title: 'Import Stock Sistem', subtitle: 'Upload data stock sistem dari file' }) +
    '<div class="modal-body">' +
      '<div class="upload-box" id="importStockDropzone">' +
        '<div class="upload-icon">' + ICONS.upload + '</div>' +
        '<div class="upload-text">Klik untuk pilih file</div>' +
        '<div class="upload-hint">Format: CSV, TSV, atau Excel (.xlsx/.xls) dengan kolom SKU, Stock</div>' +
        '<input type="file" id="importStockFile" accept=".csv,.tsv,.txt,.xlsx,.xls" style="display:none">' +
      '</div>' +
      '<div id="importStockFileName" style="margin-top:10px;font-size:12.5px;color:var(--gray-700);"></div>' +
      '<div class="import-warning">SKU yang tidak terdaftar di Item Master akan ditampilkan sebagai peringatan dan tidak akan menyebabkan proses gagal. Item baru dengan Stock Sistem 0 tidak akan ditambahkan ke SO ini.</div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>' +
      '<button class="btn btn-primary" id="processImportStockBtn" disabled>' + ICONS.upload + ' Import</button>' +
    '</div>'
  );

  let parsedRows = null;
  const dropzone = document.getElementById('importStockDropzone');
  const fileInput = document.getElementById('importStockFile');
  dropzone.addEventListener('click', function() { fileInput.click(); });

  fileInput.addEventListener('change', async function() {
    const file = fileInput.files[0];
    if (!file) return;
    document.getElementById('importStockFileName').textContent = file.name;
    try {
      const parsed = await parseImportFile(file);
      if (!parsed.headers.length) {
        showToast('File kosong atau format tidak sesuai.', 'error');
        return;
      }
      const headersLower = parsed.headers.map(function(h) { return h.toLowerCase(); });
      const idxSku = findColumnIndex(headersLower, ['nomor sku', 'sku', 'kode sku']);
      const idxStock = findColumnIndex(headersLower, ['stock', 'stok', 'unit dalam persediaan', 'persediaan']);

      if (idxSku === -1 || idxStock === -1) {
        showToast('Kolom SKU / Stock tidak ditemukan di file.', 'error');
        return;
      }

      parsedRows = parsed.rows.map(function(row) {
        return { sku: row[idxSku] || '', stock: (row[idxStock] || '0').replace(/[^0-9.\-]/g, '') };
      }).filter(function(r) { return r.sku; });

      document.getElementById('processImportStockBtn').disabled = parsedRows.length === 0;
      if (!parsedRows.length) showToast('Tidak ada baris valid ditemukan pada file.', 'error');
    } catch (err) {
      showToast('Gagal membaca file: ' + err.message, 'error');
    }
  });

  document.getElementById('processImportStockBtn').addEventListener('click', async function() {
    if (!parsedRows || !parsedRows.length) return;

    const btn = this;
    btn.disabled = true;

    // Berapapun jumlah baris di file (900, 5000, dst) ditangani otomatis
    // oleh runChunkedImport dengan progress bar 0-100% asli — lihat definisi
    // runChunkedImport di atas untuk detail kenapa ini sekarang jauh lebih
    // andal dibanding skema batch lama.
    const result = await runChunkedImport(
      'importStockToSo',
      parsedRows,
      function(chunk) { return { soId: CURRENT_SO_DETAIL.soId, rows: chunk, currentUser: CURRENT_USER }; },
      function(total, chunkStats) {
        return {
          matched: (total.matched || 0) + (chunkStats.matched || 0),
          notFound: (total.notFound || 0) + (chunkStats.notFound || 0),
          skippedZeroStock: (total.skippedZeroStock || 0) + (chunkStats.skippedZeroStock || 0)
        };
      },
      'Mengimport stock sistem...'
    );

    btn.disabled = false;

    if (!result.success) {
      showToast(result.message, 'error');
      return;
    }

    const hasNotFound = (result.stats.notFound || 0) > 0;
    showStatsToast(
      'Import stock sistem selesai',
      [
        { label: 'Cocok', value: result.stats.matched || 0 },
        { label: 'Tidak terdaftar', value: result.stats.notFound || 0, warn: hasNotFound },
        { label: 'Dilewati (stock 0)', value: result.stats.skippedZeroStock || null }
      ],
      hasNotFound ? 'error' : 'success'
    );
    invalidateCache(null, { tipeSo: CURRENT_SO_DETAIL.tipeSo });
    closeModal();
    renderSoDetail(CURRENT_SO_DETAIL.soId);
  });
}

function ensureScanBridgeListener() {
  if (_scanBridgeListenerAttached) return;
  _scanBridgeListenerAttached = true;
  window.addEventListener('message', function(event) {
    var data = event && event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'so_scan_result') {
      handleScannedBarcode(String(data.barcode || ''));
    } else if (data.type === 'so_scan_error') {
      sendMessageToScanBridge(data.message || 'Kamera tidak bisa diakses.', 'error');
      showToast(data.message || 'Kamera tidak bisa diakses.', 'error');
    } else if (data.type === 'so_scan_cancel') {
    }
  });
}

function sendMessageToScanBridge(message, kind) {
  if (_scanBridgeWindow && !_scanBridgeWindow.closed) {
    try {
      _scanBridgeWindow.postMessage({ type: 'so_scan_show_message', message: message, kind: kind }, '*');
      return;
    } catch (e) {  }
  }
  showToast(message, kind || 'error');
}

function handleScanCameraError(err) {
  const name = err && err.name;
  let msg;
  if (name === 'NotAllowedError') {
    msg = 'Akses kamera ditolak. Buka Pengaturan HP → Aplikasi → Chrome (atau browser yang dipakai) → Izin → Kamera → pastikan Diizinkan, lalu buka lagi aplikasi ini dari ikon di layar utama.';
  } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
    msg = 'Kamera belakang tidak ditemukan di perangkat ini.';
  } else if (name === 'NotReadableError') {
    msg = 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera/video call lain, lalu coba lagi.';
  } else {
    msg = 'Tidak bisa mengakses kamera: ' + (err && err.message ? err.message : err) + '.';
  }
  sendMessageToScanBridge(msg, 'error');
  showToast(msg, 'error');
}

var _barcodeToItemIndex = null;
function getBarcodeToItemIndex() {
  if (_barcodeToItemIndex && _barcodeToItemIndex.__len === ITEM_MASTER_CACHE.length) return _barcodeToItemIndex;
  const idx = { __len: ITEM_MASTER_CACHE.length };
  ITEM_MASTER_CACHE.forEach(function(it) {
    const bc = String(it.barcode || '').trim();
    if (bc) idx[bc] = it;
  });
  _barcodeToItemIndex = idx;
  return idx;
}

async function handleScannedBarcode(decodedText) {
  if (_scanBarcodeBusy) return;
  if (!CURRENT_SO_DETAIL) return;
  _scanBarcodeBusy = true;

  const barcode = String(decodedText || '').trim();
  try {
    const localMatch = getBarcodeToItemIndex()[barcode];
    let resData;
    if (localMatch) {
      resData = { sku: localMatch.sku, nama: localMatch.nama };
    } else {
      const res = await callServer('resolveScannedBarcode', { barcode: barcode }, { silent: true });
      if (!res.success) {
        sendMessageToScanBridge(res.message, 'error');
        return;
      }
      resData = res.data;
    }

    const sku = resData.sku;
    const existingRow = CURRENT_SO_DETAIL.details.find(function(d) { return String(d.sku) === String(sku); });

    if (existingRow) {
      const hasDepan = existingRow.fisikDepan !== null && existingRow.fisikDepan !== undefined && existingRow.fisikDepan !== '';
      const hasGudang = existingRow.fisikGudang !== null && existingRow.fisikGudang !== undefined && existingRow.fisikGudang !== '';
      if (hasDepan || hasGudang) {
        closeScanBarcodeSoModal();
        showAccumulateStockCard(sku, resData.nama);
        return;
      }
      showToast('Ditemukan: ' + sku + ' — ' + resData.nama, 'success');
      jumpToSoDetailRow(sku);
      closeScanBarcodeSoModal();
      return;
    }

    const addRes = await callServer('addItemToSo', {
      soId: CURRENT_SO_DETAIL.soId,
      sku: sku,
      currentUser: CURRENT_USER
    }, { silent: true });

    if (!addRes.success) {
      sendMessageToScanBridge(addRes.message, 'error');
      return;
    }

    invalidateCache(null, { tipeSo: CURRENT_SO_DETAIL.tipeSo });
    closeScanBarcodeSoModal();
    showToast('Item "' + resData.nama + '" (' + sku + ') sebelumnya tidak ada di SO ini — sudah ditambahkan otomatis.', 'warning');
    await renderSoDetail(CURRENT_SO_DETAIL.soId);
    jumpToSoDetailRow(sku);
  } catch (err) {
    sendMessageToScanBridge('Gagal memproses barcode: ' + err.message, 'error');
  } finally {
    setTimeout(function() { _scanBarcodeBusy = false; }, 1200);
  }
}

function jumpToSoDetailRow(sku) {
  switchSoTab('allItems');
  const searchEl = document.getElementById('soDetailItemSearch');
  if (searchEl && searchEl.value) {
    searchEl.value = '';
    filterSoDetailRows('');
  }
  function doJump() {
    const row = document.querySelector('#soDetailTableBody tr[data-sku="' + CSS.escape(sku) + '"]');
    if (!row) return;

    void row.offsetHeight; 

    row.scrollIntoView({ behavior: 'instant', block: 'center' });

    requestAnimationFrame(function () {
      const toastEl = document.querySelector('.toast-container .toast');
      const clearanceTop = toastEl ? (toastEl.getBoundingClientRect().bottom + 16) : 0;

      const viewportH = window.innerHeight || document.documentElement.clientHeight;
      let clearanceBottom = 16; 
      [document.getElementById('bottomNav'), document.getElementById('btnScanBarcodeSo')].forEach(function (el) {
        if (!el) return;
        const r = el.getBoundingClientRect();
        if (r.height === 0) return; 
        const fromBottom = viewportH - r.top + 16;
        if (fromBottom > clearanceBottom) clearanceBottom = fromBottom;
      });

      const rect = row.getBoundingClientRect();
      const availableH = viewportH - clearanceTop - clearanceBottom;
      let targetTop;
      if (rect.height >= availableH) {
        targetTop = clearanceTop;
      } else {
        targetTop = clearanceTop + (availableH - rect.height) / 2;
      }
      const delta = rect.top - targetTop;
      if (Math.abs(delta) > 1) {
        window.scrollBy({ top: delta, behavior: 'smooth' });
      }
    });

    flashRowSuccess(row);
    const fisikDepanInput = row.querySelector('.fisik-depan');
    if (fisikDepanInput) {
      fisikDepanInput.focus();
      fisikDepanInput.select();
    }
  }
  const rowNow = document.querySelector('#soDetailTableBody tr[data-sku="' + CSS.escape(sku) + '"]');
  if (rowNow) {
    doJump();
  } else {
    setTimeout(doJump, 120);
  }
}

  card.innerHTML =

    '</button>' +
    '<div class="acc-stock-sheet-handle"></div>' +
    '<div class="acc-stock-body">' +
      '<div class="acc-stock-recap">' +
        '<div class="acc-stock-header">' +
          '<div class="acc-stock-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>' +

        '</div>' +

      '<div class="acc-stock-inputs">' +

          '<span>Depan</span>' +
          '<input type="number" inputmode="numeric" id="accStockDepanInput" placeholder="0" min="0">' +
        '</label>' +

      '<button type="button" class="btn btn-primary btn-block" id="accStockAddBtn">Tambah ke Total</button>' +
    '</div>';

  // PENTING: sheet mobile ini di-parent langsung ke <body>, BUKAN ke
  // #toastContainer. #toastContainer didesain sempit nempel pojok
  // kanan-atas (position:fixed; right:20px; max-width: calc(100vw-40px)) —
  // begitu isinya jadi sheet lebar penuh layar, bagian yang "keluar" dari
  // kotak asli container itu (persis di sisi kanan, tempat kolom Gudang
  // berada) kena masalah hit-testing khas iframe sandbox Apps Script
  // (pola yang sama seperti bug menu titik-tiga sebelumnya). Backdrop-nya
  // sendiri memang sudah di body sejak awal; sheet-nya disamakan.
  const isMobileSheet = window.matchMedia('(max-width: 900px)').matches;
  if (isMobileSheet) {
    document.body.appendChild(card);
  } else {
    document.getElementById('toastContainer').appendChild(card);

  const depanInput = card.querySelector('#accStockDepanInput');
  const gudangInput = card.querySelector('#accStockGudangInput');

  let userTouchedInput = false;
  function markUserTouchedInput() { userTouchedInput = true; }
  depanInput.addEventListener('pointerdown', markUserTouchedInput);
  gudangInput.addEventListener('pointerdown', markUserTouchedInput);

  if (isMobileSheet) {
    switchSoTab('allItems');
    const searchEl = document.getElementById('soDetailItemSearch');
    if (searchEl && searchEl.value) {
      searchEl.value = '';
      filterSoDetailRows('');
    }

    const scrollRowAboveSheet = function() {
      const targetRow = document.querySelector('#soDetailTableBody tr[data-sku="' + CSS.escape(sku) + '"]');
      if (!targetRow) {
        focusDepanIfUntouched();
        return;
      }

      // Sama persis dengan jumpToSoDetailRow (flow scan item baru, yang
      // sudah terbukti jalan): paksa scrollIntoView dulu supaya kartu
      // pasti kebawa ke area layar, baru posisinya di-presisi-kan di
      // frame berikutnya. Bedanya di sini clearance bawah ditambah
      // setinggi sheet "Tambah Stock", supaya kartu gak kepotong sheet.
      void targetRow.offsetHeight;
      targetRow.scrollIntoView({ behavior: 'instant', block: 'center' });

      requestAnimationFrame(function() {
        const clearanceTop = 64; // topbar + judul halaman
        const sheetH = card.offsetHeight || 0;
        const clearanceBottom = sheetH + 28; // ekstra jarak biar kartu gak mepet/kepotong sheet

        const viewportH = window.innerHeight || document.documentElement.clientHeight;
        const rect = targetRow.getBoundingClientRect();
        const availableH = viewportH - clearanceTop - clearanceBottom;
        let targetTop;
        if (rect.height >= availableH) {
          targetTop = clearanceTop;
        } else {
          targetTop = clearanceTop + (availableH - rect.height) / 2;
        }
        const delta = rect.top - targetTop;

        flashRowSuccess(targetRow);
        if (Math.abs(delta) > 1) {
          window.scrollBy({ top: delta, behavior: 'smooth' });
          setTimeout(focusDepanIfUntouched, 320);
        } else {
          focusDepanIfUntouched();
        }
      });
    };

    const rowNow = document.querySelector('#soDetailTableBody tr[data-sku="' + CSS.escape(sku) + '"]');
    if (rowNow) {
      scrollRowAboveSheet();
    } else {
      setTimeout(scrollRowAboveSheet, 120);
    }
  } else {
    depanInput.focus();
  }

  // Live preview: begitu user mengetik, langsung kelihatan hasil
  // penjumlahannya SEBELUM diklik Tambah — supaya angka bisa dicek dulu,
  // bukan baru ketahuan salah setelah tersimpan.
  function updatePreview() {
    const addDepan = Number(depanInput.value) || 0;
    const addGudang = Number(gudangInput.value) || 0;
    if (addDepan <= 0 && addGudang <= 0) {
      previewRow.hidden = true;
      return;
    }
    previewRow.hidden = false;
    previewValue.textContent = 'Depan ' + formatNumber(curDepan + addDepan) + ' · Gudang ' + formatNumber(curGudang + addGudang);
  }
  depanInput.addEventListener('input', updatePreview);
  gudangInput.addEventListener('input', updatePreview);

  function dismiss() {
    card.classList.add('hiding');
    backdrop.classList.add('hiding');
    setTimeout(function() { card.remove(); backdrop.remove(); }, 220);
  }
  card.querySelector('#accStockCloseBtn').addEventListener('click', dismiss);
  backdrop.addEventListener('click', dismiss);

  card.querySelector('#accStockAddBtn').addEventListener('click', function() {
    const addDepan = Number(depanInput.value) || 0;
    const addGudang = Number(gudangInput.value) || 0;
    if (addDepan <= 0 && addGudang <= 0) {
      showToast('Isi angka Depan atau Gudang dulu sebelum ditambahkan.', 'warning');
      return;
    }
    applyAccumulateStock(sku, addDepan, addGudang);
    dismiss();
    showToast('Ditambahkan ke ' + sku + ': Depan +' + formatNumber(addDepan) + ', Gudang +' + formatNumber(addGudang), 'success');
  });

  [depanInput, gudangInput].forEach(function(inp) {
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); card.querySelector('#accStockAddBtn').click(); }
    });
  });
}

function applyAccumulateStock(sku, addDepan, addGudang) {
  const detail = CURRENT_SO_DETAIL.details.find(function(d) { return String(d.sku) === String(sku); });
  if (!detail) return;

  const curDepan = (detail.fisikDepan === null || detail.fisikDepan === undefined || detail.fisikDepan === '') ? 0 : Number(detail.fisikDepan);
  const curGudang = (detail.fisikGudang === null || detail.fisikGudang === undefined || detail.fisikGudang === '') ? 0 : Number(detail.fisikGudang);

  detail.fisikDepan = curDepan + addDepan;
  detail.fisikGudang = curGudang + addGudang;
  const stockSistem = Number(detail.stockSistem) || 0;
  detail.totalFisik = (Number(detail.fisikDepan) || 0) + (Number(detail.fisikGudang) || 0);
  detail.selisihQty = detail.totalFisik - stockSistem;
  detail.selisihValue = detail.selisihQty * (Number(detail.harga) || 0);

  const row = document.querySelector('#soDetailTableBody tr[data-sku="' + CSS.escape(sku) + '"]');
  if (row) {
    const depanInput = row.querySelector('.fisik-depan');
    const gudangInput = row.querySelector('.fisik-gudang');
    if (depanInput) depanInput.value = detail.fisikDepan;
    if (gudangInput) gudangInput.value = detail.fisikGudang;
    recalcRow(row);
  }

  scheduleSoDraftAutosave();
}

  ], null);
  document.querySelectorAll('#addSoItemExistingSection input, #addSoItemExistingSection select, #addSoItemBaruSection input').forEach(function(el) {

  });
  updateSaveBtnState();

  wireKategoriSelectNewOption('addSoItemBaruKategori');

    if (!btn || btn.disabled) return;
    currentMode = btn.dataset.mode;
    toggle.querySelectorAll('.mini-toggle-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('addSoItemExistingSection').classList.toggle('hidden', currentMode !== 'existing');
    document.getElementById('addSoItemBaruSection').classList.toggle('hidden', currentMode !== 'baru');
    updateSaveBtnState();
  });

  document.getElementById('saveAddSoItemBtn').addEventListener('click', async function() {
    if (currentMode === 'existing') {
      if (!availableItems.length) { showToast('Tidak ada item Item Master yang bisa ditambahkan.', 'error'); return; }
      if (!existingValidation.validateAll()) return;
      const params = {
        soId: CURRENT_SO_DETAIL.soId,
        sku: document.getElementById('addSoItemSku').value,
        stockSistem: document.getElementById('addSoItemExisting_Stock').value,
        fisikDepan: document.getElementById('addSoItemExisting_FisikDepan').value,

        currentUser: CURRENT_USER
      };
      const res = await callServer('addItemToSo', params, { loadingText: 'Menambahkan item...' });
      if (res.success) {
        showToast(res.message, 'success');
        invalidateCache(null, { tipeSo: CURRENT_SO_DETAIL.tipeSo });

    } else {
      if (!baruValidation.validateAll()) return;
      const sku = document.getElementById('addSoItemBaruSku').value.trim();
      const nama = document.getElementById('addSoItemBaruNama').value.trim();
      const harga = document.getElementById('addSoItemBaruHarga').value;
      const kategoriVal = document.getElementById('addSoItemBaruKategori').value;
      if (kategoriVal === NEW_CATEGORY_OPTION_VALUE_) { showToast('Pilih atau buat kategori terlebih dahulu.', 'error'); return; }

      const masterRes = await callServer('addItemMaster', {
        sku: sku, nama: nama, harga: harga, status: 'Aktif', kategori: kategoriVal, currentUser: CURRENT_USER
      }, { loadingText: 'Menambahkan item ke Item Master...' });
      if (!masterRes.success) { showToast(masterRes.message, 'error'); return; }
      invalidateCache('itemMaster');

      const soRes = await callServer('addItemToSo', {
        soId: CURRENT_SO_DETAIL.soId,
        sku: sku,
        stockSistem: document.getElementById('addSoItemBaru_Stock').value,
        fisikDepan: document.getElementById('addSoItemBaru_FisikDepan').value,
        fisikGudang: document.getElementById('addSoItemBaru_FisikGudang').value,
        catatan: document.getElementById('addSoItemBaru_Catatan').value,
        currentUser: CURRENT_USER
      }, { loadingText: 'Menambahkan item ke SO...' });
      if (soRes.success) {
        showToast('Item baru dibuat & ditambahkan ke SO.', 'success');
        invalidateCache(null, { tipeSo: CURRENT_SO_DETAIL.tipeSo });
        closeModal();
        await renderSoDetail(CURRENT_SO_DETAIL.soId);
        flashRowSuccess(document.querySelector('#soDetailTableBody tr[data-sku="' + CSS.escape(sku) + '"]'));
      } else {
        showToast('Item tersimpan di Item Master, tapi gagal ditambahkan ke SO: ' + soRes.message, 'error');
      }
    }
  });
}

    totalSelisihValue: function(v) { return 'Total selisih value <strong>' + formatRupiah(v) + '</strong>'; },
    itemPlus: function(v) { return '<strong>' + formatNumber(v) + ' item</strong> dengan selisih plus (stock fisik lebih dari sistem)'; },
    itemMinus: function(v) { return '<strong>' + formatNumber(v) + ' item</strong> dengan selisih minus (stock fisik kurang dari sistem)'; },
    soCount: function(v) { return '<strong>' + formatNumber(v) + ' SO</strong>'; }
  };
  if (params.ddType && ddLabels[params.ddType]) {
    descParts.push(ddLabels[params.ddType](params.ddValue) + ' (dari Dashboard, SO berstatus Selesai)');
  }

  if (params.presetStore) descParts.push('Store <strong>' + escapeHtml(params.presetStore) + '</strong>');
  if (params.presetDateStart && params.presetDateEnd) descParts.push('periode <strong>' + formatDateDisplay(params.presetDateStart) + ' – ' + formatDateDisplay(params.presetDateEnd) + '</strong>');
  if (!params.ddType && params.presetSelisihType === 'plus') descParts.push('yang punya <strong>selisih plus</strong> (stock fisik lebih dari sistem)');
  if (!params.ddType && params.presetSelisihType === 'minus') descParts.push('yang punya <strong>selisih minus</strong> (stock fisik kurang dari sistem)');
  if (params.presetSort === 'selisih' && !params.ddType) descParts.push('diurutkan dari <strong>selisih terbesar</strong>');

  if (!descParts.length) { el.innerHTML = ''; return; }
  el.innerHTML =
    '<div class="drilldown-banner">' +
      '<div class="drilldown-banner-icon">' + ICONS.target + '</div>' +
      '<div class="drilldown-banner-text">Menampilkan Stock Opname ' + descParts.join(', ') + '.</div>' +
      '<button class="drilldown-banner-clear" onclick="navigateTo(\'riwayat\')">' + ICONS.close + ' Hapus Filter</button>' +
    '</div>';
}

function renderRiwayatTableRows(data) {
  const tbody = document.getElementById('riwTableBody');
  const tfoot = document.getElementById('riwTableFoot');
  if (!tbody) return;
  const colCount = 10;
  if (!data.length) {
    const hasActiveFilter = ['riwSearchInput', 'riwStoreFilter', 'riwTanggalMulai', 'riwTanggalAkhir', 'riwSelisihFilter']
      .some(function(id) { const el = document.getElementById(id); return el && el.value; });

async function loadRiwayatTable(silentForce) {
  const searchEl = document.getElementById('riwSearchInput');
  const tglMulaiEl = document.getElementById('riwTanggalMulai');
  const tglAkhirEl = document.getElementById('riwTanggalAkhir');
  const selisihEl = document.getElementById('riwSelisihFilter');
  const statusEl = document.getElementById('riwStatusFilter');
  const sortEl = document.getElementById('riwSortFilter');
  if (!searchEl || !tglMulaiEl || !tglAkhirEl || !selisihEl || !statusEl || !sortEl) return;

  const myToken = PAGE_NAV_TOKEN;
  if (!silentForce) RIWAYAT_PAGINATION.page = 1;
  const params = { currentUser: CURRENT_USER, statusFilter: 'selesai', tipeSo: TIPE_SO_STATE.riwayat };
  if (RIWAYAT_DD) params.onlySelesai = true;
  params.search = searchEl.value;
  if (needsStorePicker() && document.getElementById('riwStoreFilter')) {
    params.store = document.getElementById('riwStoreFilter').value;
  }
  params.tanggalMulai = tglMulaiEl.value;
  params.tanggalAkhir = tglAkhirEl.value;
  params.selisihType = selisihEl.value;
  params.approvalStatus = statusEl.value;
  params.sortBy = sortEl.value;

  const cacheKey = 'soList:' + JSON.stringify(params);

  let skeletonTimer = null;
  if (!silentForce) {
    const cachedRes = peekCached(cacheKey);
    if (cachedRes && cachedRes.success) {
      RIWAYAT_CACHE = cachedRes.data;
      renderRiwayatTableRows(cachedRes.data);
    } else {
      skeletonTimer = setTimeout(function() {
        if (myToken !== PAGE_NAV_TOKEN) return;
        const tbody = document.getElementById('riwTableBody');
        const tfoot = document.getElementById('riwTableFoot');
        if (tbody) tbody.innerHTML = skeletonRiwayatCardsHtml(4);
        if (tfoot) tfoot.innerHTML = '';
      }, 150);
    }
  }

  prefetchOppositeTipeSo('riwayat', 'soList', 'getSoListForStore', function(tipe) {
    const p = { currentUser: CURRENT_USER, statusFilter: 'selesai', tipeSo: tipe };
    if (RIWAYAT_DD) p.onlySelesai = true;
    p.search = searchEl.value;
    if (needsStorePicker() && document.getElementById('riwStoreFilter')) {
      p.store = document.getElementById('riwStoreFilter').value;
    }
    p.tanggalMulai = tglMulaiEl.value;
    p.tanggalAkhir = tglAkhirEl.value;
    p.selisihType = selisihEl.value;
    p.approvalStatus = statusEl.value;
    p.sortBy = sortEl.value;
    return p;
  });

  let res = await getCached(cacheKey, function() {
    return callServer('getSoListForStore', params, { silent: true });
  }, silentForce);
  clearTimeout(skeletonTimer);
  if (!res.success && !silentForce) {
    if (myToken !== PAGE_NAV_TOKEN || !document.getElementById('riwTableBody')) return;
    res = await getCached(cacheKey, function() {
      return callServer('getSoListForStore', params, { silent: true });
    }, true);
  }
  if (myToken !== PAGE_NAV_TOKEN || !document.getElementById('riwTableBody')) return;
  if (!res.success) { if (!silentForce) showToast(res.message, 'error'); return; }

  RIWAYAT_CACHE = res.data;
  renderRiwayatTableRows(res.data);
}

function renderRiwayatFooter(rows) {
  const tfoot = document.getElementById('riwTableFoot');
  if (!tfoot) return;
  if (!rows.length) { tfoot.innerHTML = ''; return; }

  const sum = { totalItem: 0, totalStockSistem: 0, totalStockFisik: 0, totalSelisihQty: 0, totalSelisihValue: 0, itemPlusCount: 0, itemMinusCount: 0, soCount: rows.length };
  rows.forEach(function(so) {
    sum.totalItem += Number(so.totalItem) || 0;
    sum.totalStockSistem += Number(so.totalStockSistem) || 0;
    sum.totalStockFisik += Number(so.totalStockFisik) || 0;
    sum.totalSelisihQty += Number(so.totalSelisihQty) || 0;
    sum.totalSelisihValue += Number(so.totalSelisihValue) || 0;
    sum.itemPlusCount += Number(so.itemPlusCount) || 0;
    sum.itemMinusCount += Number(so.itemMinusCount) || 0;
  });

  const ddFieldMap = { totalItem: 'totalItem', stockSistem: 'totalStockSistem', stockFisik: 'totalStockFisik', totalSelisih: 'totalSelisihQty', totalSelisihValue: 'totalSelisihValue', itemPlus: 'itemPlusCount', itemMinus: 'itemMinusCount', soCount: 'soCount' };
  const relevantField = RIWAYAT_DD ? ddFieldMap[RIWAYAT_DD.ddType] : null;
  const matches = relevantField ? (sum[relevantField] === Number(RIWAYAT_DD.ddValue)) : true;

  const rincianField = (relevantField === 'itemPlusCount' || relevantField === 'itemMinusCount') ? relevantField : null;
  const rincianCls = 'text-center' + (rincianField ? (matches ? ' riw-total-match' : ' riw-total-mismatch') : '');
  const rincianCell = '<td class="' + rincianCls + '">' +
    (sum.itemPlusCount ? '<span class="mini-count-badge pos">+' + sum.itemPlusCount + '</span>' : '') +
    (sum.itemMinusCount ? '<span class="mini-count-badge neg">−' + sum.itemMinusCount + '</span>' : '') +
    (rincianField ? '<span class="riw-total-check" title="' + (matches ? 'Cocok dengan angka di Dashboard' : 'Tidak cocok dengan Dashboard — cek filter aktif') + '">' + (matches ? ICONS.check : ICONS.close) + '</span>' : '') +
    '</td>';

  const soCountLabelCell = '<td colspan="2"><strong>Total (' + rows.length + ' SO)</strong>' +
    (relevantField === 'soCount' ? '<span class="riw-total-check" title="' + (matches ? 'Cocok dengan angka di Dashboard' : 'Tidak cocok dengan Dashboard — cek filter aktif') + '">' + (matches ? ICONS.check : ICONS.close) + '</span>' : '') +
    '</td>';

  const sistemCls = 'text-right' + (relevantField === 'totalStockSistem' ? (matches ? ' riw-total-match' : ' riw-total-mismatch') : '');
  const sistemCell = '<td class="' + sistemCls + '">' + formatNumber(sum.totalStockSistem) +
    (relevantField === 'totalStockSistem' ? '<span class="riw-total-check" title="' + (matches ? 'Cocok dengan angka di Dashboard' : 'Tidak cocok dengan Dashboard — cek filter aktif') + '">' + (matches ? ICONS.check : ICONS.close) + '</span>' : '') +
    '</td>';
  const fisikCls = 'text-right' + (relevantField === 'totalStockFisik' ? (matches ? ' riw-total-match' : ' riw-total-mismatch') : '');
  const fisikCell = '<td class="' + fisikCls + '"><strong>' + formatNumber(sum.totalStockFisik) + '</strong>' +
    (relevantField === 'totalStockFisik' ? '<span class="riw-total-check" title="' + (matches ? 'Cocok dengan angka di Dashboard' : 'Tidak cocok dengan Dashboard — cek filter aktif') + '">' + (matches ? ICONS.check : ICONS.close) + '</span>' : '') +
    '</td>';

  const selqCls = 'text-right' + (relevantField === 'totalSelisihQty' ? (matches ? ' riw-total-match' : ' riw-total-mismatch') : '');
  const selqCell = '<td class="' + selqCls + '"><strong>' + formatNumber(sum.totalSelisihQty) + '</strong>' +
    (relevantField === 'totalSelisihQty' ? '<span class="riw-total-check" title="' + (matches ? 'Cocok dengan angka di Dashboard' : 'Tidak cocok dengan Dashboard — cek filter aktif') + '">' + (matches ? ICONS.check : ICONS.close) + '</span>' : '') +
    '</td>';
  const selvCls = 'text-right' + (relevantField === 'totalSelisihValue' ? (matches ? ' riw-total-match' : ' riw-total-mismatch') : '');
  const selvCell = '<td class="' + selvCls + '">' + formatRupiah(sum.totalSelisihValue) +
    (relevantField === 'totalSelisihValue' ? '<span class="riw-total-check" title="' + (matches ? 'Cocok dengan angka di Dashboard' : 'Tidak cocok dengan Dashboard — cek filter aktif') + '">' + (matches ? ICONS.check : ICONS.close) + '</span>' : '') +
    '</td>';

  tfoot.innerHTML =
    '<tr class="riwayat-total-row">' +
      soCountLabelCell +
      sistemCell +
      fisikCell +
      rincianCell +
      selqCell +
      selvCell +
      '<td colspan="3"></td>' +
    '</tr>' +
    (relevantField ?
      '<tr class="riwayat-total-note">' +
        '<td colspan="10">' +
          '<div class="riw-verify-note ' + (matches ? 'ok' : 'warn') + '">' +
            (matches ? ICONS.check : ICONS.alert) +
            '<span>' + (matches ? 'Total di atas cocok dengan angka yang Anda klik di Dashboard.' : 'Total di atas <strong>tidak cocok</strong> dengan angka di Dashboard — kemungkinan ada filter tambahan yang aktif, coba klik "Hapus Filter".') + '</span>' +
          '</div>' +
        '</td>' +
      '</tr>' : '');
}

function confirmDeleteSo(soId, refreshTarget) {
  if (!isAdmin()) return; 
  const sourceList = refreshTarget === 'riwayat' ? RIWAYAT_CACHE : SO_ACTIVE_LIST_CACHE;
  const so = (sourceList || []).find(function(r) { return String(r.soId) === String(soId); }) || { soId: soId, store: '-', tanggal: '', totalItem: 0 };
  iconModal({
    type: 'danger',
    title: 'Hapus Stock Opname?',
    detailRows: [
      { label: 'SO ID', value: so.soId },
      { label: 'Store', value: so.store },
      { label: 'Tanggal', value: formatDateDisplay(so.tanggal) },
      { label: 'Detail item akan dihapus', value: formatNumber(so.totalItem) + ' item', warn: true }
    ],
    desc: 'Data di atas akan dihapus permanen beserta seluruh detail itemnya. Tindakan ini tidak bisa dibatalkan.',
    confirmLabel: 'Ya, Hapus',
    confirmClass: 'btn-danger',
    onConfirm: async function() {
      const res = await callServer('deleteStockOpname', { currentUser: CURRENT_USER, soId: so.soId }, { loadingText: 'Menghapus SO...' });
      if (res.success) {
        showToast(res.message, 'success');
        invalidateCache(); 
        if (refreshTarget === 'riwayat') { loadRiwayatTable(); } else { loadSoTable(); }
      } else {
        showToast(res.message, 'error');
      }
    }
  });
}

async function exportSoExcel(soId) {
  const cacheKey = 'soDetail:' + soId;
  const cached = peekCached(cacheKey);
  let so = cached && cached.success ? cached.data : null;
  if (!so) {
    const res = await getCached(cacheKey, function() {
      return callServer('getSoDetail', soId, { silent: true, maxRetries: 4 });
    });
    if (!res.success) { showToast(res.message, 'error'); return; }
    so = res.data;
  }
  const spec = buildSoExportSpec(so);
  exportSpecAsExcel(spec);
  showToast('Export Excel berhasil.', 'success');
}

function getLaporanParams() {
  const params = { currentUser: CURRENT_USER, tipeSo: TIPE_SO_STATE.laporan };
  if (needsStorePicker() && document.getElementById('lapStoreFilter')) {
    params.store = document.getElementById('lapStoreFilter').value;
  }
  const elMulai = document.getElementById('lapTanggalMulai');
  const elAkhir = document.getElementById('lapTanggalAkhir');
  params.tanggalMulai = elMulai ? elMulai.value : '';
  params.tanggalAkhir = elAkhir ? elAkhir.value : '';
  return params;
}

async function loadLaporanData(force) {
  const params = getLaporanParams();
  const cacheKey = 'laporanData:' + JSON.stringify(params);

  const cachedRes = !force ? peekCached(cacheKey) : null;
  if (cachedRes && cachedRes.success) {
    renderLaporanData(cachedRes.data);
  } else {
    ['lapStatGrid'].forEach(function(id) {
      const el = document.getElementById(id);
      if (el) el.innerHTML = skeletonStatGridHtml(5);
    });
    [['lapStoreBody', 4], ['lapTopItemBody', 4], ['lapSoBody', 6]].forEach(function(pair) {
      const el = document.getElementById(pair[0]);
      if (el) el.innerHTML = skeletonTableRowsHtml(4, pair[1]);
    });
  }

  prefetchOppositeTipeSo('laporan', 'laporanData', 'getLaporanData', function(tipe) {
    const prevTipe = TIPE_SO_STATE.laporan;
    TIPE_SO_STATE.laporan = tipe;
    const p = getLaporanParams();
    TIPE_SO_STATE.laporan = prevTipe;
    return p;
  });

  const res = await getCached(cacheKey, function() {
    return callServer('getLaporanData', params, { silent: true });
  }, force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  LAPORAN_CACHE = res.data;
  renderLaporanData(res.data);
}

function renderLaporanData(d) {

let AUDIT_SELISIH_CACHE = null;
const AUDIT_SELISIH_PAGE_SIZE = 50;
let AUDIT_SELISIH_PAGE = 1;

async function loadAuditSelisihData(force) {
  const params = { currentUser: CURRENT_USER, tipeSo: TIPE_SO_STATE.auditSelisih };
  if (needsStorePicker() && document.getElementById('auditStoreFilter')) {
    params.store = document.getElementById('auditStoreFilter').value;
  }
  params.tanggalMulai = document.getElementById('auditTanggalMulai') ? document.getElementById('auditTanggalMulai').value : '';
  params.tanggalAkhir = document.getElementById('auditTanggalAkhir') ? document.getElementById('auditTanggalAkhir').value : '';
  params.minOccurrence = document.getElementById('auditMinOccurrence') ? document.getElementById('auditMinOccurrence').value : '2';

  const cacheKey = 'auditSelisih:' + JSON.stringify(params);
  AUDIT_SELISIH_PAGE = 1;
  const cachedRes = !force ? peekCached(cacheKey) : null;
  if (cachedRes && cachedRes.success) {
    AUDIT_SELISIH_CACHE = cachedRes.data;
    renderAuditSelisihData(cachedRes.data);
  } else {
    const tbody = document.getElementById('auditBody');
    if (tbody) tbody.innerHTML = skeletonTableRowsHtml(4, 9);
    const statGrid = document.getElementById('auditStatGrid');
    if (statGrid) statGrid.innerHTML = skeletonStatGridHtml(4);
  }

  prefetchOppositeTipeSo('auditSelisih', 'auditSelisih', 'getAuditSelisihBerulang', function(tipe) {
    const p = { currentUser: CURRENT_USER, tipeSo: tipe };
    if (needsStorePicker() && document.getElementById('auditStoreFilter')) {
      p.store = document.getElementById('auditStoreFilter').value;
    }
    p.tanggalMulai = document.getElementById('auditTanggalMulai') ? document.getElementById('auditTanggalMulai').value : '';
    p.tanggalAkhir = document.getElementById('auditTanggalAkhir') ? document.getElementById('auditTanggalAkhir').value : '';
    p.minOccurrence = document.getElementById('auditMinOccurrence') ? document.getElementById('auditMinOccurrence').value : '2';
    return p;
  });

  const res = await getCached(cacheKey, function() {
    return callServer('getAuditSelisihBerulang', params, { silent: true });
  }, force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  AUDIT_SELISIH_CACHE = res.data;
  AUDIT_SELISIH_PAGE = 1;
  renderAuditSelisihData(res.data);
}

function goToAuditSelisihPage(page) {
  const d = AUDIT_SELISIH_CACHE;
  if (!d) return;
  const totalPages = Math.max(1, Math.ceil(d.rows.length / AUDIT_SELISIH_PAGE_SIZE));
  AUDIT_SELISIH_PAGE = Math.min(Math.max(1, page), totalPages);
  renderAuditSelisihData(d);
}

function renderAuditSelisihData(d) {
  const statGrid = document.getElementById('auditStatGrid');
  if (!statGrid) return; // halaman/buffer prefetch sudah dilepas sebelum data ini datang - aman diabaikan
  statGrid.innerHTML =
    '<div class="stat-card solid c-purple"><div class="stat-icon">' + ICONS.target + '</div><div><div class="stat-value">' + formatNumber(d.summary.totalItemBerulang) + '</div><div class="stat-label">Item Selisih Berulang</div></div></div>' +

    '<div class="stat-card solid ' + (d.summary.totalSelisihValue < 0 ? 'c-red' : 'c-green') + '"><div class="stat-icon">' + ICONS.report + '</div><div><div class="stat-value">' + formatRupiah(d.summary.totalSelisihValue) + '</div><div class="stat-label">Total Selisih Value</div></div></div>';
  fitStatCardValues(statGrid);

  const totalRows = d.rows.length;
  const totalPages = Math.max(1, Math.ceil(totalRows / AUDIT_SELISIH_PAGE_SIZE));
  if (AUDIT_SELISIH_PAGE > totalPages) AUDIT_SELISIH_PAGE = totalPages;
  const startIdx = (AUDIT_SELISIH_PAGE - 1) * AUDIT_SELISIH_PAGE_SIZE;
  const pageRows = d.rows.slice(startIdx, startIdx + AUDIT_SELISIH_PAGE_SIZE);

  const body = document.getElementById('auditBody');
  body.innerHTML = pageRows.length ? pageRows.map(function(g) {
    const patternClass = g.pattern === 'Selalu Minus' ? 'badge-red' : (g.pattern === 'Selalu Plus' ? 'badge-green' : 'badge-role');

    const oldest = g.occurrences[g.occurrences.length - 1];
    const newest = g.occurrences[0];
    const perubahan = auditPerubahanHtml(oldest, newest, g.pattern);

    const newestCls = newest.selisihQty < 0 ? 'prev-selisih-minus' : (newest.selisihQty > 0 ? 'prev-selisih-plus' : 'prev-selisih-zero');
    const newestSign = newest.selisihQty > 0 ? '+' : '';
    const newestTitle = escapeHtml(newest.soId + ' · ' + formatDateDisplay(newest.tanggal) + ' — klik untuk preview');
    const riwayatHtml =
      '<span class="prev-selisih-badge prev-selisih-clickable ' + newestCls + '" title="' + newestTitle + '" onclick="event.stopPropagation();openPrevSoPreview(\'' + escapeHtml(newest.soId) + '\',\'' + escapeHtml(g.sku) + '\')">' + newestSign + formatNumber(newest.selisihQty) + '</span>' +
      (g.occurrences.length > 1 ?
        ' <span class="audit-riwayat-more" onclick="event.stopPropagation();openAuditRiwayatModal(\'' + escapeHtml(g.store) + '\',\'' + escapeHtml(g.sku) + '\',\'' + escapeHtml(g.nama) + '\')">lihat semua (' + g.occurrences.length + ')</span>'
        : '');

    return '<tr><td>' + escapeHtml(g.store) + '</td><td>' + escapeHtml(g.sku) + '</td><td class="cell-clip cell-clip-sm" title="' + escapeHtml(g.nama) + '">' + escapeHtml(g.nama) + '</td>' +
      '<td class="text-center"><strong>' + g.occurrences.length + 'x</strong></td>' +
      '<td><span class="badge ' + patternClass + '">' + escapeHtml(g.pattern) + '</span></td>' +
      '<td>' + perubahan + '</td>' +
      '<td class="text-right ' + (g.totalQty < 0 ? 'text-red' : '') + '">' + formatNumber(g.totalQty) + '</td>' +
      '<td class="text-right ' + (g.totalValue < 0 ? 'text-red' : '') + '">' + formatRupiah(g.totalValue) + '</td>' +
      '<td class="audit-riwayat-cell">' + riwayatHtml + '</td></tr>';
  }).join('') : '<tr><td colspan="9" class="td-empty-state"><div class="empty-state"><div class="empty-icon">' + ICONS.target + '</div><div class="empty-title">Tidak ada item dengan selisih berulang</div><div class="empty-desc">Coba turunkan "Min. Berulang" atau perluas rentang tanggal.</div></div></td></tr>';

  renderAuditSelisihPagination(totalRows, startIdx, startIdx + pageRows.length);

  AUDIT_SELISIH_CACHE = d;
}

function renderAuditSelisihPagination(totalItems, startIdx, endIdx) {
  const bar = document.getElementById('auditPaginationBar');
  if (!bar) return;
  if (!totalItems) { bar.innerHTML = ''; return; }
  const totalPages = Math.max(1, Math.ceil(totalItems / AUDIT_SELISIH_PAGE_SIZE));
  const page = AUDIT_SELISIH_PAGE;

  bar.innerHTML =
    '<div class="pagination-info">Menampilkan <strong>' + (startIdx + 1) + '–' + endIdx + '</strong> dari <strong>' + formatNumber(totalItems) + '</strong> item</div>' +
    '<div class="pagination-controls">' +
      '<button class="btn btn-secondary btn-sm" id="auditPrevBtn"' + (page <= 1 ? ' disabled' : '') + '>' + ICONS.chevronLeft + ' Prev</button>' +
      '<span class="pagination-page-label">Halaman ' + page + ' dari ' + totalPages + '</span>' +
      '<button class="btn btn-secondary btn-sm" id="auditNextBtn"' + (page >= totalPages ? ' disabled' : '') + '>Next ' + ICONS.chevronRight + '</button>' +
    '</div>';

  const prevBtn = document.getElementById('auditPrevBtn');
  const nextBtn = document.getElementById('auditNextBtn');
  if (prevBtn) prevBtn.addEventListener('click', function() { goToAuditSelisihPage(page - 1); });
  if (nextBtn) nextBtn.addEventListener('click', function() { goToAuditSelisihPage(page + 1); });
}

function auditPerubahanHtml(oldest, newest, pattern) {
  const from = oldest.selisihQty, to = newest.selisihQty;
  const madeWorse = Math.abs(to) > Math.abs(from);
  const sameSign = pattern !== 'Campuran';
  let arrowCls = 'audit-perubahan-neutral';
  let arrowSvg = '';
  if (sameSign) {
    arrowCls = madeWorse ? 'audit-perubahan-worse' : 'audit-perubahan-better';
    arrowSvg = madeWorse
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 8 17 17 8 17"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="7" x2="7" y2="17"/><polyline points="7 8 7 17 16 17"/></svg>';
  } else {
    arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>';
  }
  const fromTxt = (from > 0 ? '+' : '') + formatNumber(from);
  const toTxt = (to > 0 ? '+' : '') + formatNumber(to);
  return '<div class="audit-perubahan ' + arrowCls + '">' +
    '<span class="audit-perubahan-icon">' + arrowSvg + '</span>' +
    '<span class="audit-perubahan-text">' + fromTxt + ' → ' + toTxt + '</span>' +
  '</div>';
}

function openAuditRiwayatModal(store, sku, nama) {
  const d = AUDIT_SELISIH_CACHE;
  const g = d && d.rows.find(function(r) { return r.store === store && r.sku === sku; });
  if (!g) return;

  const rowsHtml = g.occurrences.map(function(o) {
    const cls = o.selisihQty < 0 ? 'prev-selisih-minus' : (o.selisihQty > 0 ? 'prev-selisih-plus' : 'prev-selisih-zero');
    const sign = o.selisihQty > 0 ? '+' : '';
    return '<div class="audit-riwayat-row">' +
      '<div class="audit-riwayat-row-left">' +
        '<div class="audit-riwayat-row-soid">' + escapeHtml(o.soId) + '</div>' +
        '<div class="audit-riwayat-row-tanggal">' + formatDateDisplay(o.tanggal) + '</div>' +
      '</div>' +
      '<span class="prev-selisih-badge prev-selisih-clickable ' + cls + '" onclick="closeModal();openPrevSoPreview(\'' + escapeHtml(o.soId) + '\',\'' + escapeHtml(sku) + '\')">' + sign + formatNumber(o.selisihQty) + '</span>' +
    '</div>';
  }).join('');

  openModal(
    modalHeaderHtml({ icon: ICONS.history, color: 'blue', title: 'Riwayat Selisih', subtitle: sku }) +
    '<div class="modal-body">' +
      '<div class="prev-preview-meta" style="margin-bottom:14px;">' + escapeHtml(nama) + ' · ' + escapeHtml(store) + '</div>' +
      '<div class="audit-riwayat-list">' + rowsHtml + '</div>' +
    '</div>'
  );
}

let PERBANDINGAN_PERIODE_CACHE = null;

async function loadPerbandinganPeriodeData(force) {
  const params = { currentUser: CURRENT_USER, tipeSo: TIPE_SO_STATE.perbandinganPeriode };
  if (needsStorePicker() && document.getElementById('banStoreFilter')) {
    params.store = document.getElementById('banStoreFilter').value;
  }
  params.periode1Mulai = document.getElementById('banP1Mulai') ? document.getElementById('banP1Mulai').value : '';
  params.periode1Akhir = document.getElementById('banP1Akhir') ? document.getElementById('banP1Akhir').value : '';
  params.periode2Mulai = document.getElementById('banP2Mulai') ? document.getElementById('banP2Mulai').value : '';
  params.periode2Akhir = document.getElementById('banP2Akhir') ? document.getElementById('banP2Akhir').value : '';

  const cacheKey = 'perbandinganPeriode:' + JSON.stringify(params);
  const cachedRes = !force ? peekCached(cacheKey) : null;
  if (cachedRes && cachedRes.success) {
    PERBANDINGAN_PERIODE_CACHE = cachedRes.data;
    renderPerbandinganPeriodeData(cachedRes.data);
  } else {
    const setSkel = function(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; };
    setSkel('banSummaryGrid', skeletonStatGridHtml(2));
    setSkel('banDeltaBox', skeletonBarsHtml(1));
    setSkel('banTrendSummaryGrid', skeletonStatGridHtml(6));
    setSkel('banStoreBody', skeletonTableRowsHtml(4, 4));
  }

  prefetchOppositeTipeSo('perbandinganPeriode', 'perbandinganPeriode', 'getPerbandinganAntarPeriode', function(tipe) {
    const p = { currentUser: CURRENT_USER, tipeSo: tipe };
    if (needsStorePicker() && document.getElementById('banStoreFilter')) {
      p.store = document.getElementById('banStoreFilter').value;
    }
    p.periode1Mulai = document.getElementById('banP1Mulai') ? document.getElementById('banP1Mulai').value : '';
    p.periode1Akhir = document.getElementById('banP1Akhir') ? document.getElementById('banP1Akhir').value : '';
    p.periode2Mulai = document.getElementById('banP2Mulai') ? document.getElementById('banP2Mulai').value : '';
    p.periode2Akhir = document.getElementById('banP2Akhir') ? document.getElementById('banP2Akhir').value : '';
    return p;
  });

  const res = await getCached(cacheKey, function() {
    return callServer('getPerbandinganAntarPeriode', params, { silent: true });
  }, force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  PERBANDINGAN_PERIODE_CACHE = res.data;
  renderPerbandinganPeriodeData(res.data);
}

const TREND_ARROW_UP = '↑';
const TREND_ARROW_DOWN = '↓';
const TREND_ARROW_FLAT = '→';

function trendArrowHtml(delta) {
  if (delta > 0) return '<div class="trend-summary-arrow up">' + TREND_ARROW_UP + '</div>';
  if (delta < 0) return '<div class="trend-summary-arrow down">' + TREND_ARROW_DOWN + '</div>';
  return '<div class="trend-summary-arrow flat">' + TREND_ARROW_FLAT + '</div>';
}

function trendCardHtml(label, arrowHtml, nameText, valueHtml, subText) {
  return '<div class="trend-summary-card">' + arrowHtml +
    '<div class="trend-summary-body">' +
      '<div class="trend-summary-label">' + escapeHtml(label) + '</div>' +
      (nameText ? '<div class="trend-summary-name">' + escapeHtml(nameText) + '</div>' : '') +
      '<div class="trend-summary-value">' + valueHtml + '</div>' +
      (subText ? '<div class="trend-summary-sub">' + subText + '</div>' : '') +
    '</div>' +
  '</div>';
}
