(function() {
  const TOOLTIP_SELECTOR = '.icon-btn[title], .sidebar-toggle[title], .theme-toggle-btn[title]';
  function stashTitle(el) {
    const t = el.getAttribute('title');
    if (t !== null) {
      el.setAttribute('data-tooltip', t);
      el.removeAttribute('title');
    }
  }
  function restoreTitle(el) {
    const t = el.getAttribute('data-tooltip');
    if (t !== null) {
      el.setAttribute('title', t);
    }
  }
  document.addEventListener('mouseover', function(e) {
    const el = e.target.closest(TOOLTIP_SELECTOR);
    if (el) stashTitle(el);
  }, true);
  document.addEventListener('mouseout', function(e) {
    const el = e.target.closest('.icon-btn[data-tooltip], .sidebar-toggle[data-tooltip], .theme-toggle-btn[data-tooltip]');
    if (el && !el.contains(e.relatedTarget)) restoreTitle(el);
  }, true);
  document.addEventListener('focusin', function(e) {
    const el = e.target.closest(TOOLTIP_SELECTOR);
    if (el) stashTitle(el);
  });
  document.addEventListener('focusout', function(e) {
    const el = e.target.closest('.icon-btn[data-tooltip], .sidebar-toggle[data-tooltip], .theme-toggle-btn[data-tooltip]');
    if (el) restoreTitle(el);
  });
})();

let _SUPPRESS_HISTORY_PUSH = false; 

function pushNavHistory_(page, params) {
  if (_SUPPRESS_HISTORY_PUSH) return;
  try {
    history.pushState({ __soApp: true, page: page, params: params || null }, '', location.href);
  } catch (e) {
    console.warn('pushNavHistory_ gagal (abaikan, WebView tidak mendukung):', e);
  }
}

window.addEventListener('popstate', function(evt) {
  const state = evt.state;
  if (!state || !state.__soApp) {
    return;
  }
  _SUPPRESS_HISTORY_PUSH = true;
  try {
    navigateToNow(state.page, state.params || undefined);
  } finally {
    _SUPPRESS_HISTORY_PUSH = false;
  }
});

  stockOpname: 'Mingguan', riwayat: 'Mingguan', dashboard: 'Mingguan',

function tipeSoToggleHtml(pageKey) {
  const active = TIPE_SO_STATE[pageKey] || 'Mingguan';
  return '<div class="tipe-so-toggle" id="tipeSoToggle_' + pageKey + '">' +
    '<button type="button" class="tipe-so-toggle-btn' + (active === 'Mingguan' ? ' active' : '') + '" data-tipe="Mingguan">Mingguan</button>' +
    '<button type="button" class="tipe-so-toggle-btn' + (active === 'Bulanan' ? ' active' : '') + '" data-tipe="Bulanan">Bulanan</button>' +
  '</div>';
}

function bindTipeSoToggle(pageKey, onChange) {
  const el = document.getElementById('tipeSoToggle_' + pageKey);
  if (!el) return;
  el.querySelectorAll('.tipe-so-toggle-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const tipe = btn.getAttribute('data-tipe');
      if (TIPE_SO_STATE[pageKey] === tipe) return;
      TIPE_SO_STATE[pageKey] = tipe;
      el.querySelectorAll('.tipe-so-toggle-btn').forEach(function(b) { b.classList.toggle('active', b === btn); });
      onChange(tipe);
    });
  });
}

function prefetchOppositeTipeSo(pageKey, cachePrefix, serverFnName, buildParams) {
  if (!CURRENT_USER) return;
  const currentTipe = TIPE_SO_STATE[pageKey] || 'Mingguan';
  const oppositeTipe = currentTipe === 'Bulanan' ? 'Mingguan' : 'Bulanan';
  setTimeout(function() {
    if ((TIPE_SO_STATE[pageKey] || 'Mingguan') !== currentTipe) return;
    const params = buildParams(oppositeTipe);
    const cacheKey = cachePrefix + ':' + JSON.stringify(params);
    if (peekCached(cacheKey)) return; 
    getCached(cacheKey, function() {
      return callServer(serverFnName, params, { silent: true });
    }).catch(function() {
    });
  }, 150);
}

function prefetchBothTipeSoNow(pageKey, cachePrefix, serverFnName, buildParams) {
  if (!CURRENT_USER) return Promise.resolve();
  const tipes = ['Mingguan', 'Bulanan'];
  return Promise.all(tipes.map(function(tipe) {
    const params = buildParams(tipe);
    const cacheKey = cachePrefix + ':' + JSON.stringify(params);
    if (peekCached(cacheKey)) return Promise.resolve();
    return getCached(cacheKey, function() {
      return callServer(serverFnName, params, { silent: true });
    }).catch(function() {
    });
  }));
}

async function warmSoDataCache() {
  if (!CURRENT_USER) return;
  const toDateInput = function(d) { return d.toISOString().slice(0, 10); };
  const today = new Date();
  const firstOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const dayIdx = today.getDay();
  const diffToMonday = dayIdx === 0 ? 6 : dayIdx - 1;
  const thisMonday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - diffToMonday);
  const lastMonday = new Date(thisMonday); lastMonday.setDate(lastMonday.getDate() - 7);
  const lastSunday = new Date(thisMonday); lastSunday.setDate(lastSunday.getDate() - 1);

  // FIX: sebelumnya semua job prefetch ini ditembak BARENGAN lewat
  // Promise.all (8 fungsi server x 2 tipeSo = sampai 16 request JSONP
  // sekaligus, pas banget sama waktu dashboard utama juga lagi loading).
  // Di koneksi yang lemot/tidak stabil ini gampang bikin sebagian request
  // timeout -> muncul toast "Gagal menghubungi server". Sekarang job
  // dijalankan BERURUTAN (satu-satu, dikasih jeda), supaya tidak berebut
  // bandwidth/kuota eksekusi dengan request utama yang sedang ditunggu user.
  const jobs = [
    function() { return prefetchBothTipeSoNow('dashboard', 'dashboard', 'getDashboardData', function(tipe) {
      const p = { currentUser: CURRENT_USER, tipeSo: tipe };
      if (needsStorePicker()) { p.store = ''; p.tanggal = ''; }
      return p;
    }); },
    function() { return prefetchBothTipeSoNow('dashboard', 'tren', 'getTrendData', function(tipe) {
      const p = { currentUser: CURRENT_USER, tipeSo: tipe };
      if (needsStorePicker()) p.store = '';
      return p;
    }); },
    function() { return prefetchBothTipeSoNow('dashboard', 'soList', 'getSoListForStore', function(tipe) {
      return { currentUser: CURRENT_USER, statusFilter: 'selesai', tipeSo: tipe };
    }); },
    function() { return prefetchBothTipeSoNow('stockOpname', 'soList', 'getSoListForStore', function(tipe) {
      const p = { currentUser: CURRENT_USER, statusFilter: 'active', tipeSo: tipe, search: '' };
      if (needsStorePicker()) p.store = '';
      return p;
    }); },
    function() { return prefetchBothTipeSoNow('riwayat', 'soList', 'getSoListForStore', function(tipe) {
      const p = { currentUser: CURRENT_USER, statusFilter: 'selesai', tipeSo: tipe, search: '' };
      if (needsStorePicker()) p.store = '';
      p.tanggalMulai = '';
      p.tanggalAkhir = '';
      p.selisihType = '';
      p.sortBy = 'terbaru';
      return p;
    }); },
    function() { return prefetchBothTipeSoNow('laporan', 'laporanData', 'getLaporanData', function(tipe) {
      const p = { currentUser: CURRENT_USER, tipeSo: tipe };
      if (needsStorePicker()) p.store = '';
      p.tanggalMulai = toDateInput(firstOfMonth);
      p.tanggalAkhir = toDateInput(today);
      return p;
    }); },
    function() { return prefetchBothTipeSoNow('auditSelisih', 'auditSelisih', 'getAuditSelisihBerulang', function(tipe) {
      const p = { currentUser: CURRENT_USER, tipeSo: tipe };
      if (needsStorePicker()) p.store = '';
      p.tanggalMulai = toDateInput(firstOfMonth);
      p.tanggalAkhir = toDateInput(today);
      p.minOccurrence = '2';
      return p;
    }); },
    function() { return prefetchBothTipeSoNow('perbandinganPeriode', 'perbandinganPeriode', 'getPerbandinganAntarPeriode', function(tipe) {
      const p = { currentUser: CURRENT_USER, tipeSo: tipe };
      if (needsStorePicker()) p.store = '';
      p.periode1Mulai = toDateInput(lastMonday);
      p.periode1Akhir = toDateInput(lastSunday);
      p.periode2Mulai = toDateInput(thisMonday);
      p.periode2Akhir = toDateInput(today);
      return p;
    }); }
  ];

  for (let i = 0; i < jobs.length; i++) {
    if (!CURRENT_USER) return;
    try { await jobs[i](); } catch (e) { }
    await new Promise(function(resolve) { setTimeout(resolve, 500); });
  }
}

const ROLE_ADMIN = 'ADMIN';
const ROLE_USER_STORE = 'USER_STORE';
const ROLE_HEAD_STORE = 'HEAD_STORE';
const ROLE_STORE_COORDINATOR = 'STORE_COORDINATOR';
const ROLE_LABELS = {
  ADMIN: 'SUPER ADMIN',
  USER_STORE: 'USER STORE',
  HEAD_STORE: 'HEAD STORE',
  STORE_COORDINATOR: 'STORE COORDINATOR'
};

function isAdmin() { return CURRENT_USER && CURRENT_USER.role === ROLE_ADMIN; }
function canApproveSo() { return CURRENT_USER && (CURRENT_USER.role === ROLE_STORE_COORDINATOR || CURRENT_USER.role === ROLE_ADMIN); }
function isReadOnlyRole() {
  if (!CURRENT_USER) return false;
  if (isAdmin()) return false;
  return !hasMenuPermission('stockOpname', 'create') && !hasMenuPermission('stockOpname', 'edit');
}

function hasMenuPermission(menuKey, action) {
  action = action || 'view';
  if (isAdmin()) return true;
  if (!CURRENT_USER || !CURRENT_USER.permissions) return false;
  const perm = CURRENT_USER.permissions[menuKey];
  return !!(perm && perm[action]);
}

function canAccessPage(page) {
  if (!CURRENT_USER) return false;
  if (isAdmin()) return true;
  if (page === 'soDetail') {
    return hasMenuPermission('stockOpname', 'view') || hasMenuPermission('riwayat', 'view');
  }
  return hasMenuPermission(page, 'view');
}

function applyRoleMenu() {
  document.querySelectorAll('.nav-item[data-page]').forEach(function(item) {
    const page = item.getAttribute('data-page');
    item.classList.toggle('hidden', !canAccessPage(page));
  });
  document.querySelectorAll('.nav-group, .more-sheet-group').forEach(function(group) {
    const items = group.querySelectorAll('.nav-item[data-page]');
    const anyVisible = Array.prototype.some.call(items, function(el) { return !el.classList.contains('hidden'); });
    group.classList.toggle('hidden', items.length > 0 && !anyVisible);
  });
}
function hasAllStoreAccess() {
  return CURRENT_USER && CURRENT_USER.role === ROLE_ADMIN;
}
function userStoreList() {
  if (!CURRENT_USER) return [];
  if (hasAllStoreAccess()) return null;
  return CURRENT_USER.storeList || (CURRENT_USER.store ? String(CURRENT_USER.store).split(',').map(function(s){return s.trim();}).filter(function(s){return s;}) : []);
}
function needsStorePicker() {
  const stores = userStoreList();
  return stores === null || stores.length > 1;
}

const _CACHE_STORE = {};
async function getCached(key, fetchFn, force) {
  if (!force && _CACHE_STORE[key] !== undefined) {
    return _CACHE_STORE[key];
  }
  const data = await fetchFn();
  if (data && data.success === false) {
    return data;
  }
  _CACHE_STORE[key] = data;
  return data;
}
function peekCached(key) {
  return _CACHE_STORE[key] !== undefined ? _CACHE_STORE[key] : null;
}
function invalidateCache(key, opts) {
  if (key) {
    delete _CACHE_STORE[key];
    return;
  }
  if (opts && opts.tipeSo) {
    const needle = '"tipeSo":"' + opts.tipeSo + '"';
    Object.keys(_CACHE_STORE).forEach(function(k) {
      if ((k.indexOf('soList:') === 0 || k.indexOf('dashboard:') === 0 || k.indexOf('itemDrilldown:') === 0) && k.indexOf(needle) !== -1) {
        delete _CACHE_STORE[k];
      }
    });
    return;
  }
  if (opts && opts.scope) {
    Object.keys(_CACHE_STORE).forEach(function(k) {
      if (k.indexOf(opts.scope) === 0) delete _CACHE_STORE[k];
    });
    return;
  }
  Object.keys(_CACHE_STORE).forEach(function(k) { delete _CACHE_STORE[k]; });
}

function filterBarHtml(fields, opts) {
  opts = opts || {};
  const fieldsHtml = fields.map(function(f) {
    let inputHtml = '';
    if (f.type === 'select') {
      const optsHtml = (f.options || []).map(function(o) {
        return '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.label) + '</option>';
      }).join('');
      inputHtml = '<select id="' + f.id + '">' + optsHtml + '</select><span class="filter-field-chevron">' + ICONS.chevronDown + '</span>';
    } else if (f.type === 'date') {
      inputHtml = '<input type="date" id="' + f.id + '" placeholder="' + (f.placeholder || '') + '">';
    } else {
      inputHtml = '<input type="text" id="' + f.id + '" placeholder="' + (f.placeholder || '') + '">';
    }
    const wrapClass = 'filter-field' + (f.grow ? ' grow' : '') + (f.search ? ' filter-field-search' : '');
    if (f.search) inputHtml = '<span class="filter-field-input-wrap">' + inputHtml + '</span>';
    return '<div class="' + wrapClass + '">' +

function setupAutoFilterBar(barEl, resetBtn, applyFn, resetFn) {
  if (!barEl) return;
  const fieldsEl = barEl.querySelector('.filter-bar-fields') || barEl;
  const controls = Array.prototype.slice.call(fieldsEl.querySelectorAll('input, select'));
  if (!controls.length) return;

  enhanceDateFieldPlaceholders_(fieldsEl);

  const initialValues = controls.map(function(el) {
    if (el.tagName === 'SELECT') return el.options.length ? el.options[0].value : '';
    return '';
  });

  function isPillField(el) {
    return !(el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'search'));
  }

  function updateFieldActiveState(el, i) {
    if (!isPillField(el)) return;
    const pill = el.closest('.filter-field');
    if (pill) pill.classList.toggle('is-active', el.value !== initialValues[i]);
  }

  function updateResetVisibility() {
    if (!resetBtn) return;
    const changed = controls.some(function(el, i) { return el.value !== initialValues[i]; });
    resetBtn.classList.toggle('hidden', !changed);
  }

  let debounceTimer = null;
  controls.forEach(function(el, i) {
    const isTextLike = el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'search');
    const eventName = isTextLike ? 'input' : 'change';
    el.addEventListener(eventName, function() {
      updateFieldActiveState(el, i);
      updateResetVisibility();
      if (el.tagName === 'SELECT') {
        const w = el.nextElementSibling;
        if (w && w.classList.contains('cs-select')) refreshCsSelect(el, w);
      }
      if (isTextLike) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(applyFn, 300);
      } else {
        clearTimeout(debounceTimer);
        applyFn();
      }
    });
  });

  controls.forEach(updateFieldActiveState);
  updateResetVisibility();

  if (resetBtn) {
    resetBtn.addEventListener('click', function() {
      clearTimeout(debounceTimer);
      if (resetFn) {
        resetFn();
      } else {
        controls.forEach(function(el, i) { el.value = initialValues[i]; });
        applyFn();
      }
      controls.forEach(updateFieldActiveState);
      updateResetVisibility();
      controls.forEach(function(el) {
        if (el.tagName !== 'SELECT') return;
        const w = el.nextElementSibling;
        if (w && w.classList.contains('cs-select')) refreshCsSelect(el, w);
      });
      updateFilterMoreBadge_(fieldsEl);
    });
  }

  enhanceFilterSelects(fieldsEl);

  setupMobileFilterCollapse_(fieldsEl, controls, initialValues);
}

function setupMobileFilterCollapse_(fieldsEl, controls, initialValues) {
  const collapsible = Array.prototype.slice.call(fieldsEl.children).filter(function(child) {
    return child.classList.contains('filter-field') && !child.classList.contains('grow');
  });
  if (collapsible.length <= 2) return; 
  if (fieldsEl.querySelector('.filter-more-toggle')) {
    updateFilterMoreBadge_(fieldsEl);
    return;
  }

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'filter-more-toggle';
  toggle.innerHTML =
    '<span class="fmt-icon">' + ICONS.filterField + '</span>' +
    '<span class="fmt-label">Filter</span>' +
    '<span class="fmt-badge hidden" id="fmtBadge-' + (fieldsEl.dataset.fmtId = 'fmt' + Math.random().toString(36).slice(2, 8)) + '"></span>' +
    '<span class="fmt-chevron">' + ICONS.chevronDown + '</span>';
  const searchField = fieldsEl.querySelector('.filter-field.grow');
  if (searchField && searchField.nextSibling) {
    fieldsEl.insertBefore(toggle, searchField.nextSibling);
  } else if (searchField) {
    fieldsEl.appendChild(toggle);
  } else {
    fieldsEl.insertBefore(toggle, fieldsEl.firstChild);
  }

  toggle.addEventListener('click', function() {
    fieldsEl.classList.toggle('is-expanded');
    toggle.classList.toggle('active', fieldsEl.classList.contains('is-expanded'));
  });

  collapsible.forEach(function(fieldEl) {
    const ctrl = fieldEl.querySelector('input, select');
    if (!ctrl) return;
    ctrl.addEventListener('change', function() { updateFilterMoreBadge_(fieldsEl); });
    ctrl.addEventListener('input', function() { updateFilterMoreBadge_(fieldsEl); });
  });
  updateFilterMoreBadge_(fieldsEl);
}

function updateFilterMoreBadge_(fieldsEl) {
  const toggle = fieldsEl.querySelector('.filter-more-toggle');
  if (!toggle) return;
  const badge = toggle.querySelector('.fmt-badge');
  const activeCount = fieldsEl.querySelectorAll('.filter-field:not(.grow).is-active').length;
  if (badge) {
    badge.textContent = String(activeCount);
    badge.classList.toggle('hidden', activeCount === 0);

}

function enhanceFilterSelects(container) {
  if (!container) return;

function enhanceOneSelect(sel) {
  let wrap = sel.nextElementSibling && sel.nextElementSibling.classList.contains('cs-select') ? sel.nextElementSibling : null;
  if (wrap) {
    refreshCsSelect(sel, wrap);
    return;
  }

  sel.classList.add('cs-native');
  sel.tabIndex = -1;

  wrap = document.createElement('div');
  wrap.className = 'cs-select';
  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'cs-trigger';
  const panel = document.createElement('div');
  panel.className = 'cs-panel';
  wrap.appendChild(trigger);
  wrap.appendChild(panel);
  sel.insertAdjacentElement('afterend', wrap);

  function closePanel() { wrap.classList.remove('open'); }
  function openPanel() {
    if (sel.disabled) return;
    document.querySelectorAll('.cs-select.open').forEach(function(o) { if (o !== wrap) o.classList.remove('open'); });
    wrap.classList.add('open');
    const sel2 = panel.querySelector('.cs-option.cs-selected') || panel.querySelector('.cs-option');
    if (sel2) sel2.scrollIntoView({ block: 'nearest' });
  }

  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    if (wrap.classList.contains('open')) closePanel(); else openPanel();
  });
  trigger.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') {
      e.preventDefault();
      openPanel();
    } else if (e.key === 'Escape') {
      closePanel();
    }
  });

  refreshCsSelect(sel, wrap);
}

document.addEventListener('click', function(e) {
  document.querySelectorAll('.cs-select.open').forEach(function(w) {
    if (!w.contains(e.target)) w.classList.remove('open');
  });
});

function refreshCsSelect(sel, wrap) {
  const trigger = wrap.querySelector('.cs-trigger');
  const panel = wrap.querySelector('.cs-panel');
  const options = Array.prototype.slice.call(sel.options);

  trigger.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
  trigger.disabled = sel.disabled;

  panel.innerHTML = '';
  if (!options.length) {
    const empty = document.createElement('div');
    empty.className = 'cs-empty';
    empty.textContent = 'Tidak ada opsi';
    panel.appendChild(empty);
    return;
  }
  options.forEach(function(opt, idx) {
    const row = document.createElement('div');
    row.className = 'cs-option' + (idx === sel.selectedIndex ? ' cs-selected' : '');
    row.setAttribute('role', 'option');
    const label = document.createElement('span');
    label.textContent = opt.text;
    row.appendChild(label);
    const check = document.createElement('span');
    check.className = 'cs-option-check';
    check.innerHTML = ICONS.check;
    row.appendChild(check);
    row.addEventListener('click', function(e) {
      e.stopPropagation();
      if (sel.selectedIndex !== idx) {
        sel.selectedIndex = idx;
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      }
      wrap.classList.remove('open');
      refreshCsSelect(sel, wrap);
    });
    panel.appendChild(row);
  });
}

  pop.style.cssText = 'position:fixed; top:' + (rect.bottom + 6) + 'px; left:' + left + 'px; width:' + popWidth + 'px;';

  pop.style.top = top + 'px';

// ---- Import chunked generik dengan progress 0-100% asli ----
// Dipakai oleh SEMUA proses import (Item Master, Barcode, Stock Sistem)
// supaya perilakunya konsisten: berapapun jumlah baris di file (900, 5000,
// dst), selalu dipecah otomatis jadi batch kecil yang aman dikirim (sekarang
// lewat POST di api-bridge.js sehingga TIDAK ADA LAGI batas panjang URL
// seperti skema JSONP/GET sebelumnya — chunking di sini semata-mata untuk
// UX progress bar & supaya request per-batch tetap ringan/cepat, bukan lagi
// untuk menghindari limit panjang URL).
//
// fnName        : nama fungsi backend (mis. 'importItemMaster')
// allRows       : seluruh baris hasil parse file
// buildParams   : function(chunkRows) -> object params yang dikirim ke server
//                 (tempat menyisipkan soId/currentUser/barcodeOnly dst)
// mergeStats    : function(totalStats, chunkStats) -> totalStats baru
//                 (jumlahkan field-field statistik hasil per-chunk)
// loadingLabel  : teks judul yang ditampilkan di atas progress bar
//
// Return: { success, message?, stats } — stats sudah tergabung dari semua
// chunk. Kalau salah satu chunk gagal, proses dihentikan (chunk berikutnya
// TIDAK dikirim) supaya tidak makin banyak yang diproses dalam keadaan
// tidak jelas, dan pesan error chunk tsb yang ditampilkan ke user.
async function runChunkedImport(fnName, allRows, buildParams, mergeStats, loadingLabel) {
  const CHUNK_SIZE = 200;
  const chunks = [];
  for (let i = 0; i < allRows.length; i += CHUNK_SIZE) {
    chunks.push(allRows.slice(i, i + CHUNK_SIZE));
  }

  showImportProgress(loadingLabel);

  let totalStats = {};
  let processedRows = 0;

  for (let i = 0; i < chunks.length; i++) {
    const chunk = chunks[i];
    let res;
    try {
      res = await callServer(fnName, buildParams(chunk), { silent: true, maxRetries: 2 });
    } catch (err) {
      hideImportProgress();
      return { success: false, message: 'Import gagal: ' + (err && err.message ? err.message : 'kesalahan jaringan.') };
    }
    if (!res || !res.success) {
      hideImportProgress();
      return { success: false, message: (res && res.message) || ('Import gagal pada bagian ke-' + (i + 1) + '.') };
    }
    totalStats = mergeStats(totalStats, res.stats || {});
    processedRows += chunk.length;
    updateImportProgress((processedRows / allRows.length) * 100);
  }

  hideImportProgress();
  return { success: true, stats: totalStats };
}

function formatRupiah(num) {
  num = Number(num) || 0;
  const neg = num < 0;
  const abs = Math.abs(num);
  const formatted = abs.toLocaleString('id-ID');
  return (neg ? '-Rp ' : 'Rp ') + formatted;
}

function formatNumber(num) {

function formatDateDisplay(dateStr) {
  if (!dateStr) return '-';
  const parts = String(dateStr).split('-');
  if (parts.length !== 3) return dateStr;
  const y = parts[0], m = parts[1], d = parts[2];
  if (!/^\d{4}$/.test(y) || !/^\d{1,2}$/.test(m) || !/^\d{1,2}$/.test(d)) return dateStr;
  const pad = function(n) { return String(n).padStart(2, '0'); };
  return pad(d) + '-' + pad(m) + '-' + y;
}

function formatTimestampDisplay(ts) {
  if (!ts) return '-';
  const m = String(ts).match(/^(\d{4})-(\d{1,2})-(\d{1,2})([ T](\d{2}:\d{2}(:\d{2})?))?/);
  if (!m) return ts;
  const pad = function(n) { return String(n).padStart(2, '0'); };
  const datePart = pad(m[3]) + '-' + pad(m[2]) + '-' + m[1];
  return m[5] ? (datePart + ' ' + m[5]) : datePart;
}

function formatDetailDates(detail) {
  if (!detail) return '';
  return String(detail).replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, function(_, y, mo, d) {
    return d + '-' + mo + '-' + y;
  });
}

function todayStr() {

  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return yyyy + '-' + mm + '-' + dd;
}

function callServer(functionName, args, opts) {
  opts = opts || {};
  const maxRetries = opts.maxRetries !== undefined ? opts.maxRetries : 3;
  const retryDelayMs = 900;
  const attemptTimeoutMs = opts.timeoutMs || 15000;

  function runOnce() {
    return new Promise(function(resolve, reject) {
      const handler = google.script.run
        .withSuccessHandler(function(result) { resolve(result); })
        .withFailureHandler(function(err) { reject(err); });
      if (args === undefined) {
        handler[functionName]();
      } else {
        handler[functionName](args);
      }
    });
  }

  function withTimeout(promise, ms) {
    return new Promise(function(resolve, reject) {
      const timer = setTimeout(function() {
        reject(new Error('TIMEOUT'));
      }, ms);
      promise.then(function(v) { clearTimeout(timer); resolve(v); },
                    function(e) { clearTimeout(timer); reject(e); });
    });
  }

  function attempt(retriesLeft) {
    return withTimeout(runOnce(), attemptTimeoutMs).then(
      function(result) {
        if ((result === null || result === undefined) && retriesLeft > 0) {
          return new Promise(function(res) { setTimeout(res, retryDelayMs); })
            .then(function() { return attempt(retriesLeft - 1); });
        }
        return result;
      },
      function(err) {
        if (retriesLeft > 0) {
          return new Promise(function(res) { setTimeout(res, retryDelayMs); })
            .then(function() { return attempt(retriesLeft - 1); });
        }
        throw err;
      }
    );
  }

  if (!opts.silent) showLoading(opts.loadingText);
  return attempt(maxRetries)
    .then(function(result) {
      if (!opts.silent) hideLoading();
      return result;
    })
    .catch(function(err) {
      if (!opts.silent) hideLoading();
      showToast('Terjadi kesalahan: ' + (err && err.message ? err.message : err), 'error');
      throw err;
    });
}

let _PREFETCH_TOKEN = 0;
let _PREFETCH_QUEUE = null; 
let _PREFETCH_RESUME_TIMER = null;
let _PREFETCH_ITEM_INFLIGHT = null;

function schedulePrefetchResume() {
  if (!_PREFETCH_QUEUE || !_PREFETCH_QUEUE.length || !CURRENT_USER) return;
  if (_PREFETCH_RESUME_TIMER) clearTimeout(_PREFETCH_RESUME_TIMER);
  _PREFETCH_RESUME_TIMER = setTimeout(function() {
    if (!CURRENT_USER) return;
    if (typeof requestIdleCallback === 'function') {
      requestIdleCallback(runPrefetchQueue, { timeout: 5000 });
    } else {
      runPrefetchQueue();
    }
  }, 4000);
}

async function prefetchAllMenus() {
  _PREFETCH_QUEUE = [
    { page: 'categoryManagement', fn: renderCategoryManagement },
    { page: 'stockOpname', fn: renderStockOpname },
    { page: 'riwayat', fn: renderRiwayat },
    { page: 'laporan', fn: renderLaporan },
    { page: 'auditSelisih', fn: renderAuditSelisih },
    { page: 'perbandinganPeriode', fn: renderPerbandinganPeriode },
    { page: 'storeManagement', fn: renderStoreManagement },
    { page: 'userManagement', fn: renderUserManagement },
    { page: 'activityLog', fn: renderActivityLog },
    { page: 'rolePermission', fn: renderRolePermission }
  ].filter(function(c) { return canAccessPage(c.page); });
  runPrefetchQueue();
}

async function runPrefetchQueue() {
  if (!_PREFETCH_QUEUE || !_PREFETCH_QUEUE.length || !CURRENT_USER) return;
  const myToken = ++_PREFETCH_TOKEN;
  const realContent = document.getElementById('pageContent');
  if (!realContent) return;

  while (_PREFETCH_QUEUE.length) {
    if (myToken !== _PREFETCH_TOKEN || !CURRENT_USER) return;

    const item = _PREFETCH_QUEUE[0];

    const buffer = document.createElement('div');
    buffer.id = 'pageContent';
    buffer.className = 'prefetch-buffer';
    buffer.style.cssText = 'position:fixed;left:-9999px;top:0;width:1200px;pointer-events:none;';
    realContent.removeAttribute('id');
    realContent.parentNode.insertBefore(buffer, realContent);
    document.body.appendChild(buffer); 

    const itemPromise = item.fn();
    _PREFETCH_ITEM_INFLIGHT = itemPromise.catch(function() {});
    try {
      await itemPromise;
      const doneIdx = _PREFETCH_QUEUE.indexOf(item);
      if (doneIdx !== -1) _PREFETCH_QUEUE.splice(doneIdx, 1);
      await new Promise(function(resolve) { setTimeout(resolve, 1200); });
    } catch (e) {
    } finally {
      _PREFETCH_ITEM_INFLIGHT = null;
      if (myToken === _PREFETCH_TOKEN) {
        buffer.remove();
        realContent.id = 'pageContent';
      }
    }
  }
}

let _NOTIF_ITEMS = [];
function notifTimeAgo_(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '';
  const diffMs = Date.now() - d.getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return 'Baru saja';
  if (min < 60) return min + ' menit lalu';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + ' jam lalu';
  const day = Math.floor(hr / 24);
  if (day < 7) return day + ' hari lalu';
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}
function renderNotifPopoverList_() {
  const list = document.getElementById('notifPopoverList');
  if (!list) return;
  if (!_NOTIF_ITEMS.length) {
    list.innerHTML =

        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>' +
        '<span>Tidak ada notifikasi</span>' +
      '</div>';
    return;
  }
  list.innerHTML = _NOTIF_ITEMS.map(function(item) {
    return (
      '<button type="button" class="notif-item type-' + escapeHtml(item.type || '') + '" data-so-id="' + escapeHtml(item.soId || '') + '" data-tipe-so="' + escapeHtml(item.tipeSo || 'Mingguan') + '" data-notif-type="' + escapeHtml(item.type || '') + '">' +
        '<span class="notif-item-dot"></span>' +

          '<span class="notif-item-title">' + escapeHtml(item.title || '') + '</span>' +
          '<span class="notif-item-message">' + escapeHtml(item.message || '') + '</span>' +
          '<span class="notif-item-time">' + escapeHtml(notifTimeAgo_(item.time)) + '</span>' +
        '</span>' +
      '</button>'
    );
  }).join('');
}
async function refreshNotifBadge() {
  const badge = document.getElementById('notifBadge');
  if (!badge) return;
  try {
    const res = await callServer('getNotifCount', { currentUser: CURRENT_USER }, { silent: true });
    if (!res.success) {
      console.warn('refreshNotifBadge gagal:', res.message);
      if (typeof showToast === 'function') showToast('Notifikasi: ' + (res.message || 'gagal dimuat'), 'error');
      return;
    }
    const count = res.data.count || 0;
    _NOTIF_ITEMS = res.data.items || [];
    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : String(count);
      badge.classList.remove('hidden');
      document.getElementById('notifBtn').title = res.data.label || 'Notifikasi';
    } else {
      badge.classList.add('hidden');
      document.getElementById('notifBtn').title = 'Notifikasi';
    }
    renderNotifPopoverList_();
  } catch (e) {
    console.warn('refreshNotifBadge error:', e);
    if (typeof showToast === 'function') showToast('Notifikasi: ' + (e && e.message ? e.message : 'gagal dimuat'), 'error');
  }
}

  if (_scanBarcodeHtml5QrCode) stopScanBarcodeCamera();
  if (_soDraftAutosaveTimer) {
    clearTimeout(_soDraftAutosaveTimer);
    _soDraftAutosaveTimer = null;
    runSoDraftAutosave();
    waitForSoDraftAutosaveIdle_().finally(function() {
      navigateToNow(page, params);
    });
    return;
  }
  if (_soDraftAutosaveInFlight) {
    waitForSoDraftAutosaveIdle_().finally(function() {
      navigateToNow(page, params);
    });
    return;
  }
  // Jangan tunggu prefetch background selesai — itu cuma pemanasan cache
  // untuk halaman lain, bukan sesuatu yang boleh menunda navigasi user yang
  // sedang menunggu. navigateToNow() sendiri sudah menaikkan _PREFETCH_TOKEN
  // di awal, yang otomatis menghentikan loop prefetch di iterasi berikutnya.
  navigateToNow(page, params);
}

function waitForSoDraftAutosaveIdle_() {
  return new Promise(function(resolve) {
    (function check() {
      if (!_soDraftAutosaveInFlight && !_soDraftAutosaveTimer) { resolve(); return; }
      setTimeout(check, 100);
    })();
  });
}

function navigateToNow(page, params) {
  _PREFETCH_TOKEN++;
  const prefetchBuffer = document.querySelector('.prefetch-buffer');
  if (prefetchBuffer) {
    prefetchBuffer.removeAttribute('id');
    prefetchBuffer.remove();
  }
  const realContentEl = document.querySelector('main.content');
  if (realContentEl && !document.getElementById('pageContent')) {
    realContentEl.id = 'pageContent';
  }

  if (!canAccessPage(page)) {
    if (page !== 'dashboard') {
      showToast('Anda tidak memiliki hak akses ke halaman ini.', 'error');
      navigateTo('dashboard');
    }
    return;
  }

  CURRENT_PAGE = page;
  LAST_NAV_PARAMS = params || null;
  PAGE_NAV_TOKEN++;
  pushNavHistory_(page, params);

  if (page === 'soDetail') {
    if (params && params.__fromSoStack) {
    } else if (CURRENT_PAGE_BEFORE_SO_NAV === 'soDetail' && CURRENT_SO_DETAIL && CURRENT_SO_DETAIL.soId !== (params && params.soId)) {
      SO_NAV_STACK.push(CURRENT_SO_DETAIL.soId);
    } else if (CURRENT_PAGE_BEFORE_SO_NAV !== 'soDetail') {
      SO_NAV_STACK = [];
    }
  } else {
    SO_NAV_STACK = [];
  }
  CURRENT_PAGE_BEFORE_SO_NAV = page;

  document.querySelectorAll('.nav-item[data-page]').forEach(function(item) {
    const isActive = item.getAttribute('data-page') === page;
    item.classList.toggle('active', isActive);
    if (isActive) {
      const parentGroup = item.closest('.nav-group');
      if (parentGroup && parentGroup.classList.contains('collapsed')) {
        setNavGroupCollapsed_(parentGroup, false);
      }
    }
  });
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || '';

  switch (page) {
    case 'dashboard': safeRenderPage(renderDashboard); break;
    case 'itemMaster': safeRenderPage(renderItemMaster, params); break;
    case 'categoryManagement': safeRenderPage(renderCategoryManagement); break;
    case 'stockOpname': safeRenderPage(renderStockOpname, params); break;
    case 'riwayat': safeRenderPage(renderRiwayat, params); break;
    case 'laporan': safeRenderPage(renderLaporan, params); break;
    case 'auditSelisih': safeRenderPage(renderAuditSelisih, params); break;
    case 'perbandinganPeriode': safeRenderPage(renderPerbandinganPeriode, params); break;
    case 'userManagement': safeRenderPage(renderUserManagement); break;
    case 'storeManagement': safeRenderPage(renderStoreManagement); break;
    case 'activityLog': safeRenderPage(renderActivityLog); break;
    case 'rolePermission': safeRenderPage(renderRolePermission); break;
    case 'soDetail': safeRenderPage(renderSoDetail, params && params.soId); break;
    default: safeRenderPage(renderDashboard);
  }

  if (_PREFETCH_QUEUE && _PREFETCH_QUEUE.length) {
    const idx = _PREFETCH_QUEUE.findIndex(function(c) { return c.page === page; });
    if (idx !== -1) _PREFETCH_QUEUE.splice(idx, 1);
    schedulePrefetchResume();
  }
}

function safeRenderPage(fn) {

        console.error('Gagal memuat halaman (' + (fn.name || 'render') + '):', err);
        showToast('Gagal memuat halaman: ' + (err && err.message ? err.message : 'terjadi kesalahan.'), 'error');

    console.error('Gagal memuat halaman (' + (fn.name || 'render') + '):', err);

}

function initSearchableSelect(containerEl, options, opts) {
  opts = opts || {};
  let currentOptions = options || [];
  let selectedValue = opts.initialValue || '';

  containerEl.classList.add('searchable-select');
  containerEl.innerHTML =
    '<input type="text" class="searchable-select-input" autocomplete="off" placeholder="' + escapeHtml(opts.placeholder || 'Cari...') + '">' +
    '<div class="searchable-select-panel"></div>';

  const inputEl = containerEl.querySelector('.searchable-select-input');
  const panelEl = containerEl.querySelector('.searchable-select-panel');

  function labelFor(value) {
    const found = currentOptions.find(function(o) { return String(o.value) === String(value); });
    if (!found) return '';
    return found.sublabel ? (found.label + ' — ' + found.sublabel) : found.label;
  }

  function renderPanel(query) {
    const q = String(query || '').trim().toLowerCase();
    const filtered = !q ? currentOptions : currentOptions.filter(function(o) {
      return (String(o.label).toLowerCase().indexOf(q) !== -1) ||
             (o.sublabel && String(o.sublabel).toLowerCase().indexOf(q) !== -1);
    });
    if (!filtered.length) {
      panelEl.innerHTML = '<div class="searchable-select-empty">Tidak ada hasil ditemukan.</div>';
      return;
    }
    const limited = filtered.slice(0, 150);
    panelEl.innerHTML = limited.map(function(o) {
      const activeClass = String(o.value) === String(selectedValue) ? ' active' : '';
      return '<div class="searchable-select-option' + activeClass + '" data-value="' + escapeHtml(String(o.value)) + '">' +
        '<strong>' + escapeHtml(o.label) + '</strong>' +
        (o.sublabel ? '<span>' + escapeHtml(o.sublabel) + '</span>' : '') +
      '</div>';
    }).join('') + (filtered.length > limited.length ?
      '<div class="searchable-select-empty">+' + (filtered.length - limited.length) + ' hasil lain, pertajam kata kunci pencarian...</div>' : '');
  }

  function open() {
    containerEl.classList.add('open');
    renderPanel(inputEl.value === labelFor(selectedValue) ? '' : inputEl.value);
  }
  function close() {
    containerEl.classList.remove('open');
    inputEl.value = labelFor(selectedValue);
  }

  inputEl.addEventListener('focus', function() { inputEl.select(); open(); });
  inputEl.addEventListener('input', function() { renderPanel(inputEl.value); });
  inputEl.addEventListener('click', function() { open(); });
  panelEl.addEventListener('mousedown', function(e) {
    const opt = e.target.closest('.searchable-select-option');
    if (!opt) return;
    e.preventDefault(); 
    selectedValue = opt.getAttribute('data-value');
    inputEl.value = labelFor(selectedValue);
    close();
    if (opts.onChange) opts.onChange(selectedValue);
  });
  document.addEventListener('click', function(e) {
    if (!containerEl.contains(e.target)) close();
  });

  inputEl.value = labelFor(selectedValue);

  return {
    getValue: function() { return selectedValue; },
    setOptions: function(newOptions) { currentOptions = newOptions || []; renderPanel(inputEl.value); }
  };
}

function attachFormValidation(fieldConfigs, submitBtn) {
  const state = {}; 

  function fieldEl(id) { return document.getElementById(id); }
  function groupOf(input) {
    return input.closest('.form-group') || input.parentElement;
  }

  function showFieldError(input, message) {
    const group = groupOf(input);
    if (!group) return;
    group.classList.add('has-error');
    let msgEl = group.querySelector('.field-error');
    if (!msgEl) {
      msgEl = document.createElement('div');
      msgEl.className = 'field-error';
      group.appendChild(msgEl);
    }
    msgEl.innerHTML = FIELD_ERROR_ICON + '<span>' + escapeHtml(message) + '</span>';
  }
  function clearFieldError(input) {
    const group = groupOf(input);
    if (!group) return;
    group.classList.remove('has-error');
    const msgEl = group.querySelector('.field-error');
    if (msgEl) msgEl.remove();
  }

  function updateSubmitState() {
    if (!submitBtn) return;
    const allValid = Object.keys(state).every(function(id) { return state[id]; });
    submitBtn.disabled = !allValid;
  }

  function validateField(cfg, opts) {
    opts = opts || {};
    const input = fieldEl(cfg.id);
    if (!input) { state[cfg.id] = true; return true; }
    const value = String(input.value == null ? '' : input.value).trim();
    const required = cfg.required !== false;

    let error = null;
    if (required && !value) {
      error = cfg.label ? (cfg.label + ' wajib diisi') : 'Wajib diisi';
    } else if (value && typeof cfg.validate === 'function') {
      error = cfg.validate(value) || null;
    }

    state[cfg.id] = !error;
    if (!opts.silent) {
      if (error) showFieldError(input, error); else clearFieldError(input);
    }
    updateSubmitState();
    return !error;
  }

  fieldConfigs.forEach(function(cfg) {
    const input = fieldEl(cfg.id);
    if (!input) { state[cfg.id] = true; return; }
    validateField(cfg, { silent: true });
    input.addEventListener('input', function() { validateField(cfg); });
    input.addEventListener('change', function() { validateField(cfg); });
    input.addEventListener('blur', function() { validateField(cfg); });
  });

  updateSubmitState();

  return {
    isValid: function() { return Object.keys(state).every(function(id) { return state[id]; }); },
    validateAll: function() {
      let allValid = true;
      fieldConfigs.forEach(function(cfg) {
        if (!validateField(cfg)) allValid = false;
      });
      return allValid;
    }
  };
}

function parseDelimitedFile(text) {
  const firstLine = text.split(/\r?\n/)[0] || '';
  const candidates = ['\t', ';', ','];
  let delimiter = ',';
  let maxCount = 0;
  candidates.forEach(function(d) {
    const count = firstLine.split(d).length - 1;
    if (count > maxCount) {
      maxCount = count;
      delimiter = d;
    }
  });

  const lines = text.split(/\r?\n/).filter(function(l) { return l.trim() !== ''; });
  if (lines.length < 1) return { headers: [], rows: [] };
  const headers = lines[0].split(delimiter).map(function(h) { return h.trim().replace(/^"|"$/g, ''); });
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(delimiter).map(function(c) { return c.trim().replace(/^"|"$/g, ''); });
    rows.push(cols);
  }
  return { headers: headers, rows: rows };
}

function readFileAsText(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function(e) { resolve(e.target.result); };
    reader.onerror = function() { reject(new Error('Gagal membaca file.')); };
    reader.readAsText(file);
  });
}

function readFileAsArrayBuffer(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function(e) { resolve(e.target.result); };
    reader.onerror = function() { reject(new Error('Gagal membaca file.')); };
    reader.readAsArrayBuffer(file);
  });
}

async function parseImportFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'xlsx' || ext === 'xls') {
    if (typeof XLSX === 'undefined') {
      throw new Error('Modul pembaca Excel gagal dimuat. Coba muat ulang halaman.');
    }
    const buffer = await readFileAsArrayBuffer(file);
    const workbook = XLSX.read(buffer, { type: 'array' });
    const firstSheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[firstSheetName];
    const rowsRaw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', blankrows: false, raw: false });
    if (!rowsRaw.length) return { headers: [], rows: [] };
    const headers = rowsRaw[0].map(function(h) { return String(h).trim(); });
    const rows = rowsRaw.slice(1).map(function(r) { return r.map(function(c) { return String(c == null ? '' : c).trim(); }); });
    return { headers: headers, rows: rows };
  }
  const text = await readFileAsText(file);
  return parseDelimitedFile(text);
}

        { type: 'date', id: 'dashDateFilter', label: 'Tanggal SO' }
      ]);
    }
  }

  if (showPicker) {
    bindFilterBar({
      onApply: function() { loadDashboardData(); loadTrenData(); },
      onReset: function() {
        document.getElementById('dashStoreFilter').value = '';
        document.getElementById('dashDateFilter').value = '';
        loadDashboardData();
        loadTrenData();
      }
    });
  }
  loadWeeklySoStatus();
  const sortToggle = document.getElementById('topItemsSortToggle');
  if (sortToggle) {
    sortToggle.addEventListener('click', function(e) {
      const btn = e.target.closest('.mini-toggle-btn');
      if (!btn) return;
      sortToggle.querySelectorAll('.mini-toggle-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      TOP_ITEMS_SORT = btn.dataset.sort;
      renderTopItemsTable(TOP_ITEMS_CACHE);
    });
  }

  // Selama data dashboard masih dimuat (skeleton -> konten asli), tinggi
  // halaman berubah-ubah drastis di banyak titik sekaligus, yang bisa bikin
  // posisi scroll "melompat" balik ke atas kalau user sedang scroll di
  // momen itu — akibatnya pull-to-refresh ke-trigger tanpa diminta. Flag
  // ini dipakai setupPullToRefresh() untuk menahan diri selama reflow ini
  // masih berlangsung.
  // FIX "dashboard berat pas awal login": sebelumnya 3 pemanggilan data
  // ini (stat grid + 2 grafik + aktivitas terbaru) ditembak BARENGAN detik
  // itu juga user baru saja login — pas banget numpuk sama proses render
  // halaman & (sebelumnya) proses login itu sendiri, jadi kerasa berat/lag
  // terutama di HP yang kurang kencang. Sekarang stat grid (paling
  // penting, bikin dashboard kerasa "sudah kebuka") dimuat duluan, baru
  // 150ms kemudian grafik & aktivitas terbaru menyusul — mengurangi beban
  // puncak di momen paling kritis (baru login) tanpa bikin total waktu
  // muat jadi jauh lebih lama.
  window._dashboardReflowing = true;
  const dashMainJob = loadDashboardData();
  const dashRestJob = new Promise(function(resolve) {
    setTimeout(function() {
      Promise.allSettled([loadTrenData(), loadRecentActivity()]).then(resolve);
    }, 150);
  });
  Promise.allSettled([dashMainJob, dashRestJob]).finally(function() {
    setTimeout(function() { window._dashboardReflowing = false; }, 200);
  });
  bindTipeSoToggle('dashboard', function() {
    window._dashboardReflowing = true;
    Promise.allSettled([
      loadDashboardData(),
      loadTrenData(),
      loadWeeklySoStatus(),
      loadRecentActivity()
    ]).finally(function() {
      window._dashboardReflowing = false;
    });
  });
}

async function loadRecentActivity(force) {
  const listEl = document.getElementById('dashRecentActivity');
  if (!listEl) return;
  const tipeSo = TIPE_SO_STATE.dashboard || 'Mingguan';
  const params = { currentUser: CURRENT_USER, statusFilter: 'selesai', tipeSo: tipeSo };
  const cacheKey = 'soList:' + JSON.stringify(params);

  prefetchOppositeTipeSo('dashboard', 'soList', 'getSoListForStore', function(tipe) {
    return { currentUser: CURRENT_USER, statusFilter: 'selesai', tipeSo: tipe };
  });

  const res = await getCached(cacheKey, function() {
    return callServer('getSoListForStore', params, { silent: true });
  }, force);
  if (!res.success) { listEl.innerHTML = ''; return; }
  const rows = (res.data || []).slice(0, 6); 
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.history + '</div><div class="empty-title">Belum ada aktivitas</div></div>';
    return;
  }
  listEl.innerHTML = rows.map(function(so) {
    return '<div class="recent-activity-row" title="Lihat detail SO ini" onclick="navigateTo(\'soDetail\',{soId:\'' + escapeHtml(so.soId).replace(/'/g, "\\'") + '\'})">' +
      '<div class="recent-activity-icon">' + ICONS.clipboard + '</div>' +
      '<div class="recent-activity-main">' +
        '<div class="recent-activity-top">' +
          '<span class="recent-activity-store">' + escapeHtml(so.store) + '</span>' +
          '<span class="badge ' + (so.totalSelisihValue < 0 ? 'badge-red' : so.totalSelisihValue > 0 ? 'badge-green' : 'badge-gray') + '">' + formatRupiah(so.totalSelisihValue) + '</span>' +
        '</div>' +
        '<div class="recent-activity-sub">' + escapeHtml(so.soId) + ' &middot; ' + escapeHtml(so.tanggal ? formatDateDisplay(so.tanggal) : '') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function loadWeeklySoStatus(force) {
  const el = document.getElementById('weeklySoBanner');
  if (!el) return;
  const tipeSo = TIPE_SO_STATE.dashboard || 'Mingguan';
  const res = await getCached('weeklySoStatus:' + CURRENT_USER.username + ':' + tipeSo, function() {
    return callServer('getWeeklySoStatus', { currentUser: CURRENT_USER, tipeSo: tipeSo }, { silent: true });
  }, force);
  if (!res.success) { el.innerHTML = ''; return; }
  const d = res.data;
  if (!d.stores.length) { el.innerHTML = ''; return; }

  const isSingleStore = !hasAllStoreAccess() && d.stores.length === 1;
  const isBulanan = d.tipeSo === 'Bulanan';
  const periodLabel = isBulanan ? 'bulan ini' : 'minggu ini';
  const sincePhrase = isBulanan ? 'sejak tanggal 1 bulan ini' : 'sejak Senin';

  if (d.belumCount === 0) {
    el.innerHTML =
      '<div class="weekly-so-banner ok">' +
        '<div class="weekly-so-banner-icon">' + ICONS.check + '</div>' +
        '<div class="weekly-so-banner-text">' +
          '<div class="weekly-so-banner-title">' + (isSingleStore ? 'Store Anda sudah SO ' + periodLabel : 'Semua store sudah SO ' + periodLabel) +
            (isSingleStore ? '' : ' <span class="weekly-so-progress">(' + d.stores.length + ' dari ' + d.stores.length + ')</span>') +
          '</div>' +
          '<div class="weekly-so-banner-desc">' + (isSingleStore ? escapeHtml(d.stores[0].store) + ' sudah melakukan Stock Opname ' + sincePhrase + '.' : d.stores.length + ' store aktif, semuanya sudah melakukan Stock Opname ' + sincePhrase + '.') + '</div>' +
        '</div>' +
      '</div>';
    prefetchOppositeWeeklySoStatus(tipeSo);
    return;
  }

  const belum = d.stores.filter(function(s) { return !s.done; });
  const doneCount = d.stores.length - belum.length;
  const chipHtml = function(s) {
    return '<span class="store-chip clickable" title="' + (s.lastSoDate ? 'SO terakhir: ' + s.lastSoDate + ' — klik untuk buka Stock Opname' : 'Belum pernah SO — klik untuk buka Stock Opname') + '" onclick="navigateTo(\'stockOpname\',{presetStore:\'' + escapeHtml(s.store).replace(/'/g, "\\'") + '\'})">' + escapeHtml(s.store) + '</span>';
  };
  const CHIP_LIMIT = 6;
  const shownChips = belum.slice(0, CHIP_LIMIT);
  const restChips = belum.slice(CHIP_LIMIT);
  const chipsHtml = shownChips.map(chipHtml).join('') +
    (restChips.length ?
      '<span class="store-chip more-toggle" onclick="toggleWeeklySoChips(this)">+' + restChips.length + ' lainnya</span>' +
      '<span class="weekly-so-chips-extra chips-collapsed">' + restChips.map(chipHtml).join('') + '</span>'
      : '');
  el.innerHTML =
    '<div class="weekly-so-banner warn">' +
      '<div class="weekly-so-banner-icon">' + ICONS.warning + '</div>' +
      '<div class="weekly-so-banner-text">' +
        '<div class="weekly-so-banner-title">' + (isSingleStore ? 'Store Anda belum SO ' + periodLabel : belum.length + ' store belum SO ' + periodLabel) +
          (isSingleStore ? '' : ' <span class="weekly-so-progress">(' + doneCount + ' dari ' + d.stores.length + ' sudah SO)</span>') +
        '</div>' +
        '<div class="weekly-so-banner-desc" style="margin-bottom:8px;">' + (isSingleStore ?
          (belum[0].lastSoDate ? 'SO terakhir dilakukan ' + belum[0].lastSoDate + '.' : 'Belum pernah melakukan Stock Opname.') :
          'Dari ' + d.stores.length + ' store aktif' + (hasAllStoreAccess() ? '' : ' yang Anda pegang') + ', berikut yang belum melakukan Stock Opname ' + sincePhrase + '.') + '</div>' +
        '<div class="weekly-so-chips">' + chipsHtml + '</div>' +
      '</div>' +
    '</div>';

  prefetchOppositeWeeklySoStatus(tipeSo);
}

function toggleWeeklySoChips(btn) {
  const wrap = btn.parentElement;
  const extra = wrap.querySelector('.weekly-so-chips-extra');
  if (!extra) return;
  const isHidden = extra.classList.contains('chips-collapsed');
  extra.classList.toggle('chips-collapsed', !isHidden);
  btn.textContent = isHidden ? 'Sembunyikan' : '+' + extra.children.length + ' lainnya';
}

function prefetchOppositeWeeklySoStatus(tipeSo) {
  setTimeout(function() {
    if ((TIPE_SO_STATE.dashboard || 'Mingguan') !== tipeSo) return;
    const oppTipe = tipeSo === 'Bulanan' ? 'Mingguan' : 'Bulanan';
    const oppKey = 'weeklySoStatus:' + CURRENT_USER.username + ':' + oppTipe;
    if (peekCached(oppKey)) return;
    getCached(oppKey, function() {
      return callServer('getWeeklySoStatus', { currentUser: CURRENT_USER, tipeSo: oppTipe }, { silent: true });
    }).catch(function() {});
  }, 800);
}

async function loadDashboardData(force) {
  const params = { currentUser: CURRENT_USER, tipeSo: TIPE_SO_STATE.dashboard };
  if (needsStorePicker()) {
    params.store = document.getElementById('dashStoreFilter') ? document.getElementById('dashStoreFilter').value : '';
    params.tanggal = document.getElementById('dashDateFilter') ? document.getElementById('dashDateFilter').value : '';
  }

  const cacheKey = 'dashboard:' + JSON.stringify(params);
  if (!force && !peekCached(cacheKey)) {
    const statGrid = document.getElementById('dashStatGrid');
    if (statGrid) statGrid.innerHTML = skeletonStatGridHtml(10);
  }

  prefetchOppositeTipeSo('dashboard', 'dashboard', 'getDashboardData', function(tipe) {
    const p = { currentUser: CURRENT_USER, tipeSo: tipe };
    if (needsStorePicker()) {
      p.store = document.getElementById('dashStoreFilter') ? document.getElementById('dashStoreFilter').value : '';
      p.tanggal = document.getElementById('dashDateFilter') ? document.getElementById('dashDateFilter').value : '';
    }
    return p;
  });

  const res = await getCached(cacheKey, function() {
    return callServer('getDashboardData', params, { silent: true });
  }, force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  renderDashboardStatGrid(res.data, params);
}

function renderDashboardStatGrid(d, params) {
  params = params || {};
  const statGrid = document.getElementById('dashStatGrid');
  if (!statGrid) return;
  const storeParam = (needsStorePicker() && params.store) ? params.store : '';
  const tanggalParam = (needsStorePicker() && params.tanggal) ? params.tanggal : '';
  const storeClause = storeParam ? "presetStore:'" + storeParam.replace(/'/g, "\\'") + "'," : '';
  const tanggalClause = tanggalParam ? "presetDateStart:'" + tanggalParam + "',presetDateEnd:'" + tanggalParam + "'," : '';
  const totalSelisihValue = d.totalSelisihValue || 0;

  const toRiwayatSoCount = "goToRiwayat('dashboard',{" + storeClause + tanggalClause + "ddType:'soCount',ddValue:" + d.soCount + ",presetStatus:'Selesai'})";
  const toRiwayatAkurasi = "goToRiwayat('dashboard',{" + storeClause + tanggalClause + "})";
  const toRiwayatMenungguApproval = "goToRiwayat('dashboard',{" + storeClause + tanggalClause + "presetStatus:'Menunggu Approval'})";
  const dd = function(mode, expectedCount, expectedIsValue) {
    return "openItemDrilldownModal('" + storeParam.replace(/'/g, "\\'") + "','" + tanggalParam.replace(/'/g, "\\'") + "','" + mode + "'," + expectedCount + "," + (expectedIsValue ? 'true' : 'false') + ")";
  };
  const toItemSesuaiModal = dd('itemSesuai', d.itemSesuai);
  const toItemMinusModal = dd('itemMinus', d.itemMinus);
  const toItemPlusModal = dd('itemPlus', d.itemPlus);
  const toTotalItemModal = dd('totalItem', d.totalItem);
  const toTotalSelisihModal = dd('totalSelisih', d.totalSelisih);
  const toTotalSelisihValueModal = dd('totalSelisihValue', totalSelisihValue, true);
  const toStockSistemModal = dd('stockSistem', d.totalStockSistem);
  const toStockFisikModal = dd('stockFisik', d.totalStockFisik);

  const akurasiVal = (d.akurasiPct === undefined || d.akurasiPct === null) ? 0 : d.akurasiPct;
  const akurasiColor = akurasiVal >= 95 ? 'green' : (akurasiVal >= 85 ? 'orange' : 'red');

  statGrid.innerHTML =
    statCard(ICONS.percent, akurasiColor, akurasiVal.toFixed(2) + '%', 'Akurasi Stock', toRiwayatAkurasi, false,
      'Akurasi = (1 − Total Selisih Absolut ÷ Total Stock Sistem) × 100%. Dihitung dari seluruh SO berstatus Selesai sesuai filter yang aktif saat ini (Store/Tanggal/' + (TIPE_SO_STATE.dashboard === 'Bulanan' ? 'Bulanan' : 'Mingguan') + ').') +
    statCard(ICONS.clipboard, 'green', formatNumber(d.soCount), 'SO Selesai', toRiwayatSoCount) +
    statCard(ICONS.hourglass, 'blue', formatNumber(d.menungguApprovalCount), 'Pending Approval', toRiwayatMenungguApproval) +
    statCard(ICONS.box, 'gray', formatNumber(d.totalItem), 'Total Item', toTotalItemModal) +
    statCard(ICONS.target, 'gray', formatNumber(d.itemSesuai), 'Item Sesuai', toItemSesuaiModal) +
    statCard(ICONS.trendDown, 'red', formatNumber(d.itemMinus), 'Item Minus', toItemMinusModal) +
    statCard(ICONS.trendUp, 'green', formatNumber(d.itemPlus), 'Item Plus', toItemPlusModal) +
    statCard(ICONS.scale, d.totalSelisih < 0 ? 'red' : 'green', formatNumber(d.totalSelisih), 'Total Selisih Qty', toTotalSelisihModal) +
    statCard(ICONS.report, totalSelisihValue < 0 ? 'red' : 'green', formatRupiah(totalSelisihValue), 'Total Selisih Value', toTotalSelisihValueModal) +
    statCard(ICONS.layers, 'gray', formatNumber(d.totalStockSistem), 'Total Stock Sistem', toStockSistemModal) +
    statCard(ICONS.check, 'gray', formatNumber(d.totalStockFisik), 'Total Stock Fisik', toStockFisikModal);
  fitStatCardValues(statGrid);
}

const ITEM_DRILLDOWN_META = {
  totalItem:        { icon: 'box',      title: 'Total Item',                       desc: 'Menampilkan seluruh baris item yang di-SO' },
  itemSesuai:       { icon: 'check',    title: 'Item Sesuai (Selisih Nihil)',      desc: 'Menampilkan item dengan stock fisik = stock sistem (selisih 0)' },
  itemMinus:        { icon: 'trendDown',title: 'Item Minus',                       desc: 'Menampilkan item dengan stock fisik lebih SEDIKIT dari stock sistem (selisih minus)' },
  itemPlus:         { icon: 'trendUp',  title: 'Item Plus',                        desc: 'Menampilkan item dengan stock fisik lebih BANYAK dari stock sistem (selisih plus)' },
  totalSelisih:     { icon: 'scale',    title: 'Total Selisih Qty',                desc: 'Menampilkan seluruh item yang punya selisih (plus maupun minus)' },
  totalSelisihValue:{ icon: 'report',   title: 'Total Selisih Value',              desc: 'Menampilkan seluruh item yang punya selisih (plus maupun minus), diurutkan dari nilai Rupiah terbesar' },
  stockSistem:      { icon: 'layers',   title: 'Total Stock Sistem',               desc: 'Menampilkan seluruh baris item beserta stock sistem-nya' },
  stockFisik:       { icon: 'check',    title: 'Total Stock Fisik',                desc: 'Menampilkan seluruh baris item beserta stock fisik-nya' }
};
async function openItemDrilldownModal(store, tanggal, mode, expectedValue, isRupiah) {
  const meta = ITEM_DRILLDOWN_META[mode] || ITEM_DRILLDOWN_META.totalItem;
  openModal(
    modalHeaderHtml({ icon: ICONS[meta.icon], color: 'primary', title: meta.title, subtitle: meta.desc }) +
    '<div class="modal-body">' +
      '<div class="page-subtitle" style="margin-bottom:12px;">' + meta.desc + ' dari SO berstatus Selesai' + (store ? ', store <strong>' + escapeHtml(store) + '</strong>' : '') + '. Total: <strong>' + (isRupiah ? formatRupiah(expectedValue) : formatNumber(expectedValue)) + '</strong>.</div>' +
      '<div id="itemDrilldownModalBody">' + brandSpinnerHtml('Memuat...') + '</div>' +
    '</div>',
    true
  );
  const ddCacheKey = 'itemDrilldown:' + JSON.stringify({ store: store, tanggal: tanggal, mode: mode, tipeSo: TIPE_SO_STATE.dashboard });
  const cachedDd = peekCached(ddCacheKey);
  if (cachedDd && cachedDd.success) {
    renderItemDrilldownRows_(cachedDd.data, mode);
  }
  const res = await getCached(ddCacheKey, function() {
    return callServer('getItemDrilldownList', { currentUser: CURRENT_USER, store: store, tanggal: tanggal, mode: mode, tipeSo: TIPE_SO_STATE.dashboard }, { silent: true });
  });
  const bodyEl = document.getElementById('itemDrilldownModalBody');
  if (!bodyEl) return;
  if (!res.success) {
    if (cachedDd && cachedDd.success) return;
    bodyEl.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Gagal memuat data</div></div>';
    return;
  }
  renderItemDrilldownRows_(res.data, mode);
}

function renderItemDrilldownRows_(rowsIn, mode) {
  const bodyEl = document.getElementById('itemDrilldownModalBody');
  if (!bodyEl) return;
  let rows = rowsIn;
  if (mode === 'totalSelisihValue') {
    rows = rows.slice().sort(function(a, b) { return Math.abs(b.selisihValue) - Math.abs(a.selisihValue); });
  } else if (mode === 'totalSelisih') {
    rows = rows.slice().sort(function(a, b) { return Math.abs(b.selisihQty) - Math.abs(a.selisihQty); });
  }
  if (!rows.length) { bodyEl.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.target + '</div><div class="empty-title">Belum ada data</div></div>'; return; }
  const showSelisihCol = mode === 'itemMinus' || mode === 'itemPlus' || mode === 'totalSelisih' || mode === 'totalSelisihValue';
  const showRupiahCol = mode === 'totalSelisihValue';
  bodyEl.innerHTML =
    '<div class="table-wrapper" style="box-shadow:none;border:1px solid var(--gray-200);max-height:420px;overflow-y:auto;"><div class="table-scroll" style="overflow-x:auto;"><table class="table-compact" style="min-width:520px;">' +
      '<thead><tr><th>Item</th><th>SO / Store</th><th class="text-right">Stock Sistem &rarr; Fisik</th>' +
        (showRupiahCol ? '<th class="text-right">Selisih Value</th>' : (showSelisihCol ? '<th class="text-right">Selisih</th>' : '')) +
      '</tr></thead>' +
      '<tbody>' + rows.map(function(r) {
        return '<tr>' +
          '<td><div class="cell-lines">' +
            '<strong>' + escapeHtml(r.sku) + '</strong>' +
            '<span class="cell-line-sub cell-clip" title="' + escapeHtml(r.nama) + '">' + escapeHtml(r.nama) + '</span>' +
          '</div></td>' +
          '<td><div class="cell-lines">' +
            '<span>' + escapeHtml(r.soId) + '</span>' +
            '<span class="cell-line-sub cell-clip cell-clip-sm">' + escapeHtml(r.store) + '</span>' +
          '</div></td>' +
          '<td class="text-right">' + formatNumber(r.stockSistem) + ' &rarr; ' + formatNumber(r.stockFisik) + '</td>' +
          (showRupiahCol ?
            '<td class="text-right"><div class="cell-lines" style="align-items:flex-end;">' +
              '<strong style="color:' + (r.selisihValue < 0 ? 'var(--red-600,#dc2626)' : (r.selisihValue > 0 ? 'var(--green-600,#16a34a)' : 'inherit')) + ';">' + formatRupiah(r.selisihValue) + '</strong>' +
              '<span class="cell-line-sub">' + selisihBadge(r.selisihQty) + '</span>' +
            '</div></td>'
          : (showSelisihCol ? '<td class="text-right">' + selisihBadge(r.selisihQty) + '</td>' : '')) +
        '</tr>';
      }).join('') + '</tbody>' +
    '</table></div></div>';
}

async function openItemSesuaiModal(store, tanggal, expectedCount) {
  return openItemDrilldownModal(store, tanggal, 'itemSesuai', expectedCount, false);
}

function statCard(icon, color, value, label, onclick, wide, tooltip) {
  const clickable = !!onclick;
  return '<div class="stat-card solid c-' + color + (clickable ? ' clickable' : '') + (wide ? ' stat-card-wide' : '') + '"' + (clickable ? ' onclick="' + onclick + '"' : '') + '>' +
    '<div class="stat-icon ' + color + '">' + icon + '</div>' +
    '<div><div class="stat-value">' + value + '</div><div class="stat-label">' + label + '</div></div>' +
    (tooltip ? '<div class="stat-card-info" title="' + escapeHtml(tooltip) + '" onclick="event.stopPropagation();">' + ICON_MODAL_ICONS.info + '</div>' : '') +
    (clickable ? '<div class="stat-card-arrow">' + ICONS.chevronRight + '</div>' : '') +
  '</div>';
}

function fitStatCardValues(container) {
  if (!container) return;
  const els = container.querySelectorAll('.stat-value');
  const MIN_SIZE = 10;
  els.forEach(function(el) {
    el.style.fontSize = ''; 
    let size = parseFloat(getComputedStyle(el).fontSize);
    let guard = 0;
    while (el.scrollWidth > el.clientWidth + 1 && size > MIN_SIZE && guard < 25) {
      size -= 1;
      el.style.fontSize = size + 'px';
      guard++;
    }
  });
}

function statusBadge(status, isRejected) {
  const s = String(status || '').toLowerCase();
  if (s === 'selesai') return '<span class="badge badge-green">Completed</span>';
  if (s === 'menunggu approval') return '<span class="badge badge-blue">Pending Approval</span>';
  if (s === 'draft') return isRejected ? '<span class="badge badge-red">Rejected</span>' : '<span class="badge badge-orange">Draft</span>';
  return '<span class="badge badge-gray">' + escapeHtml(status) + '</span>';
}

function tipeSoBadge(tipeSo) {
  const isBulanan = tipeSo === 'Bulanan';
  return '<span class="badge ' + (isBulanan ? 'badge-purple' : 'badge-blue') + '">' + (isBulanan ? 'Bulanan' : 'Mingguan') + '</span>';
}

function selisihBadge(selisih) {
  selisih = Number(selisih) || 0;
  if (selisih > 0) return '<span class="badge badge-green">+' + formatNumber(selisih) + '</span>';
  if (selisih < 0) return '<span class="badge badge-red">' + formatNumber(selisih) + '</span>';
  return '<span class="badge badge-gray">0</span>';
}

async function loadTrenData(force) {
  const params = { currentUser: CURRENT_USER, tipeSo: TIPE_SO_STATE.dashboard };
  if (needsStorePicker()) {
    params.store = document.getElementById('dashStoreFilter') ? document.getElementById('dashStoreFilter').value : '';
  }

  const cacheKey = 'tren:' + JSON.stringify(params);

  prefetchOppositeTipeSo('dashboard', 'tren', 'getTrendData', function(tipe) {
    const p = { currentUser: CURRENT_USER, tipeSo: tipe };
    if (needsStorePicker()) {
      p.store = document.getElementById('dashStoreFilter') ? document.getElementById('dashStoreFilter').value : '';
    }
    return p;
  });

  const res = await getCached(cacheKey, function() {
    return callServer('getTrendData', params, { silent: true });
  }, force);
  if (!res.success) { showToast(res.message, 'error'); return; }
  const d = res.data;

  const trenTitleEl = document.getElementById('trenMonthlyChartTitle');
  if (trenTitleEl) trenTitleEl.textContent = d.isBulananTrend ? 'Tren Selisih per Bulan' : 'Tren Selisih per Minggu';
  LAST_TREN_IS_BULANAN = !!d.isBulananTrend;

  try { renderWeeklyTrendChart(d.weeklyTrend); }
  catch (err) {
    const el = document.getElementById('trenMonthlyChart');
    if (el) el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Gagal memuat grafik</div><div class="empty-desc">Coba muat ulang halaman.</div></div>';
  }

  try {
    const storeChartEl = document.getElementById('trenStoreChart');
    if (storeChartEl) renderStoreComparisonChart(d.storeComparison);
  } catch (err) {
    const el = document.getElementById('trenStoreChart');
    if (el) el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Gagal memuat grafik</div><div class="empty-desc">Coba muat ulang halaman.</div></div>';
  }

  try { renderTopItemsTable(d.topItems); }
  catch (err) {
    const listEl = document.getElementById('trenTopItemsList');
    if (listEl) listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Gagal memuat data</div></div>';
  }
}

let storeChartInstance = null;

function weekKeyToDateRange(row) {

function chartThemeColors() {
  const dark = isDarkMode();
  return {
    grid: dark ? 'rgba(255,255,255,0.08)' : '#f1f5f9',
    tick: dark ? '#93a09e' : '#5b6b80',

  };
}
function refreshChartsForTheme() {

function renderWeeklyTrendChart(rows) {
  LAST_WEEKLY_TREND_ROWS = rows;
  const el = document.getElementById('trenMonthlyChart');
  if (!el) return;
  if (typeof Chart === 'undefined') {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.warning + '</div><div class="empty-title">Grafik tidak dapat dimuat</div><div class="empty-desc">Periksa koneksi internet, lalu muat ulang halaman.</div></div>';
    return;
  }
  if (!rows || !rows.length) {
    const periodWord = LAST_TREN_IS_BULANAN ? 'Bulanan' : 'Mingguan';
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.trendUp + '</div><div class="empty-title">Belum ada data</div><div class="empty-desc">Grafik akan muncul setelah ada SO ' + periodWord + ' berstatus Selesai.</div></div>';
    return;
  }
  el.style.height = '210px';
  el.innerHTML = '<canvas id="monthlyChartCanvas"></canvas>';
  const ctx = document.getElementById('monthlyChartCanvas').getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, 0, 190);
  gradient.addColorStop(0, 'rgba(220,38,38,0.28)');
  gradient.addColorStop(1, 'rgba(220,38,38,0.02)');

  const theme = chartThemeColors();
  if (monthlyChartInstance) monthlyChartInstance.destroy();
  monthlyChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: rows.map(function(r) { return r.label; }),
      datasets: [{
        label: 'Selisih Qty',
        data: rows.map(function(r) { return r.selisihQty; }),
        borderColor: '#dc2626',
        backgroundColor: gradient,
        pointBackgroundColor: rows.map(function(r) { return r.selisihQty < 0 ? '#dc2626' : '#16a34a'; }),
        pointBorderColor: '#fff',
        pointBorderWidth: 2,
        pointRadius: 5,
        pointHoverRadius: 7,
        borderWidth: 2.5,
        fill: true,
        tension: 0.35
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      onClick: function(evt, elements) {
        if (!elements.length) return;
        const r = rows[elements[0].index];
        const range = weekKeyToDateRange(r);
        goToRiwayat('dashboard', { presetDateStart: range.start, presetDateEnd: range.end });
      },
      onHover: function(evt, elements) {
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: theme.tooltipBg,
          padding: 10,
          cornerRadius: 8,
          titleFont: { size: 12, weight: '700' },
          bodyFont: { size: 12 },
          callbacks: {
            label: function(ctx) {
              const r = rows[ctx.dataIndex];
              return [
                'Selisih Qty: ' + (r.selisihQty > 0 ? '+' : '') + formatNumber(r.selisihQty),
                'Selisih Value: ' + formatRupiah(r.selisihValue)

            }
          }
        }
      },
      scales: {
        y: { grid: { color: theme.grid }, ticks: { color: theme.tick, font: { size: 10.5 } } },
        x: { grid: { display: false }, ticks: { color: theme.tick, font: { size: 10.5, weight: '600' } } }
      }
    }
  });
}

let TOP_ITEMS_SORT = 'count';
let TOP_ITEMS_CACHE = [];

function renderTopItemsTable(rows) {
  TOP_ITEMS_CACHE = rows || [];
  const listEl = document.getElementById('trenTopItemsList');
  const titleEl = document.getElementById('topItemsTitle');
  if (titleEl) titleEl.textContent = TOP_ITEMS_SORT === 'value' ? 'Top 10 Item Kerugian Terbesar' : 'Top 10 Item Paling Sering Selisih';
  if (!listEl) return;
  if (!rows || !rows.length) {
    listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.target + '</div><div class="empty-title">Belum ada data selisih</div></div>';
    return;
  }

  const byCount = rows.slice().sort(function(a, b) { return b.count - a.count || b.totalSelisihValueAbs - a.totalSelisihValueAbs; });
  const byValue = rows.slice().sort(function(a, b) { return b.totalSelisihValueAbs - a.totalSelisihValueAbs; });
  const rankByCount = {}, rankByValue = {};
  byCount.forEach(function(r, i) { rankByCount[r.sku] = i + 1; });
  byValue.forEach(function(r, i) { rankByValue[r.sku] = i + 1; });

  const sorted = TOP_ITEMS_SORT === 'value' ? byValue : byCount;

  const maxVal = TOP_ITEMS_SORT === 'value'
    ? Math.max.apply(null, sorted.map(function(r) { return r.totalSelisihValueAbs; }))
    : Math.max.apply(null, sorted.map(function(r) { return r.count; }));

  listEl.innerHTML = sorted.map(function(r, idx) {
    const rank = idx + 1;
    const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    const barPct = maxVal > 0 ? Math.max(4, Math.round((TOP_ITEMS_SORT === 'value' ? r.totalSelisihValueAbs : r.count) / maxVal * 100)) : 0;

    const primaryHtml = TOP_ITEMS_SORT === 'value'
      ? '<span class="top-item-primary-value">' + formatRupiah(r.totalSelisihValueAbs) + '</span>'
      : '<span class="top-item-primary-value">' + r.count + 'x</span>';
    const secondaryHtml = TOP_ITEMS_SORT === 'value'
      ? '<span class="top-item-secondary">' + r.count + 'x kejadian</span>'
      : '<span class="top-item-secondary">' + formatRupiah(r.totalSelisihValueAbs) + '</span>';

    const otherRank = TOP_ITEMS_SORT === 'value' ? rankByCount[r.sku] : rankByValue[r.sku];
    const rankDiff = Math.abs(rank - otherRank);
    const shiftHtml = rankDiff >= 3
      ? '<span class="top-item-rankshift" title="Peringkat #' + rank + ' di sini, tapi #' + otherRank + ' di mode ' + (TOP_ITEMS_SORT === 'value' ? 'Frekuensi' : 'Value') + '">' +
          (TOP_ITEMS_SORT === 'value' ? (otherRank > rank ? '↑' : '↓') : (otherRank < rank ? '↓' : '↑')) +
          ' #' + otherRank + ' di ' + (TOP_ITEMS_SORT === 'value' ? 'Frekuensi' : 'Value') +
        '</span>'
      : '';

    return '<div class="top-item-row" title="Lihat item ini di Item Master" onclick="navigateTo(\'itemMaster\',{presetSearch:\'' + escapeHtml(r.sku).replace(/'/g, "\\'") + '\',highlightSku:\'' + escapeHtml(r.sku).replace(/'/g, "\\'") + '\',ddCount:' + r.count + ',ddQty:' + r.totalSelisihQty + ',ddValue:' + r.totalSelisihValueAbs + '})">' +
      '<span class="rank-badge ' + rankClass + '">' + rank + '</span>' +
      '<div class="top-item-main">' +
        '<div class="top-item-head">' +
          '<span class="top-item-name" title="' + escapeHtml(r.nama) + '"><strong>' + escapeHtml(r.sku) + '</strong> — ' + escapeHtml(r.nama) + '</span>' +
          '<span class="top-item-stats">' +
            primaryHtml +
            secondaryHtml +
            shiftHtml +
          '</span>' +
        '</div>' +
        '<div class="top-item-bar-track"><div class="top-item-bar-fill" style="width:' + barPct + '%"></div></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function renderItemKpiCards() {
  const grid = document.getElementById('itemKpiGrid');

  const aktif = ITEM_MASTER_CACHE.filter(function(it) { return String(it.status).toLowerCase() === 'aktif'; }).length;
  const nonaktif = total - aktif;
  const selisihSkuSet = {};
  ITEM_MASTER_KPI_SELISIH_SKUS.forEach(function(sku) { selisihSkuSet[String(sku)] = true; });
  const pernahSelisih = ITEM_MASTER_CACHE.filter(function(it) { return selisihSkuSet[String(it.sku)]; }).length;

  grid.innerHTML =
    statCard(ICONS.box, 'blue', formatNumber(total), 'Total Item', "filterItemByKpi('')") +
    statCard(ICONS.check, 'green', formatNumber(aktif), 'Item Aktif', "filterItemByKpi('aktif')") +
    statCard(ICONS.toggle, 'red', formatNumber(nonaktif), 'Item Nonaktif', "filterItemByKpi('nonaktif')") +
    statCard(ICONS.target, 'orange', formatNumber(pernahSelisih), 'Item Pernah Selisih', "filterItemByKpi('selisih')");
